<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build custom trivia games and host them live: players join from their phones and buzz in.">
<title>2MixParty!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #120a24;
    --panel: #1d1238;
    --panel2: #2b1c52;
    --board: #34207a;
    --board-dk: #241453;
    --accent: #ffa8d8;
    --text: #eef1ff;
    --muted: #a797cc;
    --line: rgba(255, 255, 255, .14);
    --ok: #1f9d5c;
    --no: #d93b40;
    --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
    --serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #app { min-height: 100%; }
  button {
    font: inherit; cursor: pointer; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    padding: .5em .9em; border-radius: 8px;
  }
  button:hover:not(:disabled) { border-color: rgba(255, 255, 255, .4); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1f0d3f; border-color: transparent; font-weight: 700; }
  button.ghost { background: transparent; }
  button.danger { color: #ff9a9d; }
  button.dangerbtn { background: var(--no); border-color: transparent; font-weight: 700; }
  button.icon { background: transparent; padding: .25em .55em; }
  input, textarea {
    font: inherit; color: var(--text); width: 100%;
    background: rgba(0, 0, 0, .28); border: 1px solid var(--line);
    border-radius: 6px; padding: .45em .6em;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  kbd { font-size: .75em; border: 1px solid currentColor; border-radius: 4px; padding: 0 .35em; opacity: .7; margin-left: .4em; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  .top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .25);
  }
  .logo { font-family: var(--display); letter-spacing: .04em; color: var(--accent); font-size: 30px; margin: 0; text-shadow: 2px 2px 0 #000; font-weight: 400; }
  .logo.sm { font-size: 22px; }
  .logo.big { font-size: clamp(44px, 12vw, 72px); text-align: center; }
  .title-input { max-width: 420px; font-weight: 700; font-size: 17px; }
  .round-name { font-family: var(--display); color: var(--accent); font-size: 22px; letter-spacing: .03em; text-shadow: 2px 2px 0 #000; }
  .chip-live { font-size: 13px; padding: .25em .7em; border-radius: 999px; background: rgba(47, 191, 113, .18); color: #8ff0bd; border: 1px solid rgba(47, 191, 113, .4); white-space: nowrap; }
  .chip-live.off { background: rgba(255, 255, 255, .06); color: var(--muted); border-color: var(--line); }
  .wait { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 48px 16px; min-height: 50vh; }

  /* Home */
  .home { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 20px; align-items: center; }
  .resume {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--board-dk); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  }
  .howto { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
  .howto strong { color: var(--accent); }
  .howto p { margin: 0 0 4px; }
  .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* Editor */
  .editor { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .section-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .section-head input { max-width: 280px; font-weight: 700; }
  .section-head h2 { margin: 0; font-size: 17px; }
  .grid-wrap { overflow-x: auto; }
  .ed-grid { border-collapse: separate; border-spacing: 6px; }
  .ed-grid th, .ed-grid td { vertical-align: top; min-width: 210px; padding: 0; }
  .ed-grid .valcol { min-width: 120px; width: 120px; }
  .valcell { display: flex; gap: 2px; align-items: center; }
  .cat-h { display: flex; gap: 4px; }
  .cat-h input { font-weight: 700; text-transform: uppercase; background: var(--board-dk); }
  .cell-ed { display: flex; flex-direction: column; gap: 4px; background: rgba(52, 32, 122, .35); padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
  .cell-ed.dd { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell-ed textarea { resize: vertical; min-height: 66px; }
  .dd-toggle { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .final-ed { display: grid; gap: 8px; max-width: 720px; }
  .final-ed label { font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }

  /* Setup / panels */
  .panel { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .panel h2 { font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 30px; margin: 0 0 16px; letter-spacing: .03em; }
  .panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  .plist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .plist .prow { display: flex; gap: 6px; align-items: center; }
  .remote-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .remote-list span { background: var(--board-dk); border: 1px solid var(--line); padding: .3em .8em; border-radius: 999px; }

  /* Board */
  .board-view { height: 100%; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .board {
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
    gap: 6px; padding: 8px; background: #0a0515; min-height: 0; position: relative;
  }
  .board .cat {
    background: var(--board); display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-family: var(--display); text-transform: uppercase; color: #fff;
    font-size: clamp(11px, 1.9vw, 28px); line-height: 1.1; text-shadow: 2px 2px 0 #000; overflow: hidden;
    border-bottom: 4px solid #0a0515; overflow-wrap: anywhere;
  }
  .board .cell {
    background: var(--board); border: 0; border-radius: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); color: var(--accent); font-size: clamp(16px, 4.4vw, 60px); text-shadow: 3px 3px 0 #000;
    transition: filter .15s;
  }
  .board button.cell:hover:not(:disabled) { filter: brightness(1.3); border: 0; }
  .board .cell:disabled { opacity: 1; }
  .round-done {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, .85); border: 2px solid var(--accent); border-radius: 14px; padding: 22px 28px; text-align: center;
  }
  .round-done p { font-family: var(--display); color: var(--accent); font-size: 30px; margin: 0 0 12px; }
  .scores { display: flex; gap: 8px; padding: 8px; overflow-x: auto; background: #0a0515; align-items: stretch; }
  .player { flex: 1 1 0; min-width: 110px; background: var(--board-dk); border-radius: 6px; text-align: center; padding: 6px 8px; border: 2px solid transparent; }
  .player.you { border-color: var(--accent); }
  .pname { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #ddd0fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pscore { font-family: var(--display); font-size: clamp(20px, 2.6vw, 34px); color: #fff; background: none; border: 0; padding: 0; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .player.neg .pscore { color: #ff8f93; }
  .scores .undo { align-self: center; white-space: nowrap; }

  /* Clue overlay (host) */
  #overlay {
    position: fixed; inset: 0; z-index: 10; background: var(--board);
    display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: zoom .28s ease-out;
  }
  @keyframes zoom { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .clue-card { width: min(1150px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 22px; text-align: center; padding: 4px; }
  .clue-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--display); text-transform: uppercase; color: var(--accent); font-size: clamp(16px, 2vw, 26px); letter-spacing: .03em; }
  .clue-meta.center { justify-content: center; }
  .clue-text { font-family: var(--serif); text-transform: uppercase; font-size: clamp(22px, 4vw, 56px); line-height: 1.3; text-shadow: 3px 3px 0 #000; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer { font-family: var(--serif); color: var(--accent); font-size: clamp(18px, 2.8vw, 38px); text-shadow: 2px 2px 0 #000; white-space: pre-wrap; animation: fade .3s; }
  .answer .tag { display: block; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #ddd0fa; text-shadow: none; margin-bottom: 4px; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .reveal { align-self: center; font-size: 18px; background: rgba(0, 0, 0, .3); }
  .buzzbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-size: 14px; }
  .buzzbar .state { padding: .3em .8em; border-radius: 999px; background: rgba(0, 0, 0, .3); }
  .buzzbar .state.open { background: rgba(47, 191, 113, .3); }
  .judge { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .jrow { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, .3); padding: 6px 6px 6px 12px; border-radius: 10px; border: 2px solid transparent; }
  .jrow.first { border-color: var(--accent); background: rgba(0, 0, 0, .5); animation: pulse 1s ease-in-out 2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 168, 216, .35); } }
  .jrow.wrong { opacity: .45; }
  .jrow .who { font-weight: 700; margin-right: 4px; }
  .jrow .pos { font-family: var(--display); color: var(--accent); min-width: 1.2em; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; }
  button.no { background: var(--no); border-color: transparent; color: #fff; }
  button.ok.on, button.no.on { outline: 3px solid #fff; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .actions button { background: rgba(0, 0, 0, .3); }
  .actions button.primary { background: var(--accent); }
  .dd-title { font-family: var(--display); color: var(--accent); font-size: clamp(44px, 9vw, 120px); line-height: 1; text-shadow: 4px 4px 0 #000; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-12deg); } }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: rgba(0, 0, 0, .3); }
  .chip.on { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .chip small { opacity: .75; margin-left: 4px; }
  .wager { max-width: 220px; align-self: center; font-size: 22px; text-align: center; }
  .err { color: #ffb3b5; min-height: 1.2em; font-weight: 600; }
  .label { margin: 0; color: #ddd0fa; }

  /* Final */
  .final-view { min-height: 100vh; background: var(--board); display: flex; flex-direction: column; }
  .final-view .top { background: rgba(0, 0, 0, .3); }
  .final-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .final-cat { font-family: var(--display); font-size: clamp(28px, 5vw, 64px); text-transform: uppercase; text-shadow: 3px 3px 0 #000; }
  .wtable { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; text-align: left; }
  .wrow { display: grid; grid-template-columns: 1fr auto 150px; gap: 10px; align-items: center; background: rgba(0, 0, 0, .3); padding: 8px 12px; border-radius: 10px; }
  .wrow.judge-row { grid-template-columns: 1fr auto auto auto; }
  .timer { height: 10px; background: rgba(0, 0, 0, .4); border-radius: 5px; overflow: hidden; width: min(600px, 100%); align-self: center; }
  .timer div { height: 100%; background: var(--accent); animation-name: drain; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes drain { from { width: 100%; } to { width: 0; } }
  .podium { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; }
  .prow-r { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, .3); padding: 12px 16px; border-radius: 10px; font-size: 20px; }
  .prow-r.win { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .prow-r .s { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }

  /* Player */
  .pview { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; background: #0a0515; }
  .pview .top { background: var(--bg); }
  .you-chip { font-weight: 700; background: var(--board-dk); padding: .3em .8em; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pmain { display: flex; flex-direction: column; min-height: 0; }
  .pmain .board { flex: 1; min-height: 320px; }
  .clue-stage { flex: 1; background: var(--board); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; animation: zoom .28s ease-out; }
  .clue-stage .clue-text { font-size: clamp(20px, 4vw, 52px); }
  .queue-line { font-weight: 700; color: #fff; min-height: 1.5em; }
  .queue-line b { color: var(--accent); }
  .wager-form { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(420px, 100%); align-self: center; }
  .wager-form .wager { max-width: 260px; }
  .wager-form button { width: 100%; }
  .locked { font-size: 12px; font-weight: 700; color: #8ff0bd; background: rgba(47, 191, 113, .18); border-radius: 999px; padding: .1em .6em; margin-left: 6px; white-space: nowrap; }
  .player-join { max-width: 420px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 12px; }
  .player-join input { font-size: 20px; padding: .6em .8em; }
  button.big { font-size: 20px; padding: .7em 1em; }
  .buzz-wrap { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; justify-content: center; border-top: 1px solid var(--line); }
  .buzzer {
    width: min(460px, 100%); height: clamp(72px, 14vh, 120px); border-radius: 999px; border: 0;
    font-family: var(--display); font-size: clamp(24px, 6vw, 46px); letter-spacing: .06em;
    background: #2a1d4d; color: #a797cc; transition: transform .06s, box-shadow .06s;
  }
  .buzzer:disabled { opacity: 1; }
  .buzzer.live { background: radial-gradient(circle at 50% 30%, #ff6a6f, #c4161c 70%); color: #fff; box-shadow: 0 7px 0 #6d0a0e, 0 0 36px rgba(255, 60, 60, .45); cursor: pointer; }
  .buzzer.live:active { transform: translateY(5px); box-shadow: 0 2px 0 #6d0a0e; }
  .buzzer.up { background: var(--accent); color: #1f0d3f; animation: pulse 1s ease-in-out infinite; }
  .buzzer.queued { background: #7b5cf0; color: #fff; }
  .buzzer.out { background: #3a1d24; color: #ff9a9d; }

  /* Dialog + toast */
  #dialog { position: fixed; inset: 0; z-index: 30; background: rgba(8, 3, 20, .75); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .dlg p { margin: 0; font-size: 16px; }
  .dlg .actions { justify-content: flex-end; }
  .dlg .actions button { background: var(--panel2); }
  .dlg .actions button.primary { background: var(--accent); }
  .dlg .actions button.dangerbtn { background: var(--no); }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: #0a0515; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; max-width: calc(100% - 32px); }

  @media (max-width: 600px) {
    .board { gap: 3px; padding: 4px; }
    .board .cat { border-bottom-width: 2px; padding: 3px; }
    .wrow { grid-template-columns: 1fr 110px; }
    .wrow .sc { display: none; }
    .top .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
<style>
  .invite { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .invite h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 26px; letter-spacing: .03em; }
  .room-code { font-family: var(--display); font-size: clamp(44px, 12vw, 72px); letter-spacing: .12em; color: #fff; line-height: 1; }
  .join-link { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: rgba(0, 0, 0, .3); padding: .5em .8em; border-radius: 8px; overflow-wrap: anywhere; user-select: all; max-width: 100%; }
  .code-input { font-family: var(--display); font-size: 28px; letter-spacing: .2em; text-transform: uppercase; text-align: center; }
  .av { flex: none; display: inline-block; vertical-align: middle; }
  .ptop { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
  .ptop .pname { min-width: 0; width: auto; }
  .jrow .av { margin-right: -2px; }
  .ptag { display: inline-flex; align-items: center; gap: 10px; }
  .you-chip { display: inline-flex; align-items: center; gap: 6px; }
  .queue-line b.first { display: inline-flex; align-items: center; gap: 6px; }
  .remote-list span .av { margin-left: -4px; }
  .player-join.wide { max-width: 860px; }
  .join-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 28px; align-items: start; }
  .join-form { display: flex; flex-direction: column; gap: 12px; }
  .av-editor { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .av-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
  .av-name { font-family: var(--display); font-size: 24px; letter-spacing: .03em; text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; text-align: center; }
  .av-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .av-opt { padding: 3px; border-radius: 10px; background: rgba(0, 0, 0, .25); line-height: 0; border: 2px solid transparent; }
  .av-opt.on { border-color: var(--accent); background: var(--board-dk); }
  .swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); }
  .swatch.on { outline: 3px solid var(--accent); outline-offset: 2px; border-color: #fff; }
  @media (max-width: 720px) { .join-grid { grid-template-columns: 1fr; } }
  .player.away { opacity: .5; }
  button.pname { background: none; border: 0; padding: 0; width: 100%; font: inherit; font-size: 13px; cursor: pointer; }
  button.pname:hover { color: #fff; text-decoration: underline; }
  .remote-list span { display: inline-flex; align-items: center; gap: 4px; }
  .remote-list span .icon { padding: 0 .3em; color: var(--muted); }
  .remote-list span .icon:hover { color: #ff9a9d; }
  .remote-list .blocked { opacity: .75; text-decoration: line-through; }
  .remote-list .blocked .icon { text-decoration: none; font-size: 12px; color: var(--accent); }
  .conn-banner { background: #3a1d24; color: #ffc1c3; text-align: center; padding: 8px 16px; font-weight: 600; }

<script>
// If anything goes wrong while starting up, show it instead of leaving a blank page.
function showFatal(msg) {
  const app = document.getElementById('app');
  if (!app || app.dataset.ready) return;
  app.innerHTML = `<div class="wait"><h1 class="logo big">2MixParty!</h1>
    <p>Something went wrong while starting the game.</p>
    <p class="muted" style="font-family:monospace;max-width:640px;overflow-wrap:anywhere"></p>
    <div class="row" style="justify-content:center">
      <button onclick="location.reload()">Reload</button>
      <button onclick="try{localStorage.removeItem('jeoparty.play')}catch{};location.reload()">Clear the game in progress and reload</button>
    </div>
    <p class="hint">Your saved games are kept either way.</p></div>`;
  app.querySelector('.muted').textContent = String(msg || 'Unknown error');
}

// PeerJS (online play) loads in the background, so the page never waits on it.
function loadScript(src, ms = 15000) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    const t = setTimeout(() => resolve(false), ms);
    s.src = src; s.async = true;
    s.onload = () => { clearTimeout(t); resolve(true); };
    s.onerror = () => { clearTimeout(t); resolve(false); };
    document.head.appendChild(s);
  });
}
const peerReady = loadScript('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js');
</script>

// A player's name in their chosen colour (players added by the host without a device stay white).
const nameHtml = p => `<span class="pn" style="color:${cleanAv(p?.av).color}">${esc(p?.name)}</span>`;

// This device's avatar: remembered, or a random starting look the first time.

// ---------- Model ----------
const blankClue = () => ({ q: '', a: '', dd: false });
const newCat = rows => ({ name: '', clues: Array.from({ length: rows }, blankClue) });
function newRound(name, mult = 1) {
  const values = [200, 400, 600, 800, 1000].map(v => v * mult);
  return { name, values, categories: Array.from({ length: 5 }, () => newCat(values.length)) };
}
function blankGame() {
  return { id: uid(), created: Date.now(), title: 'Untitled game', rounds: [newRound('2MixParty!')], final: { enabled: true, category: '', q: '', a: '' } };
}
function normalize(g, id) {
  g = g && typeof g === 'object' ? g : {};
  const out = { id: id || uid(), created: +g.created || Date.now(), title: String(g.title ?? 'Imported game') };
  const rounds = Array.isArray(g.rounds) && g.rounds.length ? g.rounds : [newRound('2MixParty!')];
  out.rounds = rounds.map((R, ri) => {
    const values = Array.isArray(R?.values) && R.values.length ? R.values.map(v => parseInt(v) || 0) : [200, 400, 600, 800, 1000];
    const categories = (Array.isArray(R?.categories) ? R.categories : []).map(C => {
      const clues = Array.isArray(C?.clues) ? C.clues.slice(0, values.length) : [];
      while (clues.length < values.length) clues.push(blankClue());
      return { name: String(C?.name ?? ''), clues: clues.map(x => ({ q: String(x?.q ?? ''), a: String(x?.a ?? ''), dd: !!x?.dd })) };
    });
    return { name: String(R?.name ?? `Round ${ri + 1}`), values, categories };
  });
  const f = g.final || {};
  out.final = { enabled: f.enabled ?? true, category: String(f.category ?? ''), q: String(f.q ?? ''), a: String(f.a ?? '') };
  return out;
}
function sampleGame() {

let games = [];
let play = null;
let view = { name: 'home' };

const gameById = id => games.find(g => g.id === id);
const editGame = () => gameById(view.gameId);
const playGame = () => play && gameById(play.gameId);
const player = id => play?.players.find(p => p.id === id);
const filled = clue => clue.q.trim() !== '';

function setPath(obj, path, val) {
  const k = path.split('.');
  let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}

// ---------- Persistence (this browser) ----------
const saveGames = () => lsSet('jeoparty.games', games);
const touch = () => saveGames();
const savePlay = () => lsSet('jeoparty.play', play);

// ---------- Live state for players ----------
let liveJson = '';
function publishLive() {
  if (role !== 'host') return;
  const s = JSON.stringify(buildLive());
  if (s === liveJson) return;
  liveJson = s;
  for (const rec of conns.values()) if (rec.role) send(rec, { type: 'state', state: JSON.parse(s) });
}
function send(rec, msg) { try { if (rec.conn.open) rec.conn.send(msg); } catch {} }

// What players are allowed to see: no correct responses until revealed, no unrevealed clue text.
function buildLive() {
  const g = playGame();
  if (!g) return { phase: 'idle' };
  const base = { title: g.title, players: play.players.map(({ id, name, av, score }) => ({ id, name, av: av || null, score, away: isAway(id) })) };
  if (play.final) {
    const f = g.final, F = play.final;
    return { ...base, phase: 'final', final: {
      stage: F.stage, category: f.category,
      q: ['clue', 'reveal'].includes(F.stage) ? f.q : null,
      a: F.stage === 'reveal' ? f.a : null,
      timerEnd: F.stage === 'clue' ? (F.timerEnd || null) : null,
      token: F.stage === 'wager' ? (F.token || null) : null,
      locked: F.stage === 'wager' ? Object.keys(F.submitted || {}) : [],
    } };
  }
  const r = play.round, R = g.rounds[r];
  const out = { ...base, phase: 'board', round: roundInfo(g, r) };
  const cl = play.clue;
  if (cl) {
    const clue = R.categories[cl.c].clues[cl.i];
    const showQ = cl.stage === 'clue';
    out.clue = {
      token: cl.token, stage: cl.stage, cat: R.categories[cl.c].name, value: R.values[cl.i],
      dd: !!clue.dd, ddName: cl.ddPlayer ? (player(cl.ddPlayer)?.name || '') : '',
      wager: showQ && cl.ddPlayer ? cl.wager : null,
      q: showQ ? clue.q : null, a: cl.revealed ? clue.a : null, revealed: !!cl.revealed,
      open: !!cl.open, queue: cl.queue, lockout: cl.wrong,
    };
  }

}
function roundInfo(g, r) {
  const R = g.rounds[r];
  return {
    name: R.name, cats: R.categories.map(C => C.name), values: R.values,
    open: R.categories.map((C, c) => C.clues.map((cl, i) => filled(cl) && !play.used[`${r}-${c}-${i}`] ? 1 : 0)),
  };
}

function adjust(pid, delta) {
  const p = player(pid);
  if (!p || !delta) return;
  p.score += delta;
  play.log.push({ pid, delta });
  if (play.log.length > 200) play.log.shift();
  savePlay();
}
function roundComplete() {
  const info = roundInfo(playGame(), play.round);
  return info.cats.length > 0 && info.open.every(col => col.every(v => !v));
}
function newPlay(gameId, players) {
  return { gameId, players, round: 0, used: {}, log: [], clue: null, final: null };
}

// ---------- Sound ----------
// One shared AudioContext, unlocked by the viewer's first click (browsers block sound before that).
let audioCtx = null;
let muted = lsGet('jeoparty.muted', false);
function audio() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch { return null; }
}
function tone(freq, dur, { type = 'sine', gain = .25, when = 0 } = {}) {
  const a = !muted && audio();
  if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.start(t); o.stop(t + dur + .02);
}
function beep(freq = 523, dur = 1.2) { tone(freq, dur); }
// Game-show buzzer: a bright two-note "ding-ding" for the first buzz, a single softer blip for anyone after.
function buzzSound(first = true) {
  if (first) {
    tone(1046, .35, { type: 'triangle', gain: .3 });
    tone(1318, .5, { type: 'triangle', gain: .3, when: .12 });
    tone(523, .3, { type: 'square', gain: .05 });
  } else {
    tone(784, .25, { type: 'triangle', gain: .18 });
  }
}
function soundButton() {
  return `<button class="ghost" data-act="toggle-sound" title="${muted ? 'Turn sound on' : 'Turn sound off'}" aria-pressed="${!muted}">${muted ? 'Sound off' : 'Sound on'}</button>`;
}

// ---------- Dialog + toast ----------
// A dialog with several choices; resolves the chosen key, or null when dismissed.
function choose(message, buttons) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(message)}">
      <p>${esc(message)}</p>
      <div class="actions">${buttons.map(b => `<button class="${b.cls || ''}" data-dlg="${esc(b.key)}">${esc(b.label)}</button>`).join('')}</div></div>`;
    d.hidden = false;
    d.querySelector('[data-dlg]').focus();
    const done = v => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; resolve(v); };
    d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg); else if (e.target === d) done(null); };
    d.onkeydown = e => { if (e.key === 'Escape') done(null); e.stopPropagation(); };
  });
}
function ask(message, { ok = 'OK', cancel = 'Cancel', input = null, danger = false } = {}) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(message)}">
      <p>${esc(message)}</p>
      ${input !== null ? `<input id="dlg-input" value="${esc(input)}">` : ''}
      <div class="actions">${cancel ? `<button data-dlg="0">${esc(cancel)}</button>` : ''}<button class="${danger ? 'dangerbtn' : 'primary'}" data-dlg="1">${esc(ok)}</button></div></div>`;
    d.hidden = false;
    const inp = d.querySelector('input');
    (inp || d.querySelector('[data-dlg="1"]')).focus();
    if (inp) inp.select();
    const done = yes => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; resolve(inp ? (yes ? inp.value : null) : yes); };
    d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg === '1'); else if (e.target === d) done(false); };
    d.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') done(false); e.stopPropagation(); };
  });
}

function toast(msg) {

  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

const roomCode = () => lsGet('jeoparty.room', null);
const hosted = () => /^https?:$/.test(location.protocol);
const joinLink = () => `${location.origin}${location.pathname}?join=${roomCode()}`;

function showInvite() {
  const d = $('#dialog');
  const code = roomCode();
  d.innerHTML = `<div class="invite" role="dialog" aria-modal="true" aria-label="Invite players">
    <h2>Join the game</h2>
    ${peerState === 'online' ? `
      ${hosted() ? `<p class="label">Send players this link:</p>
        <div class="join-link" id="join-link">${esc(joinLink())}</div>
        <button data-dlg="copy">Copy link</button>
        <p class="label">Or open the game page, choose <strong>Join a game</strong>, and enter the code:</p>` : `<p class="label">Players open the game's web address, choose <strong>Join a game</strong>, and enter:</p>`}
      <div class="room-code">${esc(code)}</div>`
    : `<p class="label">${peerState === 'connecting' ? 'Opening your room… try again in a moment.' : "Online play isn't reachable right now. Check your internet connection; the game still works on this screen."}</p>`}
    <div class="actions"><button class="primary" data-dlg="1">Done</button></div></div>`;
  d.hidden = false;
  d.querySelector('[data-dlg="1"]').focus();
  const close = () => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; };
  d.onclick = async e => {
    const b = e.target.closest('[data-dlg]');
    if (e.target === d || b?.dataset.dlg === '1') return close();
    if (b?.dataset.dlg === 'copy') {
      try { await navigator.clipboard.writeText(joinLink()); b.textContent = 'Copied!'; }
      catch { const r = document.createRange(); r.selectNodeContents($('#join-link')); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Press Ctrl+C to copy'; }
    }
  };
  d.onkeydown = e => { if (e.key === 'Escape' || e.key === 'Enter') close(); e.stopPropagation(); };
}

// ---------- Rendering ----------
function render() {
  const app = $('#app');
  if (role === 'player') app.innerHTML = renderPlayer();
  else if (view.name === 'home') app.innerHTML = renderHome();
  else if (view.name === 'edit') app.innerHTML = editGame() ? renderEditor() : renderHome();
  else if (view.name === 'setup') app.innerHTML = renderSetup();
  else if (view.name === 'board') app.innerHTML = playGame() ? renderBoard() : renderHome();
  else if (view.name === 'final') app.innerHTML = playGame() && play.final ? renderFinal() : renderHome();
  renderOverlay();
  publishLive();
  app.dataset.ready = '1';
}
// Re-render now, or later if the viewer is typing (a render would steal their focus).
function refresh() {
  if (role === 'host' && view.name === 'edit') { publishLive(); return; }
  if (typingInApp()) { needsRender = true; publishLive(); } else render();
}
const typingInApp = () => { const a = document.activeElement; return !!(a && a.matches?.('input, textarea') && $('#app').contains(a)); };

function connectedChip() {
  if (peerState === 'error') return `<button class="chip-live off" data-act="invite" title="Players can't join right now">Online play offline</button>`;
  if (peerState !== 'online') return `<span class="chip-live off">Opening room…</span>`;
  const n = peersList.length;
  return `<button class="chip-live" data-act="invite" title="Show how players join">Room ${esc(roomCode())} · ${n} player${n === 1 ? '' : 's'}${watchers ? ` · ${watchers} watching` : ''}</button>`;
}

function gameStats(g) {
  let n = 0, total = 0;
  g.rounds.forEach(R => R.categories.forEach(C => C.clues.forEach(cl => { total++; if (filled(cl)) n++; })));
  return `${g.rounds.length} round${g.rounds.length > 1 ? 's' : ''} · ${n}/${total} clues${g.final.enabled ? ' · Final' : ''}`;
}

function renderHome() {
  const inProgress = playGame();
  return `
  <header class="top"><h1 class="logo">2MixParty!</h1><span class="spacer"></span>${connectedChip()}
    <button class="ghost" data-act="invite">Invite players</button>
    <button class="ghost" data-act="fullscreen">⛶ Fullscreen</button></header>
  <main class="home">
    ${inProgress ? `<div class="resume"><div><strong>Game in progress:</strong> ${esc(inProgress.title)}<div class="meta">${play.players.map(p => `${esc(p.name)} ${fmt(p.score)}`).join(' · ')}</div></div>
      <span class="spacer"></span><button class="ghost" data-act="abandon">End game</button><button class="primary" data-act="resume">Resume ▶</button></div>` : ''}
    <div class="howto"><p><strong>You're the host.</strong> This screen shows the correct responses and controls the board, so keep it to yourself.</p>
      <p class="muted">Press <strong>Invite players</strong> for the join link and room code. Players join with no account, pick an avatar and get a buzzer. Put a second device on the TV and join it with "Just watch" to show the board to the room. Keep this tab open during the game: it runs the game.</p></div>
    <div class="toolbar">
      <button class="primary" data-act="new">+ New game</button>
      <button data-act="import">Import JSON</button>
      <span class="spacer"></span>
      <button class="linkish" data-act="to-player">Joining someone else's game?</button>
    </div>
    ${games.length ? `<div class="game-list">${games.map(g => `
      <div class="card">
        <h3>${esc(g.title) || '<em>Untitled</em>'}</h3>
        <div class="meta">${gameStats(g)}</div>
        <div class="row">
          <button class="primary" data-act="setup" data-id="${g.id}">▶ Play</button>
          <button data-act="edit" data-id="${g.id}">Edit</button>
          <button class="ghost" data-act="dup" data-id="${g.id}">Duplicate</button>
          <button class="ghost" data-act="export" data-id="${g.id}">Export</button>
          <button class="ghost danger" data-act="del" data-id="${g.id}">Delete</button>
        </div>
      </div>`).join('')}</div>`
    : `<div class="empty-state">No games yet. Create one or import a JSON file.</div>`}
    <p class="hint" style="margin-top:24px">Games are saved in this browser. Use Export to back them up or move them to another computer.</p>
  </main>`;
}

        <input id="rn-${r}" data-path="rounds.${r}.name" value="${esc(R.name)}" placeholder="Round name" aria-label="Round name">
        <button data-act="add-cat" data-r="${r}">+ Category</button>
        <button data-act="add-row" data-r="${r}">+ Row</button>
        <span class="spacer"></span>
        ${g.rounds.length > 1 ? `<button class="ghost danger" data-act="del-round" data-r="${r}">Delete round</button>` : ''}
      </div>
      <div class="grid-wrap"><table class="ed-grid">
        <thead><tr><th class="valcol"></th>${R.categories.map((C, c) => `

          <button class="icon" title="Remove category" data-act="del-cat" data-r="${r}" data-c="${c}">✕</button></div></th>`).join('')}
        </tr></thead>
        <tbody>${R.values.map((v, i) => `<tr>
          <td class="valcol"><div class="valcell"><input id="v-${r}-${i}" type="number" step="100" data-type="num" data-path="rounds.${r}.values.${i}" value="${v}" aria-label="Row value">
            <button class="icon" title="Remove row" data-act="del-row" data-r="${r}" data-i="${i}">✕</button></div></td>
          ${R.categories.map((C, c) => { const cl = C.clues[i], p = `rounds.${r}.categories.${c}.clues.${i}`, k = `${r}-${c}-${i}`; return `
          <td><div class="cell-ed ${cl.dd ? 'dd' : ''}">

    </section>`).join('');

  <header class="top">
    <button class="ghost" data-act="home">← Games</button>

    <span class="spacer"></span>
    <span class="meta hide-sm">Saved automatically</span>
    <button class="primary" data-act="setup" data-id="${g.id}">▶ Play</button>
  </header>

    <p class="hint">Write each clue as a statement. The correct response is shown to you (the host) only, and to players once you reveal it. Empty clues appear as blank tiles on the board.</p>
    ${rounds}

    <section class="section">
      <div class="section-head"><h2>Final 2MixParty!</h2>
        <label class="dd-toggle"><input id="f-en" type="checkbox" data-path="final.enabled" ${g.final.enabled ? 'checked' : ''}> Include</label></div>
      <div class="final-ed">
        <label for="f-cat">Category</label><input id="f-cat" data-path="final.category" value="${esc(g.final.category)}" placeholder="Category">
        <label for="f-q">Clue</label><textarea id="f-q" data-path="final.q" rows="3" placeholder="Clue">${esc(g.final.q)}</textarea>
        <label for="f-a">Correct response</label><input id="f-a" data-path="final.a" value="${esc(g.final.a)}" placeholder="Correct response">
      </div>

function renderSetup() {
  const g = gameById(view.gameId);
  if (!g) return renderHome();
  return `
  <header class="top"><button class="ghost" data-act="home">← Games</button><strong>${esc(g.title)}</strong><span class="spacer"></span>${connectedChip()}</header>
  <main class="panel">
    <h2>Who's playing?</h2>
    <h3>Joined on their devices</h3>
    ${peersList.length ? `<div class="remote-list">${peersList.map(p => `<span>${avatarSvg(p.av, 24)}${nameHtml(p)}<button class="icon" data-act="kick" data-p="${esc(p.pid)}" title="Remove ${esc(p.name)}" aria-label="Remove ${esc(p.name)}">✕</button></span>`).join('')}</div>`
      : `<p class="hint">No one yet. Players can also join after the game starts.</p>`}
    ${blocked.length ? `<h3>Removed players</h3><p class="hint">They can't rejoin until you let them back in.</p>
      <div class="remote-list">${blocked.map(b => `<span class="blocked">${esc(b.name)}<button class="icon" data-act="unblock" data-p="${esc(b.pid)}">Allow back</button></span>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:10px"><button data-act="invite">Show join link & room code</button></div>
    <h3>Players without a device</h3>
    <div class="plist">${view.players.map((n, i) => `
      <div class="prow"><input id="pn-${i}" data-pname="${i}" value="${esc(n)}" placeholder="Player or team name" aria-label="Player name">
      <button class="icon" title="Remove" data-act="del-player" data-i="${i}">✕</button></div>`).join('')}
    </div>
    <div class="row">
      ${view.players.length < 10 ? `<button data-act="add-player">+ Add player</button>` : ''}
      <span class="spacer"></span>
      <button class="primary" data-act="start">Start game ▶</button>
    </div>
    ${play ? `<p class="hint" style="margin-top:16px">Starting will replace the game currently in progress.</p>` : ''}

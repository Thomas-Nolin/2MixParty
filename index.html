}

function boardCells(info, interactive) {
  let cells = info.cats.map(n => `<div class="cat">${esc(n)}</div>`).join('');
  info.values.forEach((v, i) => info.cats.forEach((_, c) => {
    const on = info.open[c]?.[i];
    cells += interactive
      ? `<button class="cell" data-act="open" data-c="${c}" data-i="${i}" ${on ? '' : 'disabled aria-label="used"'}>${on ? fmt(v) : ''}</button>`
      : `<div class="cell">${on ? fmt(v) : ''}</div>`;
  }));
  return cells;
}

// A player who joined on a device but isn't connected right now (keeps their score; can rejoin).
const isAway = pid => !!player(pid)?.remote && !peersList.some(x => x.pid === pid);

function scoresBar(players, { host = false, you = null } = {}) {
  return `<footer class="scores">
    ${players.map(p => { const away = host ? isAway(p.id) : p.away; return `<div class="player ${p.score < 0 ? 'neg' : ''} ${p.id === you ? 'you' : ''} ${away ? 'away' : ''}">
      <div class="ptop">${avatarSvg(p.av, 34)}
      ${host ? `<button class="pname" data-act="player-menu" data-p="${p.id}" title="Set score or remove ${esc(p.name)}">${nameHtml(p)}${away ? ' · away' : ''} ▾</button>`
        : `<div class="pname">${nameHtml(p)}${p.id === you ? ' (you)' : ''}${away ? ' · away' : ''}</div>`}</div>
      ${host ? `<button class="pscore" data-act="edit-score" data-p="${p.id}" title="Click to edit score">${fmt(p.score)}</button>` : `<div class="pscore">${fmt(p.score)}</div>`}</div>`; }).join('')}
    ${host ? `<button class="ghost undo" data-act="undo" ${play.log.length ? '' : 'disabled'} title="Undo last score change">↶ Undo</button>` : ''}
  </footer>`;
}

function renderBoard() {
  const g = playGame(), r = play.round, info = roundInfo(g, r);
  const last = r === g.rounds.length - 1;
  const nextLabel = last ? (g.final.enabled ? 'Final 2MixParty! →' : 'Finish game →') : 'Next round →';
  return `
  <div class="board-view">
    <header class="top">
      <button class="ghost" data-act="home">☰ Games</button>
      <span class="round-name">${esc(info.name)}</span>
      <span class="spacer"></span>
      ${connectedChip()}
      ${soundButton()}
      <button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button>
      ${r > 0 ? `<button class="ghost" data-act="prev-round">← Prev round</button>` : ''}
      <button data-act="next-round">${nextLabel}</button>
    </header>
    <main class="board" style="--cols:${Math.max(info.cats.length, 1)}">
      ${boardCells(info, true)}
      ${roundComplete() ? `<div class="round-done"><p>Round complete!</p><button class="primary" data-act="next-round">${nextLabel}</button></div>` : ''}
    </main>
    ${scoresBar(play.players, { host: true })}
  </div>`;
}

function renderOverlay() {
  const ov = $('#overlay');
  const vc = role === 'host' && view.name === 'board' && playGame() ? play.clue : null;
  if (!vc) { ov.hidden = true; ov.innerHTML = ''; return; }
  const wasHidden = ov.hidden;
  ov.hidden = false;
  if (wasHidden) { ov.style.animation = 'none'; void ov.offsetHeight; ov.style.animation = ''; }
  const g = playGame(), R = g.rounds[vc.r], C = R.categories[vc.c], clue = C.clues[vc.i], value = R.values[vc.i];

  if (vc.stage === 'dd') {
    const p = vc.ddPlayer && player(vc.ddPlayer);
    const maxW = p ? Math.max(p.score, Math.max(...R.values)) : 0;
    ov.innerHTML = `<div class="clue-card">
      <div class="dd-title">DAILY DOUBLE!</div>
      <div class="clue-meta center">${esc(C.name)}</div>
      <p class="label">Who found it?</p>
      <div class="pick">${play.players.map(p => `<button class="chip ${vc.ddPlayer === p.id ? 'on' : ''}" data-act="dd-pick" data-p="${p.id}">${esc(p.name)}<small>${fmt(p.score)}</small></button>`).join('')}</div>
      ${p ? `<label class="label" for="dd-wager">Wager (up to ${fmt(maxW)})</label><input id="dd-wager" type="number" class="wager" data-ddwager min="0" max="${maxW}" value="${esc(vc.wager ?? '')}">` : ''}
      <div class="err">${esc(vc.err || '')}</div>
      <div class="actions"><button data-act="clue-cancel">Back to board</button><button class="primary" data-act="dd-go">Show clue →</button></div>
    </div>`;
    const w = ov.querySelector('.wager');
    if (w) { w.focus(); const n = w.value.length; try { w.setSelectionRange(n, n); } catch {} }
    return;
  }

  const dd = !!vc.ddPlayer, worth = dd ? vc.wager : value;
  const judges = dd ? [player(vc.ddPlayer)].filter(Boolean)
    : [...vc.queue.map(player).filter(Boolean), ...play.players.filter(p => !vc.queue.includes(p.id))];
  ov.innerHTML = `<div class="clue-card">
    <div class="clue-meta"><span>${esc(C.name)}</span><span>${dd ? `Daily Double · ${esc(player(vc.ddPlayer)?.name)} wagers ${fmt(worth)}` : fmt(value)}</span></div>
    <div class="clue-text">${esc(clue.q)}</div>
    ${vc.revealed ? `<div class="answer"><span class="tag">Correct response</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`
      : `<div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`}
    ${dd ? '' : `<div class="buzzbar">
      <span class="state ${vc.open ? 'open' : ''}">Buzzers ${vc.open ? 'open' : 'closed'}</span>
      <button data-act="toggle-buzz">${vc.open ? 'Close buzzers' : 'Open buzzers'}</button>
      <button data-act="reset-buzz" ${vc.queue.length ? '' : 'disabled'}>Clear buzz queue</button></div>`}
    <div class="judge">${judges.map(p => { const w = vc.wrong.includes(p.id), qi = vc.queue.indexOf(p.id); return `
      <div class="jrow ${w ? 'wrong' : ''} ${qi === 0 && !w ? 'first' : ''}">${qi >= 0 ? `<span class="pos">${qi + 1}</span>` : ''}${avatarSvg(p.av, 28)}<span class="who">${nameHtml(p)}</span>
        <button class="ok" data-act="right" data-p="${p.id}" ${w ? 'disabled' : ''} title="Correct">✓ ${fmt(worth)}</button>
        <button class="no" data-act="wrong" data-p="${p.id}" ${w ? 'disabled' : ''} title="Incorrect">✗ ${fmt(-worth)}</button></div>`; }).join('')}
    </div>
    <div class="actions">
      ${vc.revealed ? '' : `<button data-act="reveal">Show response to players<kbd>Space</kbd></button>`}
      ${dd ? '' : `<button data-act="clue-cancel">Back to board<kbd>Esc</kbd></button>`}
      ${dd ? '' : `<button class="primary" data-act="clue-done">No one got it · close</button>`}
    </div>
  </div>`;
}

function timerBar(end, total = 30000) {
  const left = end ? end - Date.now() : 0;
  if (left <= 0) return end ? `<div class="timer"><div style="width:0"></div></div>` : '';
  return `<div class="timer"><div style="animation-duration:${total}ms;animation-delay:-${Math.max(0, total - left)}ms"></div></div>`;
}
function podium(players) {
  const ranked = [...players].sort((a, b) => b.score - a.score);
  const top = ranked[0]?.score;
  const tie = ranked.filter(p => p.score === top).length > 1;
  return `<div class="dd-title" style="font-size:clamp(34px,6vw,80px)">${!ranked.length ? 'Game over' : tie ? "It's a tie!" : `${esc(ranked[0].name)} wins!`}</div>
    <div class="podium">${ranked.map(p => `<div class="prow-r ${p.score === top ? 'win' : ''}"><span class="ptag">${avatarSvg(p.av, 40)}${p.score === top ? `<span>👑 ${esc(p.name)}</span>` : nameHtml(p)}</span><span class="s">${fmt(p.score)}</span></div>`).join('')}</div>`;
}

function renderFinal() {
  const g = playGame(), f = g.final, F = play.final;
  const head = `<header class="top">
      ${F.applied ? `<button class="ghost" data-act="home">☰ Games</button>` : `<button class="ghost" data-act="back-board">← Board</button>`}
      <span class="round-name">${F.stage === 'results' ? 'Final Scores' : 'Final 2MixParty!'}</span>
      <span class="spacer"></span>${connectedChip()}${soundButton()}<button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button></header>`;
  let body = '';
  const eligible = p => p.score > 0;

  if (F.stage === 'category') {
    body = `<div class="clue-card">
      <div class="dd-title" style="font-size:clamp(36px,7vw,90px)">Final 2MixParty!</div>
      <p class="label">The category is…</p>
      <div class="final-cat">${esc(f.category) || '—'}</div>
      <div class="actions"><button class="primary" data-act="f-wagers">Enter wagers →</button></div></div>`;
  } else if (F.stage === 'wager') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <p class="label">Players with a positive score may wager up to their total. Players lock in wagers on their devices, and only you see the amounts. You can also type or change a wager here.</p>
      <div class="wtable">${play.players.map(p => `<div class="wrow"><span><strong>${esc(p.name)}</strong>${F.submitted?.[p.id] ? ' <span class="locked">locked in</span>' : ''}</span><span class="sc muted">${fmt(p.score)}</span>
        ${eligible(p) ? `<input id="fw-${p.id}" type="number" min="0" max="${p.score}" data-fwager="${p.id}" value="${esc(F.wagers[p.id] ?? '')}" placeholder="Wager" aria-label="${esc(p.name)} wager">` : `<span class="muted">Not eligible</span>`}</div>`).join('')}
      </div>
      <div class="err">${esc(F.err || '')}</div>
      <div class="actions"><button class="primary" data-act="f-clue">Show clue →</button></div></div>`;
  } else if (F.stage === 'clue') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text">${esc(f.q)}</div>
      ${timerBar(F.timerEnd)}
      <div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="actions">
        <button data-act="f-timer">${F.timerEnd ? 'Restart' : 'Start'} 30s timer</button>
        <button class="primary" data-act="f-reveal">Reveal response<kbd>Space</kbd></button>
      </div></div>`;
  } else if (F.stage === 'reveal') {
    const players = play.players.filter(eligible);
    const allJudged = players.every(p => p.id in F.results);
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text" style="font-size:clamp(18px,2.6vw,34px)">${esc(f.q)}</div>
      <div class="answer">${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="wtable">${players.length ? players.map(p => { const res = F.results[p.id]; return `<div class="wrow judge-row">
        <strong>${esc(p.name)}</strong><span class="muted">wagered ${fmt(F.wagers[p.id] || 0)}</span>
        <button class="ok ${res === true ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="1" aria-label="Correct">✓</button>
        <button class="no ${res === false ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="0" aria-label="Incorrect">✗</button></div>`; }).join('')
        : `<p class="label" style="text-align:center">No players were eligible for Final 2MixParty.</p>`}
      </div>
      <div class="actions"><button class="primary" data-act="f-apply" ${allJudged ? '' : 'disabled'}>Final scores →</button></div></div>`;
  } else {
    body = `<div class="clue-card">${podium(play.players)}
      <div class="actions"><button data-act="home">Back to games</button><button class="primary" data-act="rematch">Play again ↻</button></div></div>`;
  }
  return `<div class="final-view">${head}<main class="final-body">${body}</main></div>`;
}

// ---------- Player view ----------
function buzzState() {
  const c = live?.phase === 'board' ? live.clue : null;
  if (pstate !== 'connected') return { label: 'Reconnecting…', cls: '', off: true };
  if (!c) return { label: 'Wait for a clue', cls: '', off: true };
  if (c.dd) return { label: 'Daily Double', cls: '', off: true };
  if (c.stage !== 'clue') return { label: 'Get ready…', cls: '', off: true };
  if (!live.players.some(p => p.id === me.pid)) return { label: 'Joining…', cls: '', off: true };
  if (c.lockout.includes(me.pid)) return { label: 'Locked out', cls: 'out', off: true };
  const pos = c.queue.indexOf(me.pid);
  if (pos === 0) return { label: "You're up! Answer", cls: 'up', off: true };
  if (pos > 0) return { label: `Buzzed · #${pos + 1} in line`, cls: 'queued', off: true };
  if (me.buzzToken === c.token) return { label: 'Buzzed!', cls: 'queued', off: true };
  if (!c.open) return { label: c.revealed ? 'Clue over' : 'Buzzers closed', cls: '', off: true };
  return { label: 'BUZZ', cls: 'live', off: false };
}

function renderPlayer() {
  if (me.kicked) {
    return `<div class="player-join" style="text-align:center">
      <h1 class="logo big">2MixParty!</h1>
      <p class="round-name">You were removed from the game</p>
      <p class="muted">The host removed you from room ${esc(me.code)}. If that was a mistake, ask them to allow you back, then try again.</p>
      <button class="primary big" data-act="p-retry">Try to join again</button>
    </div>`;
  }
  if (!me.joined) {
    const opt = (k, v, preview, label) => `<button class="av-opt ${me.av[k] === v ? 'on' : ''}" data-act="av-set" data-k="${k}" data-v="${v}" title="${label}" aria-label="${label}" aria-pressed="${me.av[k] === v}">${preview}</button>`;
    const swatch = (k, v, label) => `<button class="swatch ${me.av[k] === v ? 'on' : ''}" style="background:${v}" data-act="av-set" data-k="${k}" data-v="${v}" title="${label}" aria-label="${label}" aria-pressed="${me.av[k] === v}"></button>`;
    return `<div class="player-join wide">
      <h1 class="logo big">2MixParty!</h1>
      <p class="muted" style="text-align:center">Join a game on this device. No account needed.</p>
      <div class="join-grid">
        <div class="join-form">
          <label for="join-code" class="label">Room code</label>
          <input id="join-code" class="code-input" maxlength="4" value="${esc(me.code)}" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
          <label for="join-name" class="label">Your name</label>
          <input id="join-name" maxlength="24" value="${esc(me.name)}" placeholder="e.g. Alex" autocomplete="off">
          <div class="err">${esc(me.err)}</div>
          <button class="primary big" data-act="p-join">Join as a player</button>
          <button class="ghost" data-act="p-watch">Just watch (TV screen)</button>
          <button class="linkish" data-act="to-host">Host your own game instead</button>
        </div>
        <div class="av-editor">
          <div class="av-preview">${avatarSvg(me.av, 112)}<div class="av-name" id="av-name" style="color:${me.av.color}">${esc(me.name) || 'Your name'}</div></div>
          <p class="label">Hairstyle</p>
          <div class="av-opts">${AV.hair.map(h => opt('hair', h, avatarSvg({ ...me.av, hair: h, acc: 'none' }, 38), AV_LABEL.hair[h])).join('')}</div>
          <p class="label">Accessory</p>
          <div class="av-opts">${AV.acc.map(x => opt('acc', x, avatarSvg({ ...me.av, acc: x }, 38), AV_LABEL.acc[x])).join('')}</div>
          <p class="label">Skin tone</p>
          <div class="av-opts">${AV.skin.map((c, i) => swatch('skin', c, `Skin tone ${i + 1}`)).join('')}</div>
          <p class="label">Name colour</p>
          <div class="av-opts">${AV.color.map((c, i) => swatch('color', c, `Name colour ${i + 1}`)).join('')}</div>
        </div>
      </div>
    </div>`;
  }
  const L = live, you = L?.players?.find(p => p.id === me.pid);
  let main;
  if (pstate === 'notfound' && !L) {
    main = `<div class="wait"><p class="round-name">Room ${esc(me.code)} not found</p><p class="muted">Check the code with your host, and make sure their game page is open. Retrying…</p>
      <button data-act="p-leave">Change code</button></div>`;
  } else if (!L || L.phase === 'idle' || !L.players) {
    main = `<div class="wait"><p class="round-name">${pstate === 'connected' ? 'Waiting for the host…' : 'Connecting…'}</p><p class="muted">The board appears here as soon as the game starts.</p></div>`;
  } else if (L.phase === 'final') {
    main = playerFinal(L);
  } else if (L.clue) {
    const c = L.clue, name = id => { const p = L.players.find(p => p.id === id); return p ? nameHtml(p) : 'Someone'; };
    main = c.stage === 'dd'
      ? `<div class="clue-stage"><div class="dd-title">DAILY DOUBLE!</div><div class="clue-meta center">${esc(c.cat)}</div>
          <p class="label">${c.ddName ? `${esc(c.ddName)} is making a wager…` : 'Who found it?'}</p></div>`
      : `<div class="clue-stage">
          <div class="clue-meta"><span>${esc(c.cat)}</span><span>${c.dd ? `Daily Double · ${esc(c.ddName)} · ${fmt(c.wager)}` : fmt(c.value)}</span></div>
          <div class="clue-text">${esc(c.q)}</div>
          ${c.revealed ? `<div class="answer">${esc(c.a || '')}</div>` : ''}
          <div class="queue-line">${!c.dd && c.queue.length ? `<b class="first">${avatarSvg(L.players.find(p => p.id === c.queue[0])?.av, 28)}${name(c.queue[0])}</b> buzzed in first${c.queue.length > 1 ? ` · then ${c.queue.slice(1).map(name).join(', ')}` : ''}` : ''}</div>
        </div>`;
  } else {
    main = `<div class="board" style="--cols:${Math.max(L.round.cats.length, 1)}">${boardCells(L.round, false)}</div>`;
  }
  const b = buzzState();
  const banner = pstate === 'lost' ? `<div class="conn-banner">Connection to the host lost. Reconnecting…</div>` : '';
  return `<div class="pview">
    <header class="top">
      <span class="logo sm">2MixParty!</span>
      ${L?.round && L.phase === 'board' ? `<span class="muted hide-sm">${esc(L.round.name)}</span>` : ''}
      <span class="spacer"></span>
      <span class="you-chip">${me.watch ? 'Watching' : `${avatarSvg(me.av, 24)}${nameHtml(me)}${you ? ` · ${fmt(you.score)}` : ''}`}</span>
      <button class="ghost" data-act="p-leave">${me.watch ? 'Join' : 'Edit profile'}</button>
      ${soundButton()}
      <button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button>
    </header>
    <main class="pmain">${banner}${main}</main>
    ${L?.players?.length ? scoresBar(L.players, { you: me.watch ? null : me.pid }) : '<div></div>'}
    ${me.watch ? '' : `<div class="buzz-wrap"><button class="buzzer ${b.cls}" data-act="buzz" ${b.off ? 'disabled' : ''}>${esc(b.label)}</button></div>`}
  </div>`;
}

function playerFinal(L) {
  const F = L.final;
  let inner;
  if (F.stage === 'results') inner = podium(L.players);
  else if (F.stage === 'category' || F.stage === 'wager') inner = `<div class="dd-title" style="font-size:clamp(36px,8vw,90px)">Final 2MixParty!</div>
      <p class="label">The category is</p><div class="final-cat">${esc(F.category)}</div>
      ${F.stage === 'wager' ? playerWager(L, F) : ''}`;
  else inner = `<div class="clue-meta center">${esc(F.category)}</div><div class="clue-text">${esc(F.q)}</div>
      ${F.stage === 'clue' ? timerBar(F.timerEnd) : `<div class="answer">${esc(F.a || '')}</div>`}`;
  return `<div class="clue-stage">${inner}</div>`;
}

function playerWager(L, F) {
  const you = L.players.find(p => p.id === me.pid);
  if (me.watch || !you) return `<p class="label">Players are locking in their wagers…</p>`;
  if (you.score <= 0) return `<p class="label">You need a positive score to wager in Final 2MixParty. Sit tight and enjoy the clue.</p>`;
  const locked = F.locked.includes(me.pid) && me.fwSent?.token === F.token;
  return `<div class="wager-form">
      <label class="label" for="fw-input">Your wager ($0 to ${fmt(you.score)})</label>
      <input id="fw-input" type="number" inputmode="numeric" class="wager" min="0" max="${you.score}" value="${esc(me.fwDraft)}" placeholder="0">
      <div class="err">${esc(me.fwErr)}</div>
      <button class="primary big" data-act="p-wager" ${pstate === 'connected' ? '' : 'disabled'}>${locked ? 'Change wager' : 'Lock in wager'}</button>
      <p class="label">${locked ? `Locked in: <strong>${fmt(me.fwSent.w)}</strong>. You can change it until the host shows the clue.`
        : me.fwSent?.token === F.token ? 'Sending…' : 'Only the host sees your wager.'}</p>
    </div>`;
}

// ---------- Actions ----------
function goFinal() {
  const f = playGame().final;
  play.clue = null;
  play.final = f.enabled && f.q.trim() ? { stage: 'category', wagers: {}, results: {}, applied: false, timerEnd: null } : { stage: 'results', applied: true };
  savePlay();
  view = { name: 'final' };
  render();
}
function markUsed() {
  const { r, c, i } = play.clue;
  play.used[`${r}-${c}-${i}`] = true;
  play.clue = null;
  savePlay();
  render();
}
function clueWorth() {
  const vc = play.clue;
  return vc.ddPlayer ? vc.wager : playGame().rounds[vc.r].values[vc.i];
}
function exportGame(g) {
  const { id, ...data } = g;
  const name = `${(g.title || 'game').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'game'}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const actions = {
  home() { view = { name: 'home' }; render(); },
  fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => toast('Fullscreen isn’t available here.'));
  },
  invite() { showInvite(); },
  'toggle-sound'() {
    muted = !muted; lsSet('jeoparty.muted', muted);
    if (!muted) beep(880, .2);
    render();
  },
  new() { const g = blankGame(); games.push(g); touch(); view = { name: 'edit', gameId: g.id }; render(); },
  edit(d) { view = { name: 'edit', gameId: d.id }; render(); },
  dup(d) {
    const g = clone(gameById(d.id));
    g.id = uid(); g.title += ' (copy)'; g.created = Date.now();
    games.push(g); touch(); render();
  },
  async del(d) {
    const g = gameById(d.id);
    if (!await ask(`Delete "${g.title}"? This can't be undone.`, { ok: 'Delete', danger: true })) return;
    if (play?.gameId === d.id) { play = null; savePlay(); }
    games = games.filter(x => x.id !== d.id); saveGames(); render();
  },
  export(d) { exportGame(gameById(d.id)); },
  import() { $('#file').value = ''; $('#file').click(); },
  resume() { view = { name: play.final ? 'final' : 'board' }; render(); },
  async abandon() {
    if (!await ask('End the game in progress? Scores will be cleared.', { ok: 'End game', danger: true })) return;
    play = null; savePlay(); render();
  },
  'to-player'() { location.href = `${location.pathname}?join=`; },
  'to-host'() { location.href = location.pathname; },

  // Editor
  'add-cat'(d) { const R = editGame().rounds[+d.r]; R.categories.push(newCat(R.values.length)); touch(); render(); },
  async 'del-cat'(d) {
    const R = editGame().rounds[+d.r], C = R.categories[+d.c];
    if ((C.name || C.clues.some(filled)) && !await ask(`Remove category "${C.name || 'untitled'}" and its clues?`, { ok: 'Remove', danger: true })) return;
    R.categories.splice(+d.c, 1); touch(); render();
  },
  'add-row'(d) {
    const R = editGame().rounds[+d.r], v = R.values;
    v.push(v.length ? v[v.length - 1] + (v.length > 1 ? v[v.length - 1] - v[v.length - 2] : v[0]) : 200);
    R.categories.forEach(C => C.clues.push(blankClue()));
    touch(); render();
  },
  async 'del-row'(d) {
    const R = editGame().rounds[+d.r], i = +d.i;
    if (R.categories.some(C => filled(C.clues[i])) && !await ask(`Remove the ${fmt(R.values[i])} row and its clues?`, { ok: 'Remove', danger: true })) return;
    R.values.splice(i, 1); R.categories.forEach(C => C.clues.splice(i, 1));
    touch(); render();
  },
  'add-round'() {
    const g = editGame(), n = g.rounds.length + 1;
    g.rounds.push(newRound(n === 2 ? 'Double 2MixParty!' : `Round ${n}`, n));
    touch(); render();
  },
  async 'del-round'(d) {
    const g = editGame();
    if (!await ask(`Delete round "${g.rounds[+d.r].name}" and all its clues?`, { ok: 'Delete', danger: true })) return;
    g.rounds.splice(+d.r, 1); touch(); render();
  },

  // Setup
  setup(d) {
    const prev = play && play.gameId === d.id ? play.players.filter(p => !p.remote).map(p => p.name) : null;
    view = { name: 'setup', gameId: d.id, players: prev || [] };
    render();
  },
  'add-player'() { view.players.push(`Player ${view.players.length + 1}`); render(); },
  'del-player'(d) { view.players.splice(+d.i, 1); render(); },
  async start() {
    const local = view.players.map(s => s.trim()).filter(Boolean).map(name => ({ id: uid(), name, score: 0 }));
    const players = [...peersList.map(p => ({ id: p.pid, name: p.name, av: p.av, score: 0, remote: true })), ...local];
    if (!players.length) { await ask('Add at least one player, or wait for someone to join on their device.', { cancel: null }); return; }
    if (!gameById(view.gameId).rounds.some(R => R.categories.some(C => C.clues.some(filled)))) {
      if (!await ask('This game has no clues yet. Start anyway?', { ok: 'Start' })) return;
    }
    play = newPlay(view.gameId, players);
    savePlay(); view = { name: 'board' }; render();
  },

  // Board
  open(d) {
    const clue = playGame().rounds[play.round].categories[+d.c].clues[+d.i];
    play.clue = { token: uid(), r: play.round, c: +d.c, i: +d.i, stage: clue.dd ? 'dd' : 'clue', revealed: false, wrong: [], queue: [], open: !clue.dd };
    savePlay(); render();
  },
  'dd-pick'(d) { play.clue.ddPlayer = d.p; play.clue.err = ''; savePlay(); render(); },
  'dd-go'() {
    const vc = play.clue;
    if (!vc.ddPlayer) { vc.err = 'Pick who selected the Daily Double.'; return renderOverlay(); }
    const R = playGame().rounds[vc.r], max = Math.max(player(vc.ddPlayer).score, Math.max(...R.values));
    const w = parseInt(vc.wager);
    if (isNaN(w) || w < 0 || w > max) { vc.err = `Enter a wager between $0 and ${fmt(max)}.`; return renderOverlay(); }
    vc.wager = w; vc.stage = 'clue'; vc.err = ''; vc.open = false;
    savePlay(); render();
  },
  reveal() { play.clue.revealed = true; play.clue.open = false; savePlay(); render(); },
  right(d) { adjust(d.p, clueWorth()); markUsed(); },
  wrong(d) {
    const vc = play.clue;
    adjust(d.p, -clueWorth());
    if (vc.ddPlayer) return markUsed();
    vc.wrong.push(d.p);
    vc.queue = vc.queue.filter(x => x !== d.p);
    if (vc.wrong.length === play.players.length) { vc.revealed = true; vc.open = false; }
    savePlay(); render();
  },
  'toggle-buzz'() { play.clue.open = !play.clue.open; savePlay(); render(); },
  'reset-buzz'() { play.clue.queue = []; play.clue.token = uid(); play.clue.open = true; savePlay(); render(); },
  'clue-done'() { markUsed(); },
  'clue-cancel'() { play.clue = null; savePlay(); render(); },
  undo() {
    const e = play.log.pop();
    if (e) { const p = player(e.pid); if (p) p.score -= e.delta; savePlay(); }
    render();
  },
  async 'edit-score'(d) {
    const p = player(d.p);
    const v = await ask(`Set the score for ${p.name}:`, { input: String(p.score), ok: 'Save' });
    if (v === null) return;
    const n = parseInt(String(v).replace(/[$,\s]/g, ''));
    if (isNaN(n)) return;
    adjust(p.id, n - p.score); render();
  },
  'next-round'() {
    play.clue = null;
    if (play.round < playGame().rounds.length - 1) { play.round++; savePlay(); render(); }
    else goFinal();
  },
  'prev-round'() { if (play.round > 0) { play.clue = null; play.round--; savePlay(); render(); } },

  // Final
  'back-board'() { clearTimeout(beepTimer); play.final = null; savePlay(); view = { name: 'board' }; render(); },
  'f-wagers'() {
    const F = play.final;
    F.stage = 'wager'; F.submitted = {}; F.token = uid();
    savePlay(); render();
  },
  'f-clue'() {
    const F = play.final;
    for (const p of play.players.filter(p => p.score > 0)) {
      const w = parseInt(F.wagers[p.id]);
      if (isNaN(w) || w < 0 || w > p.score) { F.err = `${p.name}'s wager must be between $0 and ${fmt(p.score)}.`; return render(); }
      F.wagers[p.id] = w;
    }
    F.err = ''; F.stage = 'clue';
    savePlay(); render();
  },
  'f-timer'() {
    clearTimeout(beepTimer);
    play.final.timerEnd = Date.now() + 30000;
    beepTimer = setTimeout(() => beep(), 30000);
    savePlay(); render();
  },
  'f-reveal'() { clearTimeout(beepTimer); play.final.stage = 'reveal'; savePlay(); render(); },
  'f-judge'(d) { play.final.results[d.p] = d.v === '1'; savePlay(); render(); },
  'f-apply'() {
    const F = play.final;
    if (F.applied) return;
    for (const p of play.players.filter(p => p.id in F.results)) adjust(p.id, (F.results[p.id] ? 1 : -1) * (F.wagers[p.id] || 0));
    F.applied = true; F.stage = 'results'; savePlay(); render();
  },
  rematch() {
    play = newPlay(play.gameId, play.players.map(p => ({ id: p.id, name: p.name, av: p.av, score: 0, remote: p.remote })));
    savePlay(); view = { name: 'board' }; render();
  },

  // Player
  'p-join'() { joinAs(false); },
  'p-watch'() { joinAs(true); },
  'p-leave'() { me.joined = false; render(); },
  'av-set'(d) {
    me.name = $('#join-name')?.value ?? me.name;
    me.code = ($('#join-code')?.value ?? me.code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    me.av = cleanAv({ ...me.av, [d.k]: d.v });
    lsSet('jeoparty.avatar', me.av);
    render();
  },
  'p-retry'() { me.kicked = false; me.joined = true; live = null; pstate = 'connecting'; connectPlayer(); render(); },
  async 'player-menu'(d) {
    const p = player(d.p);
    if (!p) return;
    const pick = await choose(`${p.name} · ${fmt(p.score)}`, [
      { key: 'score', label: 'Set score' },
      { key: 'remove', label: 'Remove from game', cls: 'dangerbtn' },
      { key: 'cancel', label: 'Cancel' },
    ]);
    if (pick === 'score') actions['edit-score'](d);
    else if (pick === 'remove') actions.kick(d);
  },
  async kick(d) {
    const pid = d.p;
    const name = player(pid)?.name || peersList.find(p => p.pid === pid)?.name || 'this player';
    const remote = !!player(pid)?.remote || peersList.some(p => p.pid === pid);
    const msg = `Remove ${name} from the game?` + (remote ? ' Their device is disconnected, and they can’t rejoin until you allow them back from the setup screen.' : ' Their score will be lost.');
    if (!await ask(msg, { ok: 'Remove', danger: true })) return;
    removePlayer(pid);
    render();
  },
  unblock(d) {
    blocked = blocked.filter(b => b.pid !== d.p);
    lsSet('jeoparty.blocked', blocked);
    render();
  },
  'p-wager'() {
    const F = live?.final, you = live?.players?.find(p => p.id === me.pid);
    if (!F || F.stage !== 'wager' || !F.token || !you || !pconn) return;
    const w = parseInt($('#fw-input')?.value ?? me.fwDraft);
    if (isNaN(w) || w < 0 || w > you.score) { me.fwErr = `Enter a wager between $0 and ${fmt(you.score)}.`; return render(); }
    me.fwErr = ''; me.fwDraft = String(w);
    try { pconn.send({ type: 'wager', token: F.token, w }); me.fwSent = { token: F.token, w }; }
    catch { me.fwErr = "Your wager didn't go through. Try again, or tell the host."; }
    render();
  },
  buzz() {
    const c = live?.clue;
    if (!c || buzzState().off) return;
    me.buzzToken = c.token;
    buzzSound(!c.queue.length);
    try { pconn.send({ type: 'buzz', token: c.token }); } catch { toast('Your buzz didn’t go through. Try again.'); me.buzzToken = null; }
    try { navigator.vibrate?.(40); } catch {}
    render();
  },
};

function joinAs(watch) {
  const code = ($('#join-code')?.value ?? me.code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  const name = ($('#join-name')?.value ?? me.name).trim().slice(0, 24);
  if (code.length !== 4) { me.err = 'Enter the 4-character room code from the host’s screen.'; return render(); }
  if (!watch && !name) { me.err = 'Enter a name so the host knows who buzzed.'; return render(); }
  const codeChanged = code !== me.code;
  Object.assign(me, { code, watch, joined: true, err: '' });
  if (!watch) me.name = name;
  lsSet('jeoparty.name', me.name); lsSet('jeoparty.watch', watch); lsSet('jeoparty.lastCode', code);
  history.replaceState(null, '', `${location.pathname}?join=${code}`);
  if (codeChanged || !pconn || pstate !== 'connected') { live = null; connectPlayer(); }
  else sendHello();
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!muted) audio(); // unlock sound inside the viewer's gesture
  if (!el || el.disabled || !$('#dialog').hidden) return;
  actions[el.dataset.act]?.(el.dataset, el);
});

function onField(e) {
  const el = e.target, d = el.dataset;
  if (role === 'player') {
    if (el.id === 'fw-input') me.fwDraft = el.value;
    else if (el.id === 'join-name') { const n = $('#av-name'); if (n) n.textContent = el.value.trim() || 'Your name'; }
    return;
  }
  if (d.path && view.name === 'edit') {
    const g = editGame();
    const val = el.type === 'checkbox' ? el.checked : d.type === 'num' ? (parseInt(el.value) || 0) : el.value;
    setPath(g, d.path, val);
    if (d.path.endsWith('.dd')) el.closest('.cell-ed')?.classList.toggle('dd', el.checked);
    touch();
  } else if ('pname' in d && view.name === 'setup') {
    view.players[+d.pname] = el.value;
  } else if ('ddwager' in d && play?.clue) {
    play.clue.wager = el.value;
  } else if (d.fwager && play?.final) {
    play.final.wagers[d.fwager] = el.value;
    if (e.type === 'change') savePlay();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('focusout', () => setTimeout(() => {
  if (needsRender && !typingInApp() && $('#dialog').hidden) { needsRender = false; render(); }
}, 0));

document.addEventListener('keydown', e => {
  if (!$('#dialog').hidden) return;
  const typing = !!e.target.matches?.('input, textarea');
  if (role === 'player') {
    if (e.key === 'Enter' && (e.target.id === 'join-name' || e.target.id === 'join-code')) { e.preventDefault(); joinAs(false); }
    else if (e.key === 'Enter' && e.target.id === 'fw-input') { e.preventDefault(); actions['p-wager'](); }
    else if (!typing && (e.key === ' ' || e.key === 'Enter') && me.joined && !me.watch) { e.preventDefault(); actions.buzz(); }
    return;
  }
  if (view.name === 'board' && play?.clue) {
    const vc = play.clue;
    if (e.key === 'Enter' && typing && 'ddwager' in e.target.dataset) { e.preventDefault(); actions['dd-go'](); return; }
    if (typing) return;
    if (e.key === ' ' && vc.stage === 'clue' && !vc.revealed) { e.preventDefault(); actions.reveal(); }
    else if (e.key === 'Escape' && !vc.ddPlayer) actions['clue-cancel']();
  } else if (view.name === 'final' && !typing && e.key === ' ' && play?.final?.stage === 'clue') {
    e.preventDefault(); actions['f-reveal']();
  }
});

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = (Array.isArray(data) ? data : [data]).map(g => normalize(g));
    list.forEach((g, n) => { g.created = Date.now() + n; games.push(g); });
    saveGames(); render();
    toast(`Imported ${list.length} game${list.length > 1 ? 's' : ''}.`);
  } catch (err) {
    ask(`That file couldn't be imported: ${err.message}`, { cancel: null });
  }
});

// ---------- Host networking ----------
function startHost(attempt = 0) {
  if (!window.Peer) { peerState = 'error'; refresh(); return; }
  if (!roomCode()) lsSet('jeoparty.room', newCode());
  peerState = 'connecting';
  const p = new Peer(PEER_PREFIX + roomCode(), { debug: 0 });
  peer = p;
  p.on('open', () => { peerState = 'online'; refresh(); });
  p.on('connection', setupHostConn);
  p.on('disconnected', () => {
    // Lost the broker only; open player connections keep working. Re-register so new players can join.
    if (p.destroyed) return;
    peerState = 'connecting'; refresh();
    setTimeout(() => { if (!p.destroyed) p.reconnect(); }, 2000);
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id') {
      // Usually this tab's previous session hasn't expired yet (a reload); after a few tries, take a new code.
      p.destroy();
      if (attempt < 4) setTimeout(() => startHost(attempt + 1), 3000);
      else { lsSet('jeoparty.room', newCode()); startHost(0); }
    } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'].includes(err.type)) {
      peerState = 'error'; refresh();
      if (err.type !== 'browser-incompatible') setTimeout(() => { if (peer === p) { p.destroy(); startHost(0); } }, 5000);
    }
  });
}
// A closed phone or browser often never says goodbye, so both sides check in every few seconds
// and the host drops anyone it hasn't heard from in HEARTBEAT_TIMEOUT.
const HEARTBEAT_MS = 3000, HEARTBEAT_TIMEOUT = 12000;
function dropConn(rec) {
  for (const [id, r] of conns) if (r === rec) conns.delete(id);
  try { rec.conn.close(); } catch {}
  refreshPeers();
}
setInterval(() => {
  if (role !== 'host') return;
  const now = Date.now();
  for (const rec of [...conns.values()]) {
    if (now - rec.lastSeen > HEARTBEAT_TIMEOUT) dropConn(rec);
    else send(rec, { type: 'ping' });
  }
}, HEARTBEAT_MS);

// Players the host removed; they can't rejoin until allowed back from the setup screen.
let blocked = lsGet('jeoparty.blocked', []);
const isBlocked = pid => blocked.some(b => b.pid === pid);
function removePlayer(pid) {
  const name = player(pid)?.name || peersList.find(p => p.pid === pid)?.name || 'Player';
  const remote = !!player(pid)?.remote || peersList.some(p => p.pid === pid);
  if (remote && !isBlocked(pid)) { blocked.push({ pid, name }); lsSet('jeoparty.blocked', blocked); }
  if (play) {
    play.players = play.players.filter(p => p.id !== pid);
    const cl = play.clue;
    if (cl) {
      if (cl.ddPlayer === pid) play.clue = null;
      else { cl.queue = cl.queue.filter(x => x !== pid); cl.wrong = cl.wrong.filter(x => x !== pid); }
    }
    const F = play.final;
    if (F) { delete F.wagers?.[pid]; delete F.submitted?.[pid]; delete F.results?.[pid]; }
    savePlay();
  }
  for (const rec of [...conns.values()]) {
    if (rec.pid === pid) { rec.role = null; send(rec, { type: 'kicked' }); setTimeout(() => dropConn(rec), 300); }
  }
  refreshPeers();
}

function setupHostConn(conn) {
  const rec = { conn, pid: null, name: '', role: null, lastSeen: Date.now() };
  conns.set(conn.connectionId, rec);
  conn.on('data', m => { rec.lastSeen = Date.now(); onHostMsg(rec, m); });
  const drop = () => { if (conns.get(conn.connectionId) === rec) { conns.delete(conn.connectionId); refreshPeers(); } };
  conn.on('close', drop);
  conn.on('error', drop);
}
function onHostMsg(rec, m) {
  if (!m || typeof m !== 'object') return;
  if (m.type === 'bye') { dropConn(rec); return; }
  if (m.type === 'hello') {
    rec.role = m.role === 'watch' ? 'watch' : 'player';
    rec.pid = str(m.pid, 40);
    rec.name = str(m.name, 24).trim();
    rec.av = cleanAv(m.av);
    if (rec.role === 'player' && (!rec.pid || !rec.name)) { rec.role = null; return; }
    if (rec.role === 'player' && isBlocked(rec.pid)) {
      rec.role = null; send(rec, { type: 'kicked' });
      setTimeout(() => dropConn(rec), 300);
      return;
    }
    for (const [id, r] of conns) {
      if (r !== rec && r.pid && r.pid === rec.pid) { conns.delete(id); try { r.conn.close(); } catch {} }
    }
    refreshPeers();
    send(rec, { type: 'state', state: buildLive() });
  } else if (m.type === 'buzz') {
    const cl = play?.clue;
    if (rec.role !== 'player' || !cl || cl.stage !== 'clue' || !cl.open || cl.ddPlayer || m.token !== cl.token) return;
    if (cl.queue.includes(rec.pid) || cl.wrong.includes(rec.pid) || !player(rec.pid)) return;
    const first = cl.queue.length === 0;
    cl.queue.push(rec.pid);
    buzzSound(first);
    savePlay(); refresh();
  } else if (m.type === 'wager') {
    const F = play?.final, pl = player(rec.pid);
    if (rec.role !== 'player' || !F || F.stage !== 'wager' || m.token !== F.token || !pl || pl.score <= 0) return;
    const n = parseInt(m.w);
    if (isNaN(n) || n < 0 || n > pl.score) return;
    F.wagers[rec.pid] = n; F.submitted[rec.pid] = true;
    savePlay(); refresh();
  }
}
function refreshPeers() {
  const seen = new Map(); let watch = 0;
  for (const r of conns.values()) {
    if (r.role === 'watch') watch++;
    else if (r.role === 'player' && !seen.has(r.pid)) seen.set(r.pid, { pid: r.pid, name: r.name, av: r.av });
  }
  peersList = [...seen.values()]; watchers = watch;
  if (play && playGame()) {
    let changed = false;
    for (const x of peersList) {
      if (isBlocked(x.pid)) continue;
      const p = player(x.pid);
      if (!p) { play.players.push({ id: x.pid, name: x.name, av: x.av, score: 0, remote: true }); changed = true; }
      else if (p.name !== x.name || JSON.stringify(p.av) !== JSON.stringify(x.av)) { p.name = x.name; p.av = x.av; changed = true; }
    }
    if (changed) savePlay();
  }
  refresh();
}

// ---------- Player networking ----------
function sendHello() {
  try { pconn?.send({ type: 'hello', pid: me.pid, name: me.watch ? '' : me.name, av: me.av, role: me.watch ? 'watch' : 'player' }); } catch {}
}
function openPlayerPeer() {
  return new Promise((resolve, reject) => {
    const p = new Peer({ debug: 0 });
    const t = setTimeout(() => { p.destroy(); reject({ type: 'timeout' }); }, 12000);
    p.on('open', () => { clearTimeout(t); resolve(p); });
    p.on('error', err => {
      if (!p.open) { clearTimeout(t); p.destroy(); reject(err); }
      else if (err.type === 'peer-unavailable') { p.lastUnavailable = Date.now(); }
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) p.destroy();
    });
  });
}
let playerPeer = null;
async function connectPlayer() {
  if (pConnecting) return;
  pConnecting = true;
  await peerReady;
  if (!window.Peer) { pConnecting = false; pstate = 'lost'; refresh(); scheduleRetry(); return; }
  clearTimeout(retryTimer);
  const old = pconn; pconn = null;
  try { old?.close(); } catch {}
  if (pstate !== 'lost') pstate = 'connecting';
  refresh();
  try {
    if (!playerPeer || playerPeer.destroyed || playerPeer.disconnected) {
      try { playerPeer?.destroy(); } catch {}
      playerPeer = await openPlayerPeer();
    }
    const p = playerPeer, since = Date.now();
    const c = p.connect(PEER_PREFIX + me.code, { reliable: true });
    await new Promise((resolve, reject) => {
      const iv = setInterval(() => {
        if (p.lastUnavailable >= since) { cleanup(); reject({ type: 'peer-unavailable' }); }
        else if (p.destroyed) { cleanup(); reject({ type: 'network' }); }
      }, 250);
      const t = setTimeout(() => { cleanup(); reject({ type: 'timeout' }); }, 12000);
      const cleanup = () => { clearInterval(iv); clearTimeout(t); };
      c.on('open', () => { cleanup(); resolve(); });
      c.on('error', e => { cleanup(); reject(e); });
    });
    pconn = c;
    pstate = 'connected';
    lastHostMsg = Date.now();
    c.on('data', m => {
      lastHostMsg = Date.now();
      if (!m || typeof m !== 'object') return;
      if (m.type === 'state' && m.state && typeof m.state === 'object') onLive(m.state);
      else if (m.type === 'kicked') onKicked();
    });
    const lost = () => { if (pconn === c) { pconn = null; pstate = 'lost'; refresh(); scheduleRetry(); } };
    c.on('close', lost);
    c.on('error', lost);
    sendHello();
  } catch (e) {
    try { playerPeer && e?.type !== 'peer-unavailable' && playerPeer.destroy(); } catch {}
    pstate = e?.type === 'peer-unavailable' ? 'notfound' : 'lost';
    scheduleRetry();
  }
  pConnecting = false;
  refresh();
}
function scheduleRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (me.joined && !me.kicked) connectPlayer(); }, 3000);
}
function onKicked() {
  me.kicked = true; me.joined = false; live = null;
  clearTimeout(retryTimer);
  const c = pconn; pconn = null; pstate = 'idle';
  try { c?.close(); } catch {}
  render();
}
// Check in with the host; if the host goes quiet (tab closed, network dropped), reconnect.
let lastHostMsg = 0;
setInterval(() => {
  if (role !== 'player' || !pconn || pstate !== 'connected') return;
  if (Date.now() - lastHostMsg > HEARTBEAT_TIMEOUT) {
    const c = pconn; pconn = null; pstate = 'lost';
    try { c.close(); } catch {}
    refresh(); connectPlayer();
    return;
  }
  try { pconn.send({ type: 'ping' }); } catch {}
}, HEARTBEAT_MS);
// Say goodbye when the tab closes so the host doesn't wait for the timeout.
window.addEventListener('pagehide', () => { try { pconn?.send({ type: 'bye' }); } catch {} });
let lastToken = null, lastQueueLen = 0;
function onLive(state) {
  live = state;
  const tok = live?.clue?.token || null, qLen = live?.clue?.queue?.length || 0;
  if (tok && me.buzzToken && tok !== me.buzzToken) me.buzzToken = null;
  // TV screens ring for every buzz; players only hear their own (played when they press).
  if (me.watch && tok && tok === lastToken && qLen > lastQueueLen) buzzSound(lastQueueLen === 0);
  lastToken = tok; lastQueueLen = qLen;
  if (live?.final?.token && me.fwSent && me.fwSent.token !== live.final.token) me.fwSent = null;
  if (typingInApp() && !(document.activeElement?.id === 'fw-input' && live?.final?.stage !== 'wager')) needsRender = true;
  else render();
}

// ---------- Boot ----------
if (role === 'host') {
  games = (lsGet('jeoparty.games', null) || [sampleGame()]).map(g => normalize(g, g.id));
  games.sort((a, b) => (a.created || 0) - (b.created || 0));
  saveGames();
  play = lsGet('jeoparty.play', null);
  if (play && !gameById(play.gameId)) play = null;
  if (play) view = { name: play.final ? 'final' : 'board' }; // a reload mid-game goes straight back to it
  render();
  peerReady.then(() => startHost());
} else {
  if (me.code.length === 4 && (me.name || me.watch) && params.get('join')) { me.joined = true; connectPlayer(); }
  render();
}
</script>
</body>
</html>

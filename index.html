<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build custom trivia games and host them live: players join from their phones and buzz in.">
<title>2MixParty!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:wght@700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #120a24;
    --panel: #1d1238;
    --panel2: #2b1c52;
    --board: #34207a;
    --board-dk: #241453;
    --accent: #ffa8d8;
    --text: #eef1ff;
    --muted: #a797cc;
    --line: rgba(255, 255, 255, .14);
    --ok: #1f9d5c;
    --no: #d93b40;
    --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
    --serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #app { min-height: 100%; }
  button {
    font: inherit; cursor: pointer; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    padding: .5em .9em; border-radius: 8px;
  }
  button:hover:not(:disabled) { border-color: rgba(255, 255, 255, .4); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1f0d3f; border-color: transparent; font-weight: 700; }
  button.ghost { background: transparent; }
  button.danger { color: #ff9a9d; }
  button.dangerbtn { background: var(--no); border-color: transparent; font-weight: 700; }
  button.icon { background: transparent; padding: .25em .55em; }
  input, textarea {
    font: inherit; color: var(--text); width: 100%;
    background: rgba(0, 0, 0, .28); border: 1px solid var(--line);
    border-radius: 6px; padding: .45em .6em;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  kbd { font-size: .75em; border: 1px solid currentColor; border-radius: 4px; padding: 0 .35em; opacity: .7; margin-left: .4em; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  .top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .25);
  }
  .logo { font-family: 'Luckiest Guy', var(--display); letter-spacing: .02em; color: var(--accent); font-size: 30px; margin: 0; font-weight: 400; line-height: 1.1; display: inline-flex; white-space: nowrap; }
  .logo.sm { font-size: 22px; }
  .logo.big { font-size: clamp(48px, 12vw, 80px); justify-content: center; width: 100%; }
  /* Party-game title: every letter its own colour, outlined, tilted and gently bobbing. */
  .logo .l {
    display: inline-block; color: var(--c);
    -webkit-text-stroke: .07em #1f0d3f; paint-order: stroke fill;
    text-shadow: 0 .07em 0 #1f0d3f, 0 .13em 0 rgba(0, 0, 0, .35);
    transform: rotate(var(--r)) translateY(var(--y));
    animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -.18s);
  }
  @keyframes bob { 50% { transform: rotate(calc(var(--r) * -1)) translateY(calc(var(--y) - .06em)); } }
  .title-input { max-width: 420px; font-weight: 700; font-size: 17px; }
  .round-name { font-family: var(--display); color: var(--accent); font-size: 22px; letter-spacing: .03em; text-shadow: 2px 2px 0 #000; }
  .chip-live { font-size: 13px; padding: .25em .7em; border-radius: 999px; background: rgba(47, 191, 113, .18); color: #8ff0bd; border: 1px solid rgba(47, 191, 113, .4); white-space: nowrap; }
  .chip-live.off { background: rgba(255, 255, 255, .06); color: var(--muted); border-color: var(--line); }
  .wait { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 48px 16px; min-height: 50vh; }

  /* Home */
  .home { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 20px; align-items: center; }
  .resume {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--board-dk); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  }
  .howto { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
  .howto strong { color: var(--accent); }
  .howto p { margin: 0 0 4px; }
  .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* Editor */
  .editor { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .section-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .section-head input { max-width: 280px; font-weight: 700; }
  .section-head h2 { margin: 0; font-size: 17px; }
  .grid-wrap { overflow-x: auto; }
  .ed-grid { border-collapse: separate; border-spacing: 6px; }
  .ed-grid th, .ed-grid td { vertical-align: top; min-width: 210px; padding: 0; }
  .ed-grid .valcol { min-width: 120px; width: 120px; }
  .valcell { display: flex; gap: 2px; align-items: center; }
  .cat-h { display: flex; gap: 4px; }
  .cat-h input { font-weight: 700; text-transform: uppercase; background: var(--board-dk); }
  .cell-ed { display: flex; flex-direction: column; gap: 4px; background: rgba(52, 32, 122, .35); padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
  .cell-ed.dd { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell-ed textarea { resize: vertical; min-height: 66px; }
  .dd-toggle { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .final-ed { display: grid; gap: 8px; max-width: 720px; }
  .final-ed label { font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }

  /* Setup / panels */
  .panel { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .panel h2 { font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 30px; margin: 0 0 16px; letter-spacing: .03em; }
  .panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  .plist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .plist .prow { display: flex; gap: 6px; align-items: center; }
  .remote-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .remote-list span { background: var(--board-dk); border: 1px solid var(--line); padding: .3em .8em; border-radius: 999px; }

  /* Board */
  .board-view { height: 100%; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .board {
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
    gap: 6px; padding: 8px; background: #0a0515; min-height: 0; position: relative;
  }
  .board .cat {
    background: var(--board); display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-family: var(--display); text-transform: uppercase; color: #fff;
    font-size: clamp(11px, 1.9vw, 28px); line-height: 1.1; text-shadow: 2px 2px 0 #000; overflow: hidden;
    border-bottom: 4px solid #0a0515; overflow-wrap: anywhere;
  }
  .board .cell {
    background: var(--board); border: 0; border-radius: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); color: var(--accent); font-size: clamp(16px, 4.4vw, 60px); text-shadow: 3px 3px 0 #000;
    transition: filter .15s;
  }
  .board button.cell:hover:not(:disabled) { filter: brightness(1.3); border: 0; }
  .board .cell:disabled { opacity: 1; }
  .round-done {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, .85); border: 2px solid var(--accent); border-radius: 14px; padding: 22px 28px; text-align: center;
  }
  .round-done p { font-family: var(--display); color: var(--accent); font-size: 30px; margin: 0 0 12px; }
  .scores { display: flex; gap: 8px; padding: 8px; overflow-x: auto; background: #0a0515; align-items: stretch; }
  .player { flex: 1 1 0; min-width: 110px; background: var(--board-dk); border-radius: 6px; text-align: center; padding: 6px 8px; border: 2px solid transparent; }
  .player.you { border-color: var(--accent); }
  .pname { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #ddd0fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pscore { font-family: var(--display); font-size: clamp(20px, 2.6vw, 34px); color: #fff; background: none; border: 0; padding: 0; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .player.neg .pscore { color: #ff8f93; }
  .scores .undo { align-self: center; white-space: nowrap; }

  /* Clue overlay (host) */
  #overlay {
    position: fixed; inset: 0; z-index: 10; background: var(--board);
    display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: zoom .28s ease-out;
  }
  @keyframes zoom { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .clue-card { width: min(1150px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 22px; text-align: center; padding: 4px; }
  .clue-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--display); text-transform: uppercase; color: var(--accent); font-size: clamp(16px, 2vw, 26px); letter-spacing: .03em; }
  .clue-meta.center { justify-content: center; }
  .clue-text { font-family: var(--serif); text-transform: uppercase; font-size: clamp(22px, 4vw, 56px); line-height: 1.3; text-shadow: 3px 3px 0 #000; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer { font-family: var(--serif); color: var(--accent); font-size: clamp(18px, 2.8vw, 38px); text-shadow: 2px 2px 0 #000; white-space: pre-wrap; animation: fade .3s; }
  .answer .tag { display: block; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #ddd0fa; text-shadow: none; margin-bottom: 4px; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .reveal { align-self: center; font-size: 18px; background: rgba(0, 0, 0, .3); }
  .buzzbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-size: 14px; }
  .buzzbar .state { padding: .3em .8em; border-radius: 999px; background: rgba(0, 0, 0, .3); }
  .buzzbar .state.open { background: rgba(47, 191, 113, .3); }
  .judge { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .jrow { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, .3); padding: 6px 6px 6px 12px; border-radius: 10px; border: 2px solid transparent; }
  .jrow.first { border-color: var(--accent); background: rgba(0, 0, 0, .5); animation: pulse 1s ease-in-out 2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 168, 216, .35); } }
  .jrow.wrong { opacity: .45; }
  .jrow .who { font-weight: 700; margin-right: 4px; }
  .jrow .pos { font-family: var(--display); color: var(--accent); min-width: 1.2em; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; }
  button.no { background: var(--no); border-color: transparent; color: #fff; }
  button.ok.on, button.no.on { outline: 3px solid #fff; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .actions button { background: rgba(0, 0, 0, .3); }
  .actions button.primary { background: var(--accent); }
  .dd-title { font-family: var(--display); color: var(--accent); font-size: clamp(44px, 9vw, 120px); line-height: 1; text-shadow: 4px 4px 0 #000; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-12deg); } }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: rgba(0, 0, 0, .3); }
  .chip.on { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .chip small { opacity: .75; margin-left: 4px; }
  .wager { max-width: 220px; align-self: center; font-size: 22px; text-align: center; }
  .err { color: #ffb3b5; min-height: 1.2em; font-weight: 600; }
  .label { margin: 0; color: #ddd0fa; }

  /* Final */
  .final-view { min-height: 100vh; background: var(--board); display: flex; flex-direction: column; }
  .final-view .top { background: rgba(0, 0, 0, .3); }
  .final-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .final-cat { font-family: var(--display); font-size: clamp(28px, 5vw, 64px); text-transform: uppercase; text-shadow: 3px 3px 0 #000; }
  .wtable { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; text-align: left; }
  .wrow { display: grid; grid-template-columns: 1fr auto 150px; gap: 10px; align-items: center; background: rgba(0, 0, 0, .3); padding: 8px 12px; border-radius: 10px; }
  .wrow.judge-row { grid-template-columns: 1fr auto auto auto; }
  .timer { height: 10px; background: rgba(0, 0, 0, .4); border-radius: 5px; overflow: hidden; width: min(600px, 100%); align-self: center; }
  .timer div { height: 100%; background: var(--accent); animation-name: drain; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes drain { from { width: 100%; } to { width: 0; } }
  .podium { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; }
  .prow-r { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, .3); padding: 12px 16px; border-radius: 10px; font-size: 20px; }
  .prow-r.win { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .prow-r .s { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }

  /* Player */
  .pview { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; background: #0a0515; }
  .pview .top { background: var(--bg); }
  .you-chip { font-weight: 700; background: var(--board-dk); padding: .3em .8em; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pmain { display: flex; flex-direction: column; min-height: 0; }
  .pmain .board { flex: 1; min-height: 320px; }
  .clue-stage { flex: 1; background: var(--board); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; animation: zoom .28s ease-out; }
  .clue-stage .clue-text { font-size: clamp(20px, 4vw, 52px); }
  .queue-line { font-weight: 700; color: #fff; min-height: 1.5em; }
  .queue-line b { color: var(--accent); }
  .wager-form { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(420px, 100%); align-self: center; }
  .wager-form .wager { max-width: 260px; }
  .wager-form button { width: 100%; }
  .locked { font-size: 12px; font-weight: 700; color: #8ff0bd; background: rgba(47, 191, 113, .18); border-radius: 999px; padding: .1em .6em; margin-left: 6px; white-space: nowrap; }
  .player-join { max-width: 420px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 12px; }
  .player-join input { font-size: 20px; padding: .6em .8em; }
  button.big { font-size: 20px; padding: .7em 1em; }
  .buzz-wrap { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; justify-content: center; border-top: 1px solid var(--line); }
  .buzzer {
    width: min(460px, 100%); height: clamp(72px, 14vh, 120px); border-radius: 999px; border: 0;
    font-family: var(--display); font-size: clamp(24px, 6vw, 46px); letter-spacing: .06em;
    background: #2a1d4d; color: #a797cc; transition: transform .06s, box-shadow .06s;
  }
  .buzzer:disabled { opacity: 1; }
  .buzzer.live { background: radial-gradient(circle at 50% 30%, #ff6a6f, #c4161c 70%); color: #fff; box-shadow: 0 7px 0 #6d0a0e, 0 0 36px rgba(255, 60, 60, .45); cursor: pointer; }
  .buzzer.live:active { transform: translateY(5px); box-shadow: 0 2px 0 #6d0a0e; }
  .buzzer.up { background: var(--accent); color: #1f0d3f; animation: pulse 1s ease-in-out infinite; }
  .buzzer.queued { background: #7b5cf0; color: #fff; }
  .buzzer.out { background: #3a1d24; color: #ff9a9d; }

  /* Dialog + toast */
  #dialog { position: fixed; inset: 0; z-index: 30; background: rgba(8, 3, 20, .75); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .dlg p { margin: 0; font-size: 16px; }
  .dlg .actions { justify-content: flex-end; }
  .dlg .actions button { background: var(--panel2); }
  .dlg .actions button.primary { background: var(--accent); }
  .dlg .actions button.dangerbtn { background: var(--no); }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: #0a0515; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; max-width: calc(100% - 32px); }

  @media (max-width: 600px) {
    .board { gap: 3px; padding: 4px; }
    .board .cat { border-bottom-width: 2px; padding: 3px; }
    .wrow { grid-template-columns: 1fr 110px; }
    .wrow .sc { display: none; }
    .top .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
<style>
  .invite { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .invite h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 26px; letter-spacing: .03em; }
  .room-code { font-family: var(--display); font-size: clamp(44px, 12vw, 72px); letter-spacing: .12em; color: #fff; line-height: 1; }
  .join-link { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: rgba(0, 0, 0, .3); padding: .5em .8em; border-radius: 8px; overflow-wrap: anywhere; user-select: all; max-width: 100%; }
  .code-input { font-family: var(--display); font-size: 28px; letter-spacing: .2em; text-transform: uppercase; text-align: center; }
  .av { flex: none; display: inline-block; vertical-align: middle; }
  .ptop { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
  .ptop .pname { min-width: 0; width: auto; }
  .jrow .av { margin-right: -2px; }
  .ptag { display: inline-flex; align-items: center; gap: 10px; }
  .you-chip { display: inline-flex; align-items: center; gap: 6px; }
  .queue-line b.first { display: inline-flex; align-items: center; gap: 6px; }
  .remote-list span .av { margin-left: -4px; }
  .player-join.wide { max-width: 860px; }
  .join-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 28px; align-items: start; }
  .join-form { display: flex; flex-direction: column; gap: 12px; }
  .av-editor { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .av-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
  .av-name { font-family: var(--display); font-size: 24px; letter-spacing: .03em; text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; text-align: center; }
  .av-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .av-opt { padding: 2px; border-radius: 10px; background: rgba(0, 0, 0, .25); line-height: 0; border: 2px solid transparent; }
  .av-opt.on { border-color: var(--accent); background: var(--board-dk); }
  .swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); }
  .swatch.on { outline: 3px solid var(--accent); outline-offset: 2px; border-color: #fff; }
  @media (max-width: 720px) { .join-grid { grid-template-columns: 1fr; } }

<script>
// If anything goes wrong while starting up, show it instead of leaving a blank page.
function showFatal(msg) {
  const app = document.getElementById('app');
  if (!app || app.dataset.ready) return;
  app.innerHTML = `<div class="wait"><h1 class="logo big">2MixParty!</h1>
    <p>Something went wrong while starting the game.</p>
    <p class="muted" style="font-family:monospace;max-width:640px;overflow-wrap:anywhere"></p>
    <div class="row" style="justify-content:center">
      <button onclick="location.reload()">Reload</button>
      <button onclick="try{localStorage.removeItem('jeoparty.play')}catch{};location.reload()">Clear the game in progress and reload</button>
    </div>
    <p class="hint">Your saved games are kept either way.</p></div>`;
  app.querySelector('.muted').textContent = String(msg || 'Unknown error');
}
window.addEventListener('error', e => showFatal(e.message));

// PeerJS (online play) loads in the background, so the page never waits on it.
function loadScript(src, ms = 15000) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    const t = setTimeout(() => resolve(false), ms);
    s.src = src; s.async = true;
    s.onload = () => { clearTimeout(t); resolve(true); };
    s.onerror = () => { clearTimeout(t); resolve(false); };
    document.head.appendChild(s);
  });
}
const peerReady = loadScript('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js');
</script>

// Game modifiers, set per game on the editor's Settings tab. Add new ones here with a default,

const DEFAULT_SETTINGS = { wrongCosts: true, dailyDoubles: true, effects: true, secrets: false, finalSeconds: 30 };

  const bool = (k) => typeof x[k] === 'boolean' ? x[k] : DEFAULT_SETTINGS[k];
  return {
    wrongCosts: bool('wrongCosts'),
    dailyDoubles: bool('dailyDoubles'),

}
const S = () => cleanSettings(playGame()?.settings);

}

  const rounds = Array.isArray(g.rounds) && g.rounds.length ? g.rounds : [newRound('2MixParty!')];
  out.rounds = rounds.map((R, ri) => {
    const values = Array.isArray(R?.values) && R.values.length ? R.values.map(v => parseInt(v) || 0) : [200, 400, 600, 800, 1000];
    const categories = (Array.isArray(R?.categories) ? R.categories : []).map(C => {
      const clues = Array.isArray(C?.clues) ? C.clues.slice(0, values.length) : [];
      while (clues.length < values.length) clues.push(blankClue());
      return { name: String(C?.name ?? ''), clues: clues.map(x => ({ q: String(x?.q ?? ''), a: String(x?.a ?? ''), dd: !!x?.dd })) };

}

function setPath(obj, path, val) {
  const k = path.split('.');

// ---------- Live state for players ----------
let liveJson = '';
function publishLive() {
  if (role !== 'host') return;
  const s = JSON.stringify(buildLive());
  if (s === liveJson) return;
  liveJson = s;
  for (const rec of conns.values()) if (rec.role) send(rec, { type: 'state', state: JSON.parse(s) });
}
function send(rec, msg) { try { if (rec.conn.open) rec.conn.send(msg); } catch {} }

// What players are allowed to see: no correct responses until revealed, no unrevealed clue text.
function buildLive() {
  const g = playGame();
  if (!g) return { phase: 'idle' };
  const base = { title: g.title, fx: play.fx || null, players: play.players.map(({ id, name, av, score }) => ({ id, name, av: av || null, score, away: isAway(id) })) };
  if (play.final) {
    const f = g.final, F = play.final;
    return { ...base, phase: 'final', final: {
      stage: F.stage, category: f.category,
      q: ['clue', 'reveal'].includes(F.stage) ? f.q : null,
      a: F.stage === 'reveal' ? f.a : null,
      timerEnd: F.stage === 'clue' ? (F.timerEnd || null) : null,
      timerMs: F.timerMs || 30000,
      token: F.stage === 'wager' ? (F.token || null) : null,
      locked: F.stage === 'wager' ? Object.keys(F.submitted || {}) : [],
    } };
  }
  const r = play.round, R = g.rounds[r];
  const out = { ...base, phase: 'board', round: roundInfo(g, r) };
  const cl = play.clue;
  if (cl) {
    const clue = R.categories[cl.c].clues[cl.i];
    const showQ = ['clue', 'art', 'art-judge'].includes(cl.stage);
    out.clue = {
      token: cl.token, stage: cl.stage, cat: R.categories[cl.c].name, value: R.values[cl.i],
      dd: !!cl.dd, ddName: cl.ddPlayer ? (player(cl.ddPlayer)?.name || '') : '',
      wager: showQ && cl.ddPlayer ? cl.wager : null,
      q: showQ ? liveQuestion(cl, clue) : null, a: cl.revealed ? clue.a : null, revealed: !!cl.revealed,
      qOrig: cl.yoda && cl.revealed ? clue.q : null,
      pingMore: !!(cl.ping && !cl.revealed && cl.ping.n < cl.ping.total),
      open: !!cl.open, queue: cl.queue, lockout: cl.wrong,
      effect: cl.effect || null, mult: cl.mult || 1, robot: !!cl.robot,
      secret: cl.stage === 'secret' ? cl.secret : null,
      bj: cl.stage === 'bj' ? bjLive(cl) : null,
      art: artLive(cl),
    };
  }

}
function roundInfo(g, r) {
  const R = g.rounds[r];
  return {
    name: R.name, cats: R.categories.map(C => C.name), values: R.values,
    open: R.categories.map((C, c) => C.clues.map((cl, i) => filled(cl) && !play.used[`${r}-${c}-${i}`] ? 1 : 0)),
  };
}

function adjust(pid, delta) {
  const p = player(pid);
  if (!p || !delta) return;
  p.score += delta;
  play.log.push({ pid, delta });
  if (play.log.length > 200) play.log.shift();

}

  const info = roundInfo(playGame(), play.round);
  return info.cats.length > 0 && info.open.every(col => col.every(v => !v));
}

// One shared AudioContext, unlocked by the viewer's first click (browsers block sound before that).
let audioCtx = null;

function audio() {

  } catch { return null; }
}
function tone(freq, dur, { type = 'sine', gain = .25, when = 0 } = {}) {

    tone(1318, .5, { type: 'triangle', gain: .3, when: .12 });
    tone(523, .3, { type: 'square', gain: .05 });

  }
}

// ---------- Effects: confetti and falling skulls ----------
// The host triggers them; the event rides along in the live state so every player and TV screen plays it too.
const fxCanvas = document.createElement('canvas');
fxCanvas.className = 'fx';
fxCanvas.setAttribute('aria-hidden', 'true');
document.body.appendChild(fxCanvas);
const fxCtx = fxCanvas.getContext('2d');
const FX_COLORS = ['#ff4b4b', '#ffd23f', '#4cd964', '#3fa9ff', '#ff7ac8', '#ff9f1c', '#b77dff', '#ffffff'];
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxParts = [], fxRunning = false;
function playFx(kind) {
  const W = innerWidth, Hh = innerHeight, scale = reducedMotion() ? .3 : 1;
  if (kind === 'confetti' || kind === 'both') {
    for (const side of [0, 1]) for (let i = 0; i < 90 * scale; i++) {
      fxParts.push({
        kind: 'c', x: side ? W + 10 : -10, y: Hh * (.55 + Math.random() * .3),
        vx: (side ? -1 : 1) * (5 + Math.random() * 11), vy: -(10 + Math.random() * 12),
        rot: Math.random() * 6.3, vr: (Math.random() - .5) * .35,
        w: 7 + Math.random() * 7, h: 4 + Math.random() * 4, color: pickFrom(FX_COLORS),
      });
    }
  }
  if (kind === 'secret') {
    for (let i = 0; i < 140 * scale; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 12;
      fxParts.push({
        kind: 'c', x: W / 2, y: Hh * .4, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
        rot: Math.random() * 6.3, vr: (Math.random() - .5) * .4,
        w: 5 + Math.random() * 6, h: 5 + Math.random() * 6, color: pickFrom(['#ffd23f', '#fff3b0', '#ffffff', '#ffb627', '#ffa8d8']),
      });
    }
  }
  if (kind === 'skulls' || kind === 'both') {
    for (let i = 0; i < 26 * scale; i++) {
      fxParts.push({
        kind: 's', x: Math.random() * W, y: -40 - Math.random() * Hh * .7,
        vx: (Math.random() - .5) * 1.4, vy: 1.5 + Math.random() * 3,
        rot: (Math.random() - .5) * .8, vr: (Math.random() - .5) * .07, size: 28 + Math.random() * 34,
      });
    }
  }

}
function stepFx() {
  const dpr = devicePixelRatio || 1, W = innerWidth, Hh = innerHeight;

    fxCanvas.width = Math.round(W * dpr); fxCanvas.height = Math.round(Hh * dpr);
  }
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxCtx.clearRect(0, 0, W, Hh);
  fxParts = fxParts.filter(p => p.y < Hh + 80 && p.x > -120 && p.x < W + 120);
  for (const p of fxParts) {
    if (p.kind === 'c') { p.vx *= .985; p.vy = p.vy * .985 + .32; }
    else p.vy += .09;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;

    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    if (p.kind === 'c') {
      fxCtx.scale(1, Math.cos(p.rot * 2.3)); // paper flipping over as it falls
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else {
      fxCtx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
      fxCtx.textAlign = 'center'; fxCtx.textBaseline = 'middle';
      fxCtx.fillText('💀', 0, 0);
    }

// Host: play an effect here and pass it on to every connected screen.
function celebrate(kind) {

  play.fx = { id: uid(), kind };

// ---------- Dialog + toast ----------
// A dialog with several choices; resolves the chosen key, or null when dismissed.
function choose(message, buttons) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(message)}">
      <p>${esc(message)}</p>
      <div class="actions">${buttons.map(b => `<button class="${b.cls || ''}" data-dlg="${esc(b.key)}">${esc(b.label)}</button>`).join('')}</div></div>`;
    d.hidden = false;
    d.querySelector('[data-dlg]').focus();
    const done = v => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; resolve(v); };
    d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg); else if (e.target === d) done(null); };
    d.onkeydown = e => { if (e.key === 'Escape') done(null); e.stopPropagation(); };
  });
}
function ask(message, { ok = 'OK', cancel = 'Cancel', input = null, danger = false } = {}) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(message)}">
      <p>${esc(message)}</p>
      ${input !== null ? `<input id="dlg-input" value="${esc(input)}">` : ''}
      <div class="actions">${cancel ? `<button data-dlg="0">${esc(cancel)}</button>` : ''}<button class="${danger ? 'dangerbtn' : 'primary'}" data-dlg="1">${esc(ok)}</button></div></div>`;
    d.hidden = false;
    const inp = d.querySelector('input');
    (inp || d.querySelector('[data-dlg="1"]')).focus();
    if (inp) inp.select();
    const done = yes => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; resolve(inp ? (yes ? inp.value : null) : yes); };
    d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg === '1'); else if (e.target === d) done(false); };
    d.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') done(false); e.stopPropagation(); };
  });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

const roomCode = () => lsGet('jeoparty.room', null);
const hosted = () => /^https?:$/.test(location.protocol);
const joinLink = () => `${location.origin}${location.pathname}?join=${roomCode()}`;

function showInvite() {
  const d = $('#dialog');
  const code = roomCode();
  d.innerHTML = `<div class="invite" role="dialog" aria-modal="true" aria-label="Invite players">
    <h2>Join the game</h2>
    ${peerState === 'online' ? `
      ${hosted() ? `<p class="label">Send players this link:</p>
        <div class="join-link" id="join-link">${esc(joinLink())}</div>
        <button data-dlg="copy">Copy link</button>
        <p class="label">Or open the game page, choose <strong>Join a game</strong>, and enter the code:</p>` : `<p class="label">Players open the game's web address, choose <strong>Join a game</strong>, and enter:</p>`}
      <div class="room-code">${esc(code)}</div>`
    : `<p class="label">${peerState === 'connecting' ? 'Opening your room… try again in a moment.' : "Online play isn't reachable right now. Check your internet connection; the game still works on this screen."}</p>`}
    <div class="actions"><button class="primary" data-dlg="1">Done</button></div></div>`;
  d.hidden = false;
  d.querySelector('[data-dlg="1"]').focus();

  d.onclick = async e => {

    if (e.target === d || b?.dataset.dlg === '1') return close();

    }

}

// ---------- Rendering ----------
function render() {
  const app = $('#app');
  if (role === 'player') app.innerHTML = renderPlayer();
  else if (view.name === 'home') app.innerHTML = renderHome();
  else if (view.name === 'edit') app.innerHTML = editGame() ? renderEditor() : renderHome();
  else if (view.name === 'setup') app.innerHTML = renderSetup();
  else if (view.name === 'board') app.innerHTML = playGame() ? renderBoard() : renderHome();
  else if (view.name === 'final') app.innerHTML = playGame() && play.final ? renderFinal() : renderHome();
  renderOverlay();
  publishLive();
  if (role === 'player') mountArt();
  app.dataset.ready = '1';
}
// Re-render now, or later if the viewer is typing (a render would steal their focus).
function refresh() {
  if (role === 'host' && view.name === 'edit') { publishLive(); return; }
  if (typingInApp()) { needsRender = true; publishLive(); } else render();
}
const typingInApp = () => { const a = document.activeElement; return !!(a && a.matches?.('input, textarea') && ($('#app').contains(a) || $('#overlay').contains(a))); };

function connectedChip() {
  if (peerState === 'error') return `<button class="chip-live off" data-act="invite" title="Players can't join right now">Online play offline</button>`;
  if (peerState !== 'online') return `<span class="chip-live off">Opening room…</span>`;
  const n = peersList.length;
  return `<button class="chip-live" data-act="invite" title="Show how players join">Room ${esc(roomCode())} · ${n} player${n === 1 ? '' : 's'}${watchers ? ` · ${watchers} watching` : ''}</button>`;
}

function gameStats(g) {
  let n = 0, total = 0;
  g.rounds.forEach(R => R.categories.forEach(C => C.clues.forEach(cl => { total++; if (filled(cl)) n++; })));
  return `${g.rounds.length} round${g.rounds.length > 1 ? 's' : ''} · ${n}/${total} clues${g.final.enabled ? ' · Final' : ''}`;
}

  return `

    <button class="ghost" data-act="invite">Invite players</button>
    <button class="ghost" data-act="fullscreen">⛶ Fullscreen</button></header>
  <main class="home">
    ${inProgress ? `<div class="resume"><div><strong>Game in progress:</strong> ${esc(inProgress.title)}<div class="meta">${play.players.map(p => `${esc(p.name)} ${fmt(p.score)}`).join(' · ')}</div></div>
      <span class="spacer"></span><button class="ghost" data-act="abandon">End game</button><button class="primary" data-act="resume">Resume ▶</button></div>` : ''}
    <div class="howto"><p><strong>You're the host.</strong> This screen shows the correct responses and controls the board, so keep it to yourself.</p>
      <p class="muted">Press <strong>Invite players</strong> for the join link and room code. Players join with no account, pick an avatar and get a buzzer. Put a second device on the TV and join it with "Just watch" to show the board to the room. Keep this tab open during the game: it runs the game.</p></div>
    <div class="toolbar">

      <div class="card">
        <h3>${esc(g.title) || '<em>Untitled</em>'}</h3>
        <div class="meta">${gameStats(g)}</div>
        <div class="row">
          <button class="primary" data-act="setup" data-id="${g.id}">▶ Play</button>

function renderSettings(g) {
  const st = cleanSettings(g.settings);
  const toggle = (k, title, desc) => `<label class="setting" for="set-${k}">
      <input id="set-${k}" type="checkbox" data-path="settings.${k}" ${st[k] ? 'checked' : ''}>
      <span><strong>${title}</strong><small>${desc}</small></span></label>`;
  return `<main class="editor settings-page">
    <section class="section">
      <div class="section-head"><h2>Game modifiers</h2></div>
      <p class="hint">These apply every time this game is played, and take effect straight away, even mid-game.</p>
      <div class="settings-list">
        ${toggle('wrongCosts', 'Wrong answers lose points', "A wrong answer takes away the clue's value, or the Daily Double wager. Turn off for a friendlier game.")}
        ${toggle('dailyDoubles', 'Daily Doubles', 'When off, clues marked as Daily Doubles play like normal clues.')}
        ${toggle('secrets', 'Hidden secrets', '1 or 2 tiles on each board secretly hide a secret. Finding one spins the wheel of chaos: Double trouble, Gamble Slop (blackjack), What is.. Art? (drawing), Are you a robot? (captcha buzzer), What is this Ping?? (one word at a time) or Wrote this, Yoda did!')}
        ${toggle('effects', 'Confetti & skulls', 'Confetti when someone scores and skulls raining down when a clue is missed, on every screen.')}
        <label class="setting" for="set-finalSeconds">
          <input id="set-finalSeconds" type="number" min="5" max="300" step="5" data-type="num" data-path="settings.finalSeconds" value="${st.finalSeconds}">
          <span><strong>Final 2MixParty! timer</strong><small>How many seconds the timer gives players to answer the final clue (5 to 300).</small></span></label>
      </div>
    </section>
  </main>`;
}

  const g = gameById(view.gameId);
  if (!g) return renderHome();
  return `
  <header class="top"><button class="ghost" data-act="home">← Games</button><strong>${esc(g.title)}</strong><span class="spacer"></span>${connectedChip()}</header>
  <main class="panel">
    <h2>Who's playing?</h2>
    <h3>Joined on their devices</h3>
    ${peersList.length ? `<div class="remote-list">${peersList.map(p => `<span>${avatarSvg(p.av, 24)}${nameHtml(p)}<button class="icon" data-act="kick" data-p="${esc(p.pid)}" title="Remove ${esc(p.name)}" aria-label="Remove ${esc(p.name)}">✕</button></span>`).join('')}</div>`

      <button class="icon" title="Remove" data-act="del-player" data-i="${i}">✕</button></div>`).join('')}
    </div>

function boardCells(info, interactive) {
  let cells = info.cats.map(n => `<div class="cat">${esc(n)}</div>`).join('');
  info.values.forEach((v, i) => info.cats.forEach((_, c) => {
    const on = info.open[c]?.[i];
    cells += interactive
      ? `<button class="cell" data-act="open" data-c="${c}" data-i="${i}" ${on ? '' : 'disabled aria-label="used"'}>${on ? fmt(v) : ''}</button>`
      : `<div class="cell">${on ? fmt(v) : ''}</div>`;
  }));
  return cells;
}

// A player who joined on a device but isn't connected right now (keeps their score; can rejoin).
const isAway = pid => !!player(pid)?.remote && !peersList.some(x => x.pid === pid);

function scoresBar(players, { host = false, you = null } = {}) {
  return `<footer class="scores">
    ${players.map(p => { const away = host ? isAway(p.id) : p.away; return `<div class="player ${p.score < 0 ? 'neg' : ''} ${p.id === you ? 'you' : ''} ${away ? 'away' : ''}">
      <div class="ptop">${avatarSvg(p.av, 34)}
      ${host ? `<button class="pname" data-act="player-menu" data-p="${p.id}" title="Set score or remove ${esc(p.name)}">${nameHtml(p)}${away ? ' · away' : ''} ▾</button>`
        : `<div class="pname">${nameHtml(p)}${p.id === you ? ' (you)' : ''}${away ? ' · away' : ''}</div>`}</div>
      ${host ? `<button class="pscore" data-act="edit-score" data-p="${p.id}" title="Click to edit score">${fmt(p.score)}</button>` : `<div class="pscore">${fmt(p.score)}</div>`}</div>`; }).join('')}
    ${host ? `<button class="ghost undo" data-act="undo" ${play.log.length ? '' : 'disabled'} title="Undo last score change">↶ Undo</button>` : ''}
  </footer>`;
}

function renderBoard() {
  const g = playGame(), r = play.round, info = roundInfo(g, r);
  const last = r === g.rounds.length - 1;
  const nextLabel = last ? (g.final.enabled ? 'Final 2MixParty! →' : 'Finish game →') : 'Next round →';
  return `
  <div class="board-view">
    <header class="top">
      <button class="ghost" data-act="home">☰ Games</button>
      <span class="round-name">${esc(info.name)}</span>
      <span class="spacer"></span>
      ${connectedChip()}
      ${soundButton()}
      <button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button>
      ${r > 0 ? `<button class="ghost" data-act="prev-round">← Prev round</button>` : ''}
      <button data-act="next-round">${nextLabel}</button>
    </header>
    <main class="board" style="--cols:${Math.max(info.cats.length, 1)}">
      ${boardCells(info, true)}
      ${roundComplete() ? `<div class="round-done"><p>Round complete!</p><button class="primary" data-act="next-round">${nextLabel}</button></div>` : ''}
    </main>
    ${scoresBar(play.players, { host: true })}
  </div>`;
}

function renderOverlay() {
  const ov = $('#overlay');
  const vc = role === 'host' && view.name === 'board' && playGame() ? play.clue : null;
  if (!vc) { ov.hidden = true; ov.innerHTML = ''; return; }
  const wasHidden = ov.hidden;
  ov.hidden = false;
  if (wasHidden) { ov.style.animation = 'none'; void ov.offsetHeight; ov.style.animation = ''; }
  const g = playGame(), R = g.rounds[vc.r], C = R.categories[vc.c], clue = C.clues[vc.i], value = R.values[vc.i];

  if (vc.stage === 'dd') {
    const p = vc.ddPlayer && player(vc.ddPlayer);
    const maxW = p ? Math.max(p.score, Math.max(...R.values)) : 0;
    ov.innerHTML = `<div class="clue-card">
      <div class="dd-title">DAILY DOUBLE!</div>
      <div class="clue-meta center">${esc(C.name)}</div>
      <p class="label">Who found it?</p>
      <div class="pick">${play.players.map(p => `<button class="chip ${vc.ddPlayer === p.id ? 'on' : ''}" data-act="dd-pick" data-p="${p.id}">${esc(p.name)}<small>${fmt(p.score)}</small></button>`).join('')}</div>
      ${p ? `<label class="label" for="dd-wager">Wager (up to ${fmt(maxW)})</label><input id="dd-wager" type="number" class="wager" data-ddwager min="0" max="${maxW}" value="${esc(vc.wager ?? '')}">` : ''}
      <div class="err">${esc(vc.err || '')}</div>
      <div class="actions"><button data-act="clue-cancel">Back to board</button><button class="primary" data-act="dd-go">Show clue →</button></div>
    </div>`;
    const w = ov.querySelector('.wager');
    if (w) { w.focus(); const n = w.value.length; try { w.setSelectionRange(n, n); } catch {} }
    return;
  }
  if (vc.stage === 'secret') {
    ov.innerHTML = `<div class="clue-card">${secretHtml(vc.secret)}
      <div class="actions"><button class="primary" data-act="secret-go" ${wheelLanded(vc.secret) ? '' : 'disabled'}>Continue →</button></div></div>`;
    if (!wheelLanded(vc.secret)) scheduleRender(wheelLeft(vc.secret) + 60);
    return;
  }
  if (vc.stage === 'bj') {
    ov.innerHTML = `<div class="clue-card">${bjHtml(bjLive(vc), play.players, { host: true })}</div>`;
    return;
  }
  if (vc.stage === 'art' || vc.stage === 'art-judge') {
    ov.innerHTML = hostArtHtml(vc, C, clue);
    return;
  }

  const dd = !!vc.ddPlayer, worth = clueWorth();
  const judges = dd ? [player(vc.ddPlayer)].filter(Boolean)
    : [...vc.queue.map(player).filter(Boolean), ...play.players.filter(p => !vc.queue.includes(p.id))];
  ov.innerHTML = `<div class="clue-card">
    ${effectPill(vc.effect)}
    <div class="clue-meta"><span>${esc(C.name)}</span><span>${dd ? `Daily Double · ${esc(player(vc.ddPlayer)?.name)} wagers ${fmt(worth)}` : fmt(worth)}${vc.mult > 1 ? ' · ×2' : ''}</span></div>
    ${hostQuestionHtml(vc, clue)}
    ${vc.revealed ? `<div class="answer"><span class="tag">Correct response</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`
      : `<div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`}
    ${dd ? '' : `<div class="buzzbar">
      <span class="state ${vc.open ? 'open' : ''}">Buzzers ${vc.open ? 'open' : 'closed'}</span>
      <button data-act="toggle-buzz">${vc.open ? 'Close buzzers' : 'Open buzzers'}</button>
      <button data-act="reset-buzz" ${vc.queue.length ? '' : 'disabled'}>Clear buzz queue</button></div>`}
    <div class="judge">${judges.map(p => { const w = vc.wrong.includes(p.id), qi = vc.queue.indexOf(p.id); return `
      <div class="jrow ${w ? 'wrong' : ''} ${qi === 0 && !w ? 'first' : ''}">${qi >= 0 ? `<span class="pos">${qi + 1}</span>` : ''}${avatarSvg(p.av, 28)}<span class="who">${nameHtml(p)}</span>
        <button class="ok" data-act="right" data-p="${p.id}" ${w ? 'disabled' : ''} title="Correct">✓ ${fmt(worth)}</button>
        <button class="no" data-act="wrong" data-p="${p.id}" ${w ? 'disabled' : ''} title="Incorrect">✗ ${S().wrongCosts ? fmt(-worth) : 'Wrong'}</button></div>`; }).join('')}
    </div>
    <div class="actions">
      ${vc.revealed ? '' : `<button data-act="reveal">Show response to players<kbd>Space</kbd></button>`}
      ${dd || vc.effect ? '' : `<button data-act="clue-cancel">Back to board<kbd>Esc</kbd></button>`}
      ${dd ? '' : `<button class="primary" data-act="clue-done">No one got it · close</button>`}
    </div>
  </div>`;
}

function timerBar(end, total) {
  total = total || 30000;
  const left = end ? end - Date.now() : 0;
  if (left <= 0) return end ? `<div class="timer"><div style="width:0"></div></div>` : '';
  return `<div class="timer"><div style="animation-duration:${total}ms;animation-delay:-${Math.max(0, total - left)}ms"></div></div>`;
}
function podium(players) {
  const ranked = [...players].sort((a, b) => b.score - a.score);
  const top = ranked[0]?.score;
  const tie = ranked.filter(p => p.score === top).length > 1;
  return `<div class="dd-title" style="font-size:clamp(34px,6vw,80px)">${!ranked.length ? 'Game over' : tie ? "It's a tie!" : `${esc(ranked[0].name)} wins!`}</div>
    <div class="podium">${ranked.map(p => `<div class="prow-r ${p.score === top ? 'win' : ''}"><span class="ptag">${avatarSvg(p.av, 40)}${p.score === top ? `<span>👑 ${esc(p.name)}</span>` : nameHtml(p)}</span><span class="s">${fmt(p.score)}</span></div>`).join('')}</div>`;
}

function renderFinal() {
  const g = playGame(), f = g.final, F = play.final;
  const head = `<header class="top">
      ${F.applied ? `<button class="ghost" data-act="home">☰ Games</button>` : `<button class="ghost" data-act="back-board">← Board</button>`}
      <span class="round-name">${F.stage === 'results' ? 'Final Scores' : 'Final 2MixParty!'}</span>
      <span class="spacer"></span>${connectedChip()}${soundButton()}<button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button></header>`;
  let body = '';
  const eligible = p => p.score > 0;

  if (F.stage === 'category') {
    body = `<div class="clue-card">
      <div class="dd-title" style="font-size:clamp(36px,7vw,90px)">Final 2MixParty!</div>
      <p class="label">The category is…</p>
      <div class="final-cat">${esc(f.category) || '—'}</div>
      <div class="actions"><button class="primary" data-act="f-wagers">Enter wagers →</button></div></div>`;
  } else if (F.stage === 'wager') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <p class="label">Players with a positive score may wager up to their total. Players lock in wagers on their devices, and only you see the amounts. You can also type or change a wager here.</p>
      <div class="wtable">${play.players.map(p => `<div class="wrow"><span><strong>${esc(p.name)}</strong>${F.submitted?.[p.id] ? ' <span class="locked">locked in</span>' : ''}</span><span class="sc muted">${fmt(p.score)}</span>
        ${eligible(p) ? `<input id="fw-${p.id}" type="number" min="0" max="${p.score}" data-fwager="${p.id}" value="${esc(F.wagers[p.id] ?? '')}" placeholder="Wager" aria-label="${esc(p.name)} wager">` : `<span class="muted">Not eligible</span>`}</div>`).join('')}
      </div>
      <div class="err">${esc(F.err || '')}</div>
      <div class="actions"><button class="primary" data-act="f-clue">Show clue →</button></div></div>`;
  } else if (F.stage === 'clue') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text">${esc(f.q)}</div>
      ${timerBar(F.timerEnd, F.timerMs)}
      <div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="actions">
        <button data-act="f-timer">${F.timerEnd ? 'Restart' : 'Start'} ${S().finalSeconds}s timer</button>
        <button class="primary" data-act="f-reveal">Reveal response<kbd>Space</kbd></button>
      </div></div>`;
  } else if (F.stage === 'reveal') {
    const players = play.players.filter(eligible);
    const allJudged = players.every(p => p.id in F.results);
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text" style="font-size:clamp(18px,2.6vw,34px)">${esc(f.q)}</div>
      <div class="answer">${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="wtable">${players.length ? players.map(p => { const res = F.results[p.id]; return `<div class="wrow judge-row">
        <strong>${esc(p.name)}</strong><span class="muted">wagered ${fmt(F.wagers[p.id] || 0)}</span>
        <button class="ok ${res === true ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="1" aria-label="Correct">✓</button>
        <button class="no ${res === false ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="0" aria-label="Incorrect">✗</button></div>`; }).join('')

function buzzState() {
  const c = live?.phase === 'board' ? live.clue : null;
  if (pstate !== 'connected') return { label: 'Reconnecting…', cls: '', off: true };
  if (!c) return { label: 'Wait for a clue', cls: '', off: true };
  if (c.dd) return { label: 'Daily Double', cls: '', off: true };
  if (c.stage !== 'clue') return { label: 'Get ready…', cls: '', off: true };
  if (!live.players.some(p => p.id === me.pid)) return { label: 'Joining…', cls: '', off: true };
  if (c.lockout.includes(me.pid)) return { label: 'Locked out', cls: 'out', off: true };
  const pos = c.queue.indexOf(me.pid);
  if (pos === 0) return { label: "You're up! Answer", cls: 'up', off: true };

// 1 or 2 tiles per board hide a secret, picked when the board is first played. Players never receive the list.
function ensureSecrets() {

  play.secretRounds[r] = true;

  playGame().rounds[r].categories.forEach((C, c) => C.clues.forEach((cl, i) => {
    if (filled(cl) && !play.used[`${r}-${c}-${i}`] && !(cl.dd && S().dailyDoubles)) cand.push(`${r}-${c}-${i}`);
  }));

// The wheel: the host picks the result; every screen spins to it from when it first sees it.
const WHEEL_DELAY = 1100, WHEEL_SPIN = 4200;

  const n = SECRETS.length, seg = 360 / n, idx = Math.max(0, SECRETS.findIndex(x => x.key === sec.effect));
  const end = 360 * 6 - (idx * seg + seg / 2) + ((hashStr(sec.spinId) % Math.round(seg * .6)) - seg * .3);
  const elapsed = Date.now() - (wheelSeen[sec.spinId] ||= Date.now());
  const pt = a => `${(100 * Math.sin(a * Math.PI / 180)).toFixed(2)} ${(-100 * Math.cos(a * Math.PI / 180)).toFixed(2)}`;
  const slices = SECRETS.map((x, i) => `<path d="M0 0 L${pt(i * seg)} A100 100 0 0 1 ${pt((i + 1) * seg)} Z" fill="${x.color}" stroke="#1f0d3f" stroke-width="2"/>
    <text transform="rotate(${i * seg + seg / 2 - 90}) translate(60 0)" text-anchor="middle" dominant-baseline="middle">${esc(x.short)}</text>`).join('');
  const landed = elapsed >= WHEEL_DELAY + WHEEL_SPIN;
  const x = secretOf(sec.effect);
  if (!landed) scheduleRender(WHEEL_DELAY + WHEEL_SPIN - elapsed + 60);
  return `<div class="secret-title">✨ SECRET FOUND! ✨</div>
    <div class="wheel-wrap"><div class="wheel-pointer"></div>
      <svg class="wheel" viewBox="-104 -104 208 208" style="--end:${end}deg;animation-delay:${WHEEL_DELAY - elapsed}ms" aria-hidden="true">${slices}<circle r="13" fill="#1f0d3f"/><circle r="8" fill="#ffd23f"/></svg></div>
    <div class="secret-result ${landed ? 'on' : ''}">${landed && x ? `<div class="secret-name" style="color:${x.color}">${x.icon} ${esc(x.label)}</div><p class="label">${esc(x.desc)}</p>` : '<p class="label">Spinning the wheel of chaos…</p>'}</div>`;

// ---- Wrote this, Yoda did! (rule-based rewording: move what follows the verb, or a trailing
// prepositional phrase, to the front; words inside quotes are never split)
const YODA_AUX = new Set('is are was were am be been has have had can could will would shall should may might must do does did'.split(' '));
const YODA_MODAL = new Set('can could will would shall should may might must do does did'.split(' '));
const YODA_PREP = new Set('in on at of from with without by for to into onto over under near about after before during through like across around between among against inside'.split(' '));

  const low = x => (YODA_LOWER.has(x.toLowerCase()) || YODA_PREP.has(x.toLowerCase())) ? x.toLowerCase() : x;
  const pronounStart = YODA_LOWER.has(w[0].toLowerCase());
  const k = w.findIndex((x, i) => i > 0 && !quoted[i] && (YODA_AUX.has(x.toLowerCase()) || (pronounStart && /^[a-z]{3,}ed$/.test(x))));
  if (k > 0 && YODA_MODAL.has(w[k].toLowerCase()) && k < w.length - 2) {
    const subj = w.slice(0, k); subj[0] = low(subj[0]);
    return `${w.slice(k + 2).join(' ')}, ${subj.join(' ')} ${w[k]} ${w[k + 1]}`;
  }
  if (k > 0 && k < w.length - 1) {
    const subj = w.slice(0, k); subj[0] = low(subj[0]);
    return `${w.slice(k + 1).join(' ')}, ${subj.join(' ')} ${w[k]}`;
  }
  let j = -1, jOf = -1;
  w.forEach((x, i) => { if (i > 0 && !quoted[i] && YODA_PREP.has(x.toLowerCase())) { if (x.toLowerCase() === 'of') { if (jOf < 0) jOf = i; } else j = i; } });
  if (j < 0) j = jOf;
  if (j > 0) { const head = w.slice(0, j); head[0] = low(head[0]); return `${w.slice(j).join(' ')}, ${head.join(' ').replace(/,+$/, '')}, it is`; }
  return null;
}
function yodaify(text) {
  let t = String(text).trim().replace(/\s+/g, ' ');

  const end = /[?!]$/.test(t) ? t.slice(-1) : '.';
  t = t.replace(/[.?!]+$/, '')
    .replace(/\b(it|that|he|she|what|there|here)['’]s\b/gi, '$1 is')
    .replace(/\b(\w+)['’]re\b/gi, '$1 are').replace(/\bI['’]m\b/g, 'I am');
  const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  let out = null;
  const ci = t.lastIndexOf(', ');
  if (ci > 0) {  // try just the last clause first ("Known as X, it is Y" -> "Known as X, Y, it is")
    const core = yodaCore(t.slice(ci + 2).split(' '));
    if (core) out = t.slice(0, ci) + ', ' + core;
  }
  if (!out) { const core = yodaCore(t.split(' ')); out = core ? cap(core) : t; }

}

}

const ART_MS = 30000, ART_W = 400, ART_H = 300;

    for (let i = 0; i + 1 < st.p.length && budget > 0; i += 2, budget--) {
      pts.push(Math.max(0, Math.min(ART_W, Math.round(+st.p[i] || 0))), Math.max(0, Math.min(ART_H, Math.round(+st.p[i + 1] || 0))));

    if (st.p.length === 2) { ctx.beginPath(); ctx.arc(st.p[0], st.p[1], st.w / 2, 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(st.p[0], st.p[1]);

  drawStrokes(ctx, me.art.strokes);

  const at = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * ART_W), Math.round((e.clientY - r.top) / r.height * ART_H)]; };

    e.preventDefault(); cv.setPointerCapture(e.pointerId);

    drawStrokes(ctx, me.art.strokes);

  cv.onpointermove = e => {
    if (!cur) return;
    const [x, y] = at(e), n = cur.p.length;

    cur = null; me.drawing = false;

    if (!you || isNaN(w) || w < 1 || w > you.score) { me.bjErr = `Wager between $1 and ${fmt(you?.score || 0)}.`; return render(); }
    me.bjErr = ''; sendBj({ action: 'wager', w });
  },
  'bj-sit'() { me.bjErr = ''; sendBj({ action: 'wager', w: 0 }); },
  'art-end'() { const vc = play.clue; vc.stage = 'art-judge'; savePlay(); render(); },
  'art-pick'(d) {
    const vc = play.clue;
    if (vc.art.winner !== undefined) return;
    vc.art.winner = d.p; vc.revealed = true;
    adjust(d.p, clueWorth()); celebrate('confetti');
    savePlay(); render();
  },
  'art-none'() { const vc = play.clue; vc.art.winner = null; vc.revealed = true; celebrate('skulls'); savePlay(); render(); },
  'art-close'() { markUsed(); },
  'art-color'(d) { me.art.color = d.c; me.art.size = d.c === '#ffffff' ? 18 : 4; render(); },
  'art-clear'() { me.art.strokes = []; me.art.sent = false; render(); },
  'art-send'() { sendArt(); render(); },
  'cap-toggle'(d) {

    render();
  },
  'cap-verify'() {
    const cap = me.captcha;
    const want = cap.cells.map((e, i) => e === cap.target ? i : -1).filter(i => i >= 0);

  },
  'dd-pick'(d) { play.clue.ddPlayer = d.p; play.clue.err = ''; savePlay(); render(); },
  'dd-go'() {
    const vc = play.clue;

    const R = playGame().rounds[vc.r], max = Math.max(player(vc.ddPlayer).score, Math.max(...R.values));
    const w = parseInt(vc.wager);
    if (isNaN(w) || w < 0 || w > max) { vc.err = `Enter a wager between $0 and ${fmt(max)}.`; return renderOverlay(); }
    vc.wager = w; vc.stage = 'clue'; vc.err = ''; vc.open = false;
    savePlay(); render();
  },
  reveal() { play.clue.revealed = true; play.clue.open = false; savePlay(); render(); },
  right(d) { adjust(d.p, clueWorth()); celebrate('confetti'); markUsed(); },
  wrong(d) {

    vc.wrong.push(d.p);

  'toggle-buzz'() { play.clue.open = !play.clue.open; savePlay(); render(); },
  'reset-buzz'() { play.clue.queue = []; play.clue.token = uid(); play.clue.open = true; savePlay(); render(); },

  async 'edit-score'(d) {

  async 'player-menu'(d) {

    const msg = `Remove ${name} from the game?` + (remote ? ' Their device is disconnected, and they can’t rejoin until you allow them back from the setup screen.' : ' Their score will be lost.');

function joinAs(watch) {
  const code = ($('#join-code')?.value ?? me.code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  const name = ($('#join-name')?.value ?? me.name).trim().slice(0, 24);
  if (code.length !== 4) { me.err = 'Enter the 4-character room code from the host’s screen.'; return render(); }
  if (!watch && !name) { me.err = 'Enter a name so the host knows who buzzed.'; return render(); }
  const codeChanged = code !== me.code;
  Object.assign(me, { code, watch, joined: true, err: '' });
  if (!watch) me.name = name;
  lsSet('jeoparty.name', me.name); lsSet('jeoparty.watch', watch); lsSet('jeoparty.lastCode', code);
  history.replaceState(null, '', `${location.pathname}?join=${code}`);
  if (codeChanged || !pconn || pstate !== 'connected') { live = null; connectPlayer(); }
  else sendHello();
  render();
}

document.addEventListener('click', e => {

function onField(e) {

document.addEventListener('input', onField);

document.addEventListener('focusout', () => setTimeout(() => {

}, 0));

document.addEventListener('keydown', e => {
  if (!$('#dialog').hidden) return;
  const typing = !!e.target.matches?.('input, textarea');
  if (role === 'player') {
    if (e.key === 'Enter' && (e.target.id === 'join-name' || e.target.id === 'join-code')) { e.preventDefault(); joinAs(false); }
    else if (e.key === 'Enter' && e.target.id === 'fw-input') { e.preventDefault(); actions['p-wager'](); }
    else if (e.key === 'Enter' && e.target.id === 'bj-wager') { e.preventDefault(); actions['bj-join'](); }
    else if (!typing && (e.key === ' ' || e.key === 'Enter') && me.joined && !me.watch) { e.preventDefault(); actions.buzz(); }
    return;

  if (view.name === 'board' && play?.clue) {
    const vc = play.clue;
    if (e.key === 'Enter' && typing && 'ddwager' in e.target.dataset) { e.preventDefault(); actions['dd-go'](); return; }
    if (typing) return;
    if (e.key === ' ' && vc.stage === 'clue' && !vc.revealed) { e.preventDefault(); actions.reveal(); }
    else if (e.key === 'Escape' && !vc.ddPlayer && vc.stage === 'clue' && !vc.effect) actions['clue-cancel']();
  } else if (view.name === 'final' && !typing && e.key === ' ' && play?.final?.stage === 'clue') {
    e.preventDefault(); actions['f-reveal']();
  }

$('#file').addEventListener('change', async e => {

    const data = JSON.parse(await file.text());
    const list = (Array.isArray(data) ? data : [data]).map(g => normalize(g));
    list.forEach((g, n) => { g.created = Date.now() + n; games.push(g); });
    saveGames(); render();
    toast(`Imported ${list.length} game${list.length > 1 ? 's' : ''}.`);

// ---------- Host networking ----------
function startHost(attempt = 0) {
  if (!window.Peer) { peerState = 'error'; refresh(); return; }
  if (!roomCode()) lsSet('jeoparty.room', newCode());
  peerState = 'connecting';
  const p = new Peer(PEER_PREFIX + roomCode(), { debug: 0 });
  peer = p;
  p.on('open', () => { peerState = 'online'; refresh(); });
  p.on('connection', setupHostConn);
  p.on('disconnected', () => {
    // Lost the broker only; open player connections keep working. Re-register so new players can join.
    if (p.destroyed) return;
    peerState = 'connecting'; refresh();
    setTimeout(() => { if (!p.destroyed) p.reconnect(); }, 2000);
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id') {
      // Usually this tab's previous session hasn't expired yet (a reload); after a few tries, take a new code.
      p.destroy();
      if (attempt < 4) setTimeout(() => startHost(attempt + 1), 3000);
      else { lsSet('jeoparty.room', newCode()); startHost(0); }
    } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'].includes(err.type)) {
      peerState = 'error'; refresh();
      if (err.type !== 'browser-incompatible') setTimeout(() => { if (peer === p) { p.destroy(); startHost(0); } }, 5000);
    }
  });
}
// A closed phone or browser often never says goodbye, so both sides check in every few seconds
// and the host drops anyone it hasn't heard from in HEARTBEAT_TIMEOUT.
const HEARTBEAT_MS = 3000, HEARTBEAT_TIMEOUT = 12000;
function dropConn(rec) {
  for (const [id, r] of conns) if (r === rec) conns.delete(id);
  try { rec.conn.close(); } catch {}
  refreshPeers();
}
setInterval(() => {
  if (role !== 'host') return;
  const now = Date.now();
  for (const rec of [...conns.values()]) {
    if (now - rec.lastSeen > HEARTBEAT_TIMEOUT) dropConn(rec);
    else send(rec, { type: 'ping' });
  }
}, HEARTBEAT_MS);

// Players the host removed; they can't rejoin until allowed back from the setup screen.
let blocked = lsGet('jeoparty.blocked', []);
const isBlocked = pid => blocked.some(b => b.pid === pid);
function removePlayer(pid) {
  const name = player(pid)?.name || peersList.find(p => p.pid === pid)?.name || 'Player';
  const remote = !!player(pid)?.remote || peersList.some(p => p.pid === pid);
  if (remote && !isBlocked(pid)) { blocked.push({ pid, name }); lsSet('jeoparty.blocked', blocked); }
  if (play) {
    play.players = play.players.filter(p => p.id !== pid);
    const cl = play.clue;
    if (cl) {
      if (cl.ddPlayer === pid) play.clue = null;
      else { cl.queue = cl.queue.filter(x => x !== pid); cl.wrong = cl.wrong.filter(x => x !== pid); }
    }
    const F = play.final;
    if (F) { delete F.wagers?.[pid]; delete F.submitted?.[pid]; delete F.results?.[pid]; }
    savePlay();
  }
  for (const rec of [...conns.values()]) {
    if (rec.pid === pid) { rec.role = null; send(rec, { type: 'kicked' }); setTimeout(() => dropConn(rec), 300); }
  }
  refreshPeers();
}

function setupHostConn(conn) {
  const rec = { conn, pid: null, name: '', role: null, lastSeen: Date.now() };
  conns.set(conn.connectionId, rec);
  conn.on('data', m => { rec.lastSeen = Date.now(); onHostMsg(rec, m); });
  const drop = () => { if (conns.get(conn.connectionId) === rec) { conns.delete(conn.connectionId); refreshPeers(); } };
  conn.on('close', drop);
  conn.on('error', drop);
}
function onHostMsg(rec, m) {
  if (!m || typeof m !== 'object') return;
  if (m.type === 'bye') { dropConn(rec); return; }
  if (m.type === 'hello') {
    rec.role = m.role === 'watch' ? 'watch' : 'player';
    rec.pid = str(m.pid, 40);
    rec.name = str(m.name, 24).trim();
    rec.av = cleanAv(m.av);
    if (rec.role === 'player' && (!rec.pid || !rec.name)) { rec.role = null; return; }
    if (rec.role === 'player' && isBlocked(rec.pid)) {
      rec.role = null; send(rec, { type: 'kicked' });
      setTimeout(() => dropConn(rec), 300);
      return;
    }
    for (const [id, r] of conns) {
      if (r !== rec && r.pid && r.pid === rec.pid) { conns.delete(id); try { r.conn.close(); } catch {} }
    }
    refreshPeers();
    send(rec, { type: 'state', state: buildLive() });
  } else if (m.type === 'buzz') {
    const cl = play?.clue;
    if (rec.role !== 'player' || !cl || cl.stage !== 'clue' || !cl.open || cl.ddPlayer || m.token !== cl.token) return;
    if (cl.queue.includes(rec.pid) || cl.wrong.includes(rec.pid) || !player(rec.pid)) return;
    const first = cl.queue.length === 0;
    cl.queue.push(rec.pid);
    buzzSound(first);
    savePlay(); refresh();
  } else if (m.type === 'wager') {
    const F = play?.final, pl = player(rec.pid);
    if (rec.role !== 'player' || !F || F.stage !== 'wager' || m.token !== F.token || !pl || pl.score <= 0) return;
    const n = parseInt(m.w);
    if (isNaN(n) || n < 0 || n > pl.score) return;
    F.wagers[rec.pid] = n; F.submitted[rec.pid] = true;
    savePlay(); refresh();
  } else if (m.type === 'bj') {
    const cl = play?.clue;
    if (rec.role !== 'player' || !cl?.bj || m.token !== cl.token) return;
    if (m.action === 'wager') { bjSetWager(rec.pid, parseInt(m.w) || 0); savePlay(); refresh(); }
    else if (m.action === 'hit' || m.action === 'stand') bjAct(rec.pid, m.action);
  } else if (m.type === 'art') {
    const cl = play?.clue;
    if (rec.role !== 'player' || !cl?.art || m.token !== cl.token || !player(rec.pid)) return;
    const late = cl.stage === 'art-judge' && (cl.art.drawings[rec.pid] || Date.now() > cl.art.endsAt + 6000);
    if (cl.stage !== 'art' && (cl.stage !== 'art-judge' || late)) return;
    cl.art.drawings[rec.pid] = cleanStrokes(m.strokes);
    savePlay(); refresh();
  }
}
function refreshPeers() {
  const seen = new Map(); let watch = 0;
  for (const r of conns.values()) {
    if (r.role === 'watch') watch++;
    else if (r.role === 'player' && !seen.has(r.pid)) seen.set(r.pid, { pid: r.pid, name: r.name, av: r.av });
  }
  peersList = [...seen.values()]; watchers = watch;
  if (play && playGame()) {
    let changed = false;
    for (const x of peersList) {
      if (isBlocked(x.pid)) continue;
      const p = player(x.pid);
      if (!p) { play.players.push({ id: x.pid, name: x.name, av: x.av, score: 0, remote: true }); changed = true; }
      else if (p.name !== x.name || JSON.stringify(p.av) !== JSON.stringify(x.av)) { p.name = x.name; p.av = x.av; changed = true; }
    }
    if (changed) savePlay();
  }
  refresh();

// ---------- Player networking ----------
function sendHello() {
  try { pconn?.send({ type: 'hello', pid: me.pid, name: me.watch ? '' : me.name, av: me.av, role: me.watch ? 'watch' : 'player' }); } catch {}
}
function openPlayerPeer() {
  return new Promise((resolve, reject) => {
    const p = new Peer({ debug: 0 });
    const t = setTimeout(() => { p.destroy(); reject({ type: 'timeout' }); }, 12000);
    p.on('open', () => { clearTimeout(t); resolve(p); });
    p.on('error', err => {
      if (!p.open) { clearTimeout(t); p.destroy(); reject(err); }
      else if (err.type === 'peer-unavailable') { p.lastUnavailable = Date.now(); }
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) p.destroy();
    });
  });
}
let playerPeer = null;
async function connectPlayer() {
  if (pConnecting) return;
  pConnecting = true;
  await peerReady;
  if (!window.Peer) { pConnecting = false; pstate = 'lost'; refresh(); scheduleRetry(); return; }
  clearTimeout(retryTimer);
  const old = pconn; pconn = null;
  try { old?.close(); } catch {}
  if (pstate !== 'lost') pstate = 'connecting';
  refresh();
  try {
    if (!playerPeer || playerPeer.destroyed || playerPeer.disconnected) {
      try { playerPeer?.destroy(); } catch {}
      playerPeer = await openPlayerPeer();
    }
    const p = playerPeer, since = Date.now();
    const c = p.connect(PEER_PREFIX + me.code, { reliable: true });
    await new Promise((resolve, reject) => {
      const iv = setInterval(() => {
        if (p.lastUnavailable >= since) { cleanup(); reject({ type: 'peer-unavailable' }); }
        else if (p.destroyed) { cleanup(); reject({ type: 'network' }); }
      }, 250);
      const t = setTimeout(() => { cleanup(); reject({ type: 'timeout' }); }, 12000);
      const cleanup = () => { clearInterval(iv); clearTimeout(t); };
      c.on('open', () => { cleanup(); resolve(); });
      c.on('error', e => { cleanup(); reject(e); });
    });
    pconn = c;
    pstate = 'connected';
    lastHostMsg = Date.now();
    c.on('data', m => {
      lastHostMsg = Date.now();
      if (!m || typeof m !== 'object') return;
      if (m.type === 'state' && m.state && typeof m.state === 'object') onLive(m.state);
      else if (m.type === 'kicked') onKicked();
    });
    const lost = () => { if (pconn === c) { pconn = null; pstate = 'lost'; refresh(); scheduleRetry(); } };
    c.on('close', lost);
    c.on('error', lost);
    sendHello();
  } catch (e) {
    try { playerPeer && e?.type !== 'peer-unavailable' && playerPeer.destroy(); } catch {}
    pstate = e?.type === 'peer-unavailable' ? 'notfound' : 'lost';
    scheduleRetry();
  }

}
function scheduleRetry() {
  clearTimeout(retryTimer);

}
function onKicked() {
  me.kicked = true; me.joined = false; live = null;
  clearTimeout(retryTimer);
  const c = pconn; pconn = null; pstate = 'idle';
  try { c?.close(); } catch {}
  render();
}
// Check in with the host; if the host goes quiet (tab closed, network dropped), reconnect.
let lastHostMsg = 0;
setInterval(() => {
  if (role !== 'player' || !pconn || pstate !== 'connected') return;
  if (Date.now() - lastHostMsg > HEARTBEAT_TIMEOUT) {
    const c = pconn; pconn = null; pstate = 'lost';
    try { c.close(); } catch {}
    refresh(); connectPlayer();
    return;
  }
  try { pconn.send({ type: 'ping' }); } catch {}
}, HEARTBEAT_MS);
// Say goodbye when the tab closes so the host doesn't wait for the timeout.
window.addEventListener('pagehide', () => { try { pconn?.send({ type: 'bye' }); } catch {} });
let lastToken = null, lastQueueLen = 0, lastFxId; // lastFxId stays undefined until the first state
function onLive(state) {
  live = state;
  const fx = live?.fx;
  if (fx && fx.id !== lastFxId && lastFxId !== undefined && ['confetti', 'skulls', 'both', 'secret'].includes(fx.kind)) playFx(fx.kind);
  lastFxId = fx?.id ?? null;
  const tok = live?.clue?.token || null, qLen = live?.clue?.queue?.length || 0;
  if (tok && me.buzzToken && tok !== me.buzzToken) me.buzzToken = null;
  // TV screens ring for every buzz; players only hear their own (played when they press).
  if (me.watch && tok && tok === lastToken && qLen > lastQueueLen) buzzSound(lastQueueLen === 0);
  lastToken = tok; lastQueueLen = qLen;
  if (live?.final?.token && me.fwSent && me.fwSent.token !== live.final.token) me.fwSent = null;
  // Drawing time's up: hand in whatever is on the canvas.
  if (live?.clue?.stage === 'art-judge' && me.art?.token === live.clue.token && !me.art.sent && me.art.strokes.length) sendArt();
  if (me.drawing) needsRender = true;
  else if (typingInApp() && !(document.activeElement?.id === 'fw-input' && live?.final?.stage !== 'wager')) needsRender = true;
  else render();
}

// ---------- Boot ----------
if (role === 'host') {
  games = (lsGet('jeoparty.games', null) || [sampleGame()]).map(g => normalize(g, g.id));
  games.sort((a, b) => (a.created || 0) - (b.created || 0));
  saveGames();
  play = lsGet('jeoparty.play', null);
  if (play && !gameById(play.gameId)) play = null;
  if (play) view = { name: play.final ? 'final' : 'board' }; // a reload mid-game goes straight back to it
  render();
  peerReady.then(() => startHost());
} else {
  if (me.code.length === 4 && (me.name || me.watch) && params.get('join')) { me.joined = true; connectPlayer(); }
  render();
}
</script>

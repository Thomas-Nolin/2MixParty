<title>2MixParty!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #120a24;
    --panel: #1d1238;
    --panel2: #2b1c52;
    --board: #34207a;
    --board-dk: #241453;
    --accent: #ffa8d8;
    --text: #eef1ff;
    --muted: #a797cc;
    --line: rgba(255, 255, 255, .14);
    --ok: #1f9d5c;
    --no: #d93b40;
    --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
    --serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #app { min-height: 100%; }
  button {
    font: inherit; cursor: pointer; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    padding: .5em .9em; border-radius: 8px;
  }
  button:hover:not(:disabled) { border-color: rgba(255, 255, 255, .4); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1f0d3f; border-color: transparent; font-weight: 700; }
  button.ghost { background: transparent; }
  button.danger { color: #ff9a9d; }
  button.dangerbtn { background: var(--no); border-color: transparent; font-weight: 700; }
  button.icon { background: transparent; padding: .25em .55em; }
  input, textarea {
    font: inherit; color: var(--text); width: 100%;
    background: rgba(0, 0, 0, .28); border: 1px solid var(--line);
    border-radius: 6px; padding: .45em .6em;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  kbd { font-size: .75em; border: 1px solid currentColor; border-radius: 4px; padding: 0 .35em; opacity: .7; margin-left: .4em; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  .top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .25);
  }
  .logo { font-family: var(--display); letter-spacing: .04em; color: var(--accent); font-size: 30px; margin: 0; text-shadow: 2px 2px 0 #000; font-weight: 400; }
  .logo.sm { font-size: 22px; }
  .logo.big { font-size: clamp(44px, 12vw, 72px); text-align: center; }
  .title-input { max-width: 420px; font-weight: 700; font-size: 17px; }
  .round-name { font-family: var(--display); color: var(--accent); font-size: 22px; letter-spacing: .03em; text-shadow: 2px 2px 0 #000; }
  .chip-live { font-size: 13px; padding: .25em .7em; border-radius: 999px; background: rgba(47, 191, 113, .18); color: #8ff0bd; border: 1px solid rgba(47, 191, 113, .4); white-space: nowrap; }
  .chip-live.off { background: rgba(255, 255, 255, .06); color: var(--muted); border-color: var(--line); }
  .wait { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 48px 16px; min-height: 50vh; }

  /* Home */
  .home { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 20px; align-items: center; }
  .resume {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--board-dk); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  }
  .howto { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
  .howto strong { color: var(--accent); }
  .howto p { margin: 0 0 4px; }
  .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* Editor */
  .editor { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .section-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .section-head input { max-width: 280px; font-weight: 700; }
  .section-head h2 { margin: 0; font-size: 17px; }
  .grid-wrap { overflow-x: auto; }
  .ed-grid { border-collapse: separate; border-spacing: 6px; }
  .ed-grid th, .ed-grid td { vertical-align: top; min-width: 210px; padding: 0; }
  .ed-grid .valcol { min-width: 120px; width: 120px; }
  .valcell { display: flex; gap: 2px; align-items: center; }
  .cat-h { display: flex; gap: 4px; }
  .cat-h input { font-weight: 700; text-transform: uppercase; background: var(--board-dk); }
  .cell-ed { display: flex; flex-direction: column; gap: 4px; background: rgba(52, 32, 122, .35); padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
  .cell-ed.dd { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell-ed textarea { resize: vertical; min-height: 66px; }
  .dd-toggle { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .final-ed { display: grid; gap: 8px; max-width: 720px; }
  .final-ed label { font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }

  /* Setup / panels */
  .panel { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .panel h2 { font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 30px; margin: 0 0 16px; letter-spacing: .03em; }
  .panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  .plist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .plist .prow { display: flex; gap: 6px; align-items: center; }
  .remote-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .remote-list span { background: var(--board-dk); border: 1px solid var(--line); padding: .3em .8em; border-radius: 999px; }

  /* Board */
  .board-view { height: 100%; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .board {
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
    gap: 6px; padding: 8px; background: #0a0515; min-height: 0; position: relative;
  }
  .board .cat {
    background: var(--board); display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-family: var(--display); text-transform: uppercase; color: #fff;
    font-size: clamp(11px, 1.9vw, 28px); line-height: 1.1; text-shadow: 2px 2px 0 #000; overflow: hidden;
    border-bottom: 4px solid #0a0515; overflow-wrap: anywhere;
  }
  .board .cell {
    background: var(--board); border: 0; border-radius: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); color: var(--accent); font-size: clamp(16px, 4.4vw, 60px); text-shadow: 3px 3px 0 #000;
    transition: filter .15s;
  }
  .board button.cell:hover:not(:disabled) { filter: brightness(1.3); border: 0; }
  .board .cell:disabled { opacity: 1; }
  .round-done {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, .85); border: 2px solid var(--accent); border-radius: 14px; padding: 22px 28px; text-align: center;
  }
  .round-done p { font-family: var(--display); color: var(--accent); font-size: 30px; margin: 0 0 12px; }
  .scores { display: flex; gap: 8px; padding: 8px; overflow-x: auto; background: #0a0515; align-items: stretch; }
  .player { flex: 1 1 0; min-width: 110px; background: var(--board-dk); border-radius: 6px; text-align: center; padding: 6px 8px; border: 2px solid transparent; }
  .player.you { border-color: var(--accent); }
  .pname { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #ddd0fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pscore { font-family: var(--display); font-size: clamp(20px, 2.6vw, 34px); color: #fff; background: none; border: 0; padding: 0; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .player.neg .pscore { color: #ff8f93; }
  .scores .undo { align-self: center; white-space: nowrap; }

  /* Clue overlay (host) */
  #overlay {
    position: fixed; inset: 0; z-index: 10; background: var(--board);
    display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: zoom .28s ease-out;
  }
  @keyframes zoom { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .clue-card { width: min(1150px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 22px; text-align: center; padding: 4px; }
  .clue-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--display); text-transform: uppercase; color: var(--accent); font-size: clamp(16px, 2vw, 26px); letter-spacing: .03em; }
  .clue-meta.center { justify-content: center; }
  .clue-text { font-family: var(--serif); text-transform: uppercase; font-size: clamp(22px, 4vw, 56px); line-height: 1.3; text-shadow: 3px 3px 0 #000; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer { font-family: var(--serif); color: var(--accent); font-size: clamp(18px, 2.8vw, 38px); text-shadow: 2px 2px 0 #000; white-space: pre-wrap; animation: fade .3s; }
  .answer .tag { display: block; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #ddd0fa; text-shadow: none; margin-bottom: 4px; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .reveal { align-self: center; font-size: 18px; background: rgba(0, 0, 0, .3); }
  .buzzbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-size: 14px; }
  .buzzbar .state { padding: .3em .8em; border-radius: 999px; background: rgba(0, 0, 0, .3); }
  .buzzbar .state.open { background: rgba(47, 191, 113, .3); }
  .judge { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .jrow { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, .3); padding: 6px 6px 6px 12px; border-radius: 10px; border: 2px solid transparent; }
  .jrow.first { border-color: var(--accent); background: rgba(0, 0, 0, .5); animation: pulse 1s ease-in-out 2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 168, 216, .35); } }
  .jrow.wrong { opacity: .45; }
  .jrow .who { font-weight: 700; margin-right: 4px; }
  .jrow .pos { font-family: var(--display); color: var(--accent); min-width: 1.2em; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; }
  button.no { background: var(--no); border-color: transparent; color: #fff; }
  button.ok.on, button.no.on { outline: 3px solid #fff; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .actions button { background: rgba(0, 0, 0, .3); }
  .actions button.primary { background: var(--accent); }
  .dd-title { font-family: var(--display); color: var(--accent); font-size: clamp(44px, 9vw, 120px); line-height: 1; text-shadow: 4px 4px 0 #000; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-12deg); } }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: rgba(0, 0, 0, .3); }
  .chip.on { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .chip small { opacity: .75; margin-left: 4px; }
  .wager { max-width: 220px; align-self: center; font-size: 22px; text-align: center; }
  .err { color: #ffb3b5; min-height: 1.2em; font-weight: 600; }
  .label { margin: 0; color: #ddd0fa; }

  /* Final */
  .final-view { min-height: 100vh; background: var(--board); display: flex; flex-direction: column; }
  .final-view .top { background: rgba(0, 0, 0, .3); }
  .final-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .final-cat { font-family: var(--display); font-size: clamp(28px, 5vw, 64px); text-transform: uppercase; text-shadow: 3px 3px 0 #000; }
  .wtable { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; text-align: left; }
  .wrow { display: grid; grid-template-columns: 1fr auto 150px; gap: 10px; align-items: center; background: rgba(0, 0, 0, .3); padding: 8px 12px; border-radius: 10px; }
  .wrow.judge-row { grid-template-columns: 1fr auto auto auto; }
  .timer { height: 10px; background: rgba(0, 0, 0, .4); border-radius: 5px; overflow: hidden; width: min(600px, 100%); align-self: center; }
  .timer div { height: 100%; background: var(--accent); animation-name: drain; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes drain { from { width: 100%; } to { width: 0; } }
  .podium { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); align-self: center; }
  .prow-r { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, .3); padding: 12px 16px; border-radius: 10px; font-size: 20px; }
  .prow-r.win { background: var(--accent); color: #1f0d3f; font-weight: 700; }
  .prow-r .s { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }

  /* Player */
  .pview { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; background: #0a0515; }
  .pview .top { background: var(--bg); }
  .you-chip { font-weight: 700; background: var(--board-dk); padding: .3em .8em; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pmain { display: flex; flex-direction: column; min-height: 0; }
  .pmain .board { flex: 1; min-height: 320px; }
  .clue-stage { flex: 1; background: var(--board); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; animation: zoom .28s ease-out; }
  .clue-stage .clue-text { font-size: clamp(20px, 4vw, 52px); }
  .queue-line { font-weight: 700; color: #fff; min-height: 1.5em; }
  .queue-line b { color: var(--accent); }
  .wager-form { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(420px, 100%); align-self: center; }
  .wager-form .wager { max-width: 260px; }
  .wager-form button { width: 100%; }
  .locked { font-size: 12px; font-weight: 700; color: #8ff0bd; background: rgba(47, 191, 113, .18); border-radius: 999px; padding: .1em .6em; margin-left: 6px; white-space: nowrap; }
  .player-join { max-width: 420px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 12px; }
  .player-join input { font-size: 20px; padding: .6em .8em; }
  button.big { font-size: 20px; padding: .7em 1em; }
  .buzz-wrap { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; justify-content: center; border-top: 1px solid var(--line); }
  .buzzer {
    width: min(460px, 100%); height: clamp(72px, 14vh, 120px); border-radius: 999px; border: 0;
    font-family: var(--display); font-size: clamp(24px, 6vw, 46px); letter-spacing: .06em;
    background: #2a1d4d; color: #a797cc; transition: transform .06s, box-shadow .06s;
  }
  .buzzer:disabled { opacity: 1; }
  .buzzer.live { background: radial-gradient(circle at 50% 30%, #ff6a6f, #c4161c 70%); color: #fff; box-shadow: 0 7px 0 #6d0a0e, 0 0 36px rgba(255, 60, 60, .45); cursor: pointer; }
  .buzzer.live:active { transform: translateY(5px); box-shadow: 0 2px 0 #6d0a0e; }
  .buzzer.up { background: var(--accent); color: #1f0d3f; animation: pulse 1s ease-in-out infinite; }
  .buzzer.queued { background: #7b5cf0; color: #fff; }
  .buzzer.out { background: #3a1d24; color: #ff9a9d; }

  /* Dialog + toast */
  #dialog { position: fixed; inset: 0; z-index: 30; background: rgba(8, 3, 20, .75); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .dlg p { margin: 0; font-size: 16px; }
  .dlg .actions { justify-content: flex-end; }
  .dlg .actions button { background: var(--panel2); }
  .dlg .actions button.primary { background: var(--accent); }
  .dlg .actions button.dangerbtn { background: var(--no); }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: #0a0515; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; max-width: calc(100% - 32px); }

  @media (max-width: 600px) {
    .board { gap: 3px; padding: 4px; }
    .board .cat { border-bottom-width: 2px; padding: 3px; }
    .wrow { grid-template-columns: 1fr 110px; }
    .wrow .sc { display: none; }
    .top .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>

<div id="app"></div>
<div id="overlay" hidden></div>
<div id="dialog" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = n => (n < 0 ? '-' : '') + '$' + Math.abs(+n || 0).toLocaleString();
const clone = o => JSON.parse(JSON.stringify(o));

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const use = name => (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

// ---------- Platform state ----------
let db = null, room = null, downloadsCap = null;
let role = null;          // null (connecting) | 'host' | 'player'
let canEdit = false;
let shared = false;       // host data lives in the shared db (vs. this browser only)
let gamesReady = false;
let peersList = [];       // host: players connected on their own devices [{pid,name,buzz}]
let watchers = 0;         // host: "just watch" screens
let live = null;          // player: the host's published state
let beepTimer = null;

// Player identity (per browser)
const me = {
  pid: lsGet('jeoparty.pid', null) || uid(),
  name: lsGet('jeoparty.name', ''),
  watch: lsGet('jeoparty.watch', false),
  joined: false, buzzToken: null, err: '',
  fwDraft: '', fwErr: '', fwSent: null, fwBusy: false,
};
let needsRender = false; // a render skipped so it wouldn't steal focus from a field being typed in
lsSet('jeoparty.pid', me.pid);

// ---------- Model ----------
const blankClue = () => ({ q: '', a: '', dd: false });
const newCat = rows => ({ name: '', clues: Array.from({ length: rows }, blankClue) });
function newRound(name, mult = 1) {
  const values = [200, 400, 600, 800, 1000].map(v => v * mult);
  return { name, values, categories: Array.from({ length: 5 }, () => newCat(values.length)) };
}
function blankGame() {
  return { id: uid(), created: Date.now(), title: 'Untitled game', rounds: [newRound('2MixParty!')], final: { enabled: true, category: '', q: '', a: '' } };
}
function normalize(g, id) {
  g = g && typeof g === 'object' ? g : {};
  const out = { id: id || uid(), created: +g.created || Date.now(), title: String(g.title ?? 'Imported game') };
  const rounds = Array.isArray(g.rounds) && g.rounds.length ? g.rounds : [newRound('2MixParty!')];
  out.rounds = rounds.map((R, ri) => {
    const values = Array.isArray(R?.values) && R.values.length ? R.values.map(v => parseInt(v) || 0) : [200, 400, 600, 800, 1000];
    const categories = (Array.isArray(R?.categories) ? R.categories : []).map(C => {
      const clues = Array.isArray(C?.clues) ? C.clues.slice(0, values.length) : [];
      while (clues.length < values.length) clues.push(blankClue());
      return { name: String(C?.name ?? ''), clues: clues.map(x => ({ q: String(x?.q ?? ''), a: String(x?.a ?? ''), dd: !!x?.dd })) };
    });
    return { name: String(R?.name ?? `Round ${ri + 1}`), values, categories };
  });
  const f = g.final || {};
  out.final = { enabled: f.enabled ?? true, category: String(f.category ?? ''), q: String(f.q ?? ''), a: String(f.a ?? '') };
  return out;
}

let games = [];
let play = null;
let view = { name: 'home' };

const gameById = id => games.find(g => g.id === id);
const editGame = () => gameById(view.gameId);
const playGame = () => play && gameById(play.gameId);
const player = id => play?.players.find(p => p.id === id);
const filled = clue => clue.q.trim() !== '';
const sortGames = () => games.sort((a, b) => (a.created || 0) - (b.created || 0));

function setPath(obj, path, val) {
  const k = path.split('.');
  let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}

// ---------- Persistence ----------
// One write at a time per document; a write requested mid-flight runs once more with the latest state.
function makeWriter(fn) {
  let busy = false, again = false;
  return async function run() {
    if (busy) { again = true; return; }
    busy = true;
    do {
      again = false;
      try { await fn(); } catch (e) { console.warn('save failed', e); toast("Couldn't save your last change. Check your connection."); }
    } while (again);
    busy = false;
  };
}
const gameTimers = {}, gameWriters = {}, pendingGames = new Set();
function touch(g) {
  if (!shared) { lsSet('jeoparty.games', games); return; }
  pendingGames.add(g.id);
  clearTimeout(gameTimers[g.id]);
  gameTimers[g.id] = setTimeout(() => {
    gameTimers[g.id] = null;
    const id = g.id;
    gameWriters[id] ||= makeWriter(async () => {
      const cur = gameById(id);
      if (cur) { const { id: _, ...data } = cur; await db.collection('games').doc(id).set(clone(data)); }
      if (!gameTimers[id]) pendingGames.delete(id);
    });
    gameWriters[id]();
  }, 500);
}
async function removeGame(id) {
  games = games.filter(g => g.id !== id);
  if (!shared) { lsSet('jeoparty.games', games); return; }
  clearTimeout(gameTimers[id]); pendingGames.delete(id);
  try { await db.collection('games').doc(id).delete(); } catch { toast("Couldn't delete that game. Try again."); }
}
const playWriter = makeWriter(() => play ? db.doc('host/play').set(clone(play)) : db.doc('host/play').delete());
function savePlay() {
  if (shared) playWriter(); else lsSet('jeoparty.play', play);
}
let liveJson = '', liveDoc = null;
const liveWriter = makeWriter(() => db.doc('live/state').set(liveDoc));
function publishLive() {
  if (!shared || role !== 'host') return;
  const L = buildLive();
  const s = JSON.stringify(L);
  if (s === liveJson) return;
  liveJson = s; liveDoc = L;
  liveWriter();
}

// What players are allowed to see: no correct responses until revealed, no unrevealed clue text.
function buildLive() {
  const g = playGame();
  if (!g) return { phase: 'idle' };
  const base = { title: g.title, players: play.players.map(({ id, name, score }) => ({ id, name, score })) };
  if (play.final) {
    const f = g.final, F = play.final;
    return { ...base, phase: 'final', final: {
      stage: F.stage, category: f.category,
      q: ['clue', 'reveal'].includes(F.stage) ? f.q : null,
      a: F.stage === 'reveal' ? f.a : null,
      timerEnd: F.stage === 'clue' ? (F.timerEnd || null) : null,
      pub: F.stage === 'wager' ? (F.pub || null) : null,
      token: F.stage === 'wager' ? (F.token || null) : null,
      locked: F.stage === 'wager' ? Object.keys(F.submitted || {}) : [],
    } };
  }
  const r = play.round, R = g.rounds[r];
  const out = { ...base, phase: 'board', round: roundInfo(g, r) };
  const cl = play.clue;
  if (cl) {
    const clue = R.categories[cl.c].clues[cl.i];
    const showQ = cl.stage === 'clue';
    out.clue = {
      token: cl.token, stage: cl.stage, cat: R.categories[cl.c].name, value: R.values[cl.i],
      dd: !!clue.dd, ddName: cl.ddPlayer ? (player(cl.ddPlayer)?.name || '') : '',
      wager: showQ && cl.ddPlayer ? cl.wager : null,
      q: showQ ? clue.q : null, a: cl.revealed ? clue.a : null, revealed: !!cl.revealed,
      open: !!cl.open, queue: cl.queue, lockout: cl.wrong,
    };
  }
  return out;
}
function roundInfo(g, r) {
  const R = g.rounds[r];
  return {
    name: R.name, cats: R.categories.map(C => C.name), values: R.values,
    open: R.categories.map((C, c) => C.clues.map((cl, i) => filled(cl) && !play.used[`${r}-${c}-${i}`] ? 1 : 0)),
  };
}

function adjust(pid, delta) {
  const p = player(pid);
  if (!p || !delta) return;
  p.score += delta;
  play.log.push({ pid, delta });
  if (play.log.length > 200) play.log.shift();
  savePlay();
}
function roundComplete() {
  const info = roundInfo(playGame(), play.round);
  return info.cats.length > 0 && info.open.every(col => col.every(v => !v));
}
function newPlay(gameId, players) {
  return { gameId, players, round: 0, used: {}, log: [], clue: null, final: null };
}
// Final wagers travel through room presence, which every viewer can read, so devices
// encrypt them with a key pair the host makes per game; only the host holds the private half.
const ALG = { name: 'RSA-OAEP', hash: 'SHA-256' };
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let wagerKey = null;
const wagerSeen = new Map();
async function makeWagerKeys() {
  const kp = await crypto.subtle.generateKey({ ...ALG, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ['encrypt', 'decrypt']);
  return { pub: b64(await crypto.subtle.exportKey('spki', kp.publicKey)), priv: await crypto.subtle.exportKey('jwk', kp.privateKey), key: kp.privateKey };
}
async function getWagerKey(F) {
  if (wagerKey?.token === F.token) return wagerKey.key;
  try {
    const key = await crypto.subtle.importKey('jwk', F.priv, ALG, false, ['decrypt']);
    wagerKey = { token: F.token, key };
    return key;
  } catch { return null; }
}
async function processWagers() {
  const F = play?.final;
  if (!room || !F || F.stage !== 'wager' || !F.token || !F.priv) return;
  const key = await getWagerKey(F);
  if (!key) return;
  let changed = false;
  for (const p of room.peers()) {
    const pr = p.presence || {};
    if (pr.role !== 'player' || pr.fwt !== F.token || typeof pr.fw !== 'string' || typeof pr.pid !== 'string') continue;
    const pid = pr.pid.slice(0, 40);
    if (wagerSeen.get(pid) === pr.fw) continue;
    wagerSeen.set(pid, pr.fw);
    const pl = player(pid);
    if (!pl || pl.score <= 0) continue;
    try {
      const { t, w } = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt(ALG, key, unb64(pr.fw))));
      const n = parseInt(w);
      if (t !== F.token || isNaN(n) || n < 0 || n > pl.score) continue;
      if (play?.final !== F || F.stage !== 'wager') return;
      F.wagers[pid] = n; F.submitted[pid] = true; changed = true;
    } catch {}
  }
  if (changed) { savePlay(); if (typingInApp()) { needsRender = true; publishLive(); } else render(); }
}

// ---------- Sound ----------
// One shared AudioContext, unlocked by the viewer's first click (browsers block sound before that).
let audioCtx = null;
let muted = lsGet('jeoparty.muted', false);
function audio() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch { return null; }
}
function tone(freq, dur, { type = 'sine', gain = .25, when = 0, slide = null } = {}) {
  const a = !muted && audio();
  if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  o.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.start(t); o.stop(t + dur + .02);
}
function beep(freq = 523, dur = 1.2) { tone(freq, dur); }
// Game-show buzzer: a bright two-note "ding-ding" for the first buzz, a single softer blip for anyone after.
function buzzSound(first = true) {
  if (first) {
    tone(1046, .35, { type: 'triangle', gain: .3 });
    tone(1318, .5, { type: 'triangle', gain: .3, when: .12 });
    tone(523, .3, { type: 'square', gain: .05 });
  } else {
    tone(784, .25, { type: 'triangle', gain: .18 });
  }
}
function soundButton() {
  return `<button class="ghost" data-act="toggle-sound" title="${muted ? 'Turn sound on' : 'Turn sound off'}" aria-pressed="${!muted}">${muted ? 'Sound off' : 'Sound on'}</button>`;
}

// ---------- Dialog + toast (the viewer blocks alert/confirm/prompt) ----------
function ask(message, { ok = 'OK', cancel = 'Cancel', input = null, danger = false } = {}) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(message)}">
      <p>${esc(message)}</p>
      ${input !== null ? `<input id="dlg-input" value="${esc(input)}">` : ''}
      <div class="actions">${cancel ? `<button data-dlg="0">${esc(cancel)}</button>` : ''}<button class="${danger ? 'dangerbtn' : 'primary'}" data-dlg="1">${esc(ok)}</button></div></div>`;
    d.hidden = false;
    const inp = d.querySelector('input');
    (inp || d.querySelector('[data-dlg="1"]')).focus();
    if (inp) inp.select();
    const done = yes => { d.hidden = true; d.innerHTML = ''; d.onclick = d.onkeydown = null; resolve(inp ? (yes ? inp.value : null) : yes); };
    d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg === '1'); else if (e.target === d) done(false); };
    d.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') done(false); e.stopPropagation(); };
  });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

// ---------- Rendering ----------
function render() {
  const app = $('#app');
  if (role === null) app.innerHTML = `<div class="wait"><h1 class="logo big">2MixParty!</h1><p class="muted">Connecting…</p></div>`;
  else if (role === 'player') app.innerHTML = renderPlayer();
  else if (!gamesReady) app.innerHTML = `<div class="wait"><h1 class="logo big">2MixParty!</h1><p class="muted">Loading your games…</p></div>`;
  else if (view.name === 'home') app.innerHTML = renderHome();
  else if (view.name === 'edit') app.innerHTML = editGame() ? renderEditor() : renderHome();
  else if (view.name === 'setup') app.innerHTML = renderSetup();
  else if (view.name === 'board') app.innerHTML = playGame() ? renderBoard() : renderHome();
  else if (view.name === 'final') app.innerHTML = playGame() && play.final ? renderFinal() : renderHome();
  renderOverlay();
  publishLive();
}

function connectedChip() {
  if (!shared) return '';
  if (!room) return `<span class="chip-live off" title="Buzzers are unavailable in this view">Buzzers offline</span>`;
  const n = peersList.length;
  return `<span class="chip-live ${n ? '' : 'off'}">${n} player${n === 1 ? '' : 's'} on devices${watchers ? ` · ${watchers} watching` : ''}</span>`;
}

function gameStats(g) {
  let n = 0, total = 0;
  g.rounds.forEach(R => R.categories.forEach(C => C.clues.forEach(cl => { total++; if (filled(cl)) n++; })));
  return `${g.rounds.length} round${g.rounds.length > 1 ? 's' : ''} · ${n}/${total} clues${g.final.enabled ? ' · Final' : ''}`;
}

  let cells = info.cats.map(n => `<div class="cat">${esc(n)}</div>`).join('');
  info.values.forEach((v, i) => info.cats.forEach((_, c) => {
    const on = info.open[c]?.[i];
    cells += interactive
      ? `<button class="cell" data-act="open" data-c="${c}" data-i="${i}" ${on ? '' : 'disabled aria-label="used"'}>${on ? fmt(v) : ''}</button>`
      : `<div class="cell">${on ? fmt(v) : ''}</div>`;
  }));
  return cells;
}

function renderOverlay() {
  const ov = $('#overlay');
  const vc = role === 'host' && view.name === 'board' && playGame() ? play.clue : null;
  if (!vc) { ov.hidden = true; ov.innerHTML = ''; return; }
  const wasHidden = ov.hidden;
  ov.hidden = false;
  if (wasHidden) { ov.style.animation = 'none'; void ov.offsetHeight; ov.style.animation = ''; }
  const g = playGame(), R = g.rounds[vc.r], C = R.categories[vc.c], clue = C.clues[vc.i], value = R.values[vc.i];

  if (vc.stage === 'dd') {
    const p = vc.ddPlayer && player(vc.ddPlayer);
    const maxW = p ? Math.max(p.score, Math.max(...R.values)) : 0;
    ov.innerHTML = `<div class="clue-card">
      <div class="dd-title">DAILY DOUBLE!</div>

    </div>`;
    const w = ov.querySelector('.wager');
    if (w) { w.focus(); const n = w.value.length; try { w.setSelectionRange(n, n); } catch {} }
    return;
  }

  const dd = !!vc.ddPlayer, worth = dd ? vc.wager : value;
  const judges = dd ? [player(vc.ddPlayer)].filter(Boolean)
    : [...vc.queue.map(player).filter(Boolean), ...play.players.filter(p => !vc.queue.includes(p.id))];
  const buzzers = shared && room && !dd;
  ov.innerHTML = `<div class="clue-card">
    <div class="clue-meta"><span>${esc(C.name)}</span><span>${dd ? `Daily Double · ${esc(player(vc.ddPlayer)?.name)} wagers ${fmt(worth)}` : fmt(value)}</span></div>
    <div class="clue-text">${esc(clue.q)}</div>
    ${vc.revealed ? `<div class="answer"><span class="tag">Correct response</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`
      : `<div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${clue.a.trim() ? esc(clue.a) : '<em>(none entered)</em>'}</div>`}
    ${buzzers ? `<div class="buzzbar">
      <span class="state ${vc.open ? 'open' : ''}">Buzzers ${vc.open ? 'open' : 'closed'}</span>
      <button data-act="toggle-buzz">${vc.open ? 'Close buzzers' : 'Open buzzers'}</button>
      <button data-act="reset-buzz" ${vc.queue.length ? '' : 'disabled'}>Clear buzz queue</button></div>` : ''}
    <div class="judge">${judges.map(p => { const w = vc.wrong.includes(p.id), qi = vc.queue.indexOf(p.id); return `
      <div class="jrow ${w ? 'wrong' : ''} ${qi === 0 && !w ? 'first' : ''}">${qi >= 0 ? `<span class="pos">${qi + 1}</span>` : ''}<span class="who">${esc(p.name)}</span>
        <button class="ok" data-act="right" data-p="${p.id}" ${w ? 'disabled' : ''} title="Correct">✓ ${fmt(worth)}</button>
        <button class="no" data-act="wrong" data-p="${p.id}" ${w ? 'disabled' : ''} title="Incorrect">✗ ${fmt(-worth)}</button></div>`; }).join('')}
    </div>
    <div class="actions">
      ${vc.revealed ? '' : `<button data-act="reveal">Show response to players<kbd>Space</kbd></button>`}
      ${dd ? '' : `<button data-act="clue-cancel">Back to board<kbd>Esc</kbd></button>`}
      ${dd ? '' : `<button class="primary" data-act="clue-done">No one got it · close</button>`}
    </div>
  </div>`;
}

function timerBar(end, total = 30000) {
  const left = end ? end - Date.now() : 0;
  if (left <= 0) return end ? `<div class="timer"><div style="width:0"></div></div>` : '';
  return `<div class="timer"><div style="animation-duration:${total}ms;animation-delay:-${Math.max(0, total - left)}ms"></div></div>`;
}
function podium(players) {
  const ranked = [...players].sort((a, b) => b.score - a.score);
  const top = ranked[0]?.score;
  const tie = ranked.filter(p => p.score === top).length > 1;
  return `<div class="dd-title" style="font-size:clamp(34px,6vw,80px)">${!ranked.length ? 'Game over' : tie ? "It's a tie!" : `${esc(ranked[0].name)} wins!`}</div>
    <div class="podium">${ranked.map(p => `<div class="prow-r ${p.score === top ? 'win' : ''}"><span>${p.score === top ? '👑 ' : ''}${esc(p.name)}</span><span class="s">${fmt(p.score)}</span></div>`).join('')}</div>`;
}

function renderFinal() {
  const g = playGame(), f = g.final, F = play.final;
  const head = `<header class="top">
      ${F.applied ? `<button class="ghost" data-act="home">☰ Games</button>` : `<button class="ghost" data-act="back-board">← Board</button>`}
      <span class="round-name">${F.stage === 'results' ? 'Final Scores' : 'Final 2MixParty!'}</span>
      <span class="spacer"></span>${connectedChip()}${soundButton()}<button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button></header>`;
  let body = '';
  const eligible = p => p.score > 0;

  if (F.stage === 'category') {
    body = `<div class="clue-card">
      <div class="dd-title" style="font-size:clamp(36px,7vw,90px)">Final 2MixParty!</div>
      <p class="label">The category is…</p>
      <div class="final-cat">${esc(f.category) || '—'}</div>
      <div class="actions"><button class="primary" data-act="f-wagers">Enter wagers →</button></div></div>`;
  } else if (F.stage === 'wager') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <p class="label">Players with a positive score may wager up to their total. ${F.pub ? 'Players lock in wagers on their devices, and only you see the amounts. You can also type or change a wager here.' : 'Collect wagers privately and enter them here.'}</p>
      <div class="wtable">${play.players.map(p => `<div class="wrow"><span><strong>${esc(p.name)}</strong>${F.submitted?.[p.id] ? ' <span class="locked">locked in</span>' : ''}</span><span class="sc muted">${fmt(p.score)}</span>
        ${eligible(p) ? `<input id="fw-${p.id}" type="number" min="0" max="${p.score}" data-fwager="${p.id}" value="${esc(F.wagers[p.id] ?? '')}" placeholder="Wager" aria-label="${esc(p.name)} wager">` : `<span class="muted">Not eligible</span>`}</div>`).join('')}
      </div>
      <div class="err">${esc(F.err || '')}</div>
      <div class="actions"><button class="primary" data-act="f-clue">Show clue →</button></div></div>`;
  } else if (F.stage === 'clue') {
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text">${esc(f.q)}</div>
      ${timerBar(F.timerEnd)}
      <div class="answer" style="opacity:.8"><span class="tag">Correct response · only you can see this</span>${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="actions">
        <button data-act="f-timer">${F.timerEnd ? 'Restart' : 'Start'} 30s timer</button>
        <button class="primary" data-act="f-reveal">Reveal response<kbd>Space</kbd></button>
      </div></div>`;
  } else if (F.stage === 'reveal') {
    const players = play.players.filter(eligible);
    const allJudged = players.every(p => p.id in F.results);
    body = `<div class="clue-card">
      <div class="clue-meta center">${esc(f.category)}</div>
      <div class="clue-text" style="font-size:clamp(18px,2.6vw,34px)">${esc(f.q)}</div>
      <div class="answer">${esc(f.a) || '<em>(none entered)</em>'}</div>
      <div class="wtable">${players.length ? players.map(p => { const res = F.results[p.id]; return `<div class="wrow judge-row">
        <strong>${esc(p.name)}</strong><span class="muted">wagered ${fmt(F.wagers[p.id] || 0)}</span>
        <button class="ok ${res === true ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="1" aria-label="Correct">✓</button>
        <button class="no ${res === false ? 'on' : ''}" data-act="f-judge" data-p="${p.id}" data-v="0" aria-label="Incorrect">✗</button></div>`; }).join('')
        : `<p class="label" style="text-align:center">No players were eligible for Final 2MixParty.</p>`}
      </div>
      <div class="actions"><button class="primary" data-act="f-apply" ${allJudged ? '' : 'disabled'}>Final scores →</button></div></div>`;
  } else {
    body = `<div class="clue-card">${podium(play.players)}
      <div class="actions"><button data-act="home">Back to games</button><button class="primary" data-act="rematch">Play again ↻</button></div></div>`;
  }
  return `<div class="final-view">${head}<main class="final-body">${body}</main></div>`;
}

// ---------- Player view ----------
function buzzState() {
  const c = live?.phase === 'board' ? live.clue : null;
  if (!room) return { label: 'Buzzer offline', cls: '', off: true };
  if (!c) return { label: 'Wait for a clue', cls: '', off: true };
  if (c.dd) return { label: 'Daily Double', cls: '', off: true };
  if (c.stage !== 'clue') return { label: 'Get ready…', cls: '', off: true };
  if (!live.players.some(p => p.id === me.pid)) return { label: 'Joining…', cls: '', off: true };
  if (c.lockout.includes(me.pid)) return { label: 'Locked out', cls: 'out', off: true };
  const pos = c.queue.indexOf(me.pid);
  if (pos === 0) return { label: "You're up! Answer", cls: 'up', off: true };
  if (pos > 0) return { label: `Buzzed · #${pos + 1} in line`, cls: 'queued', off: true };
  if (me.buzzToken === c.token) return { label: 'Buzzed!', cls: 'queued', off: true };
  if (!c.open) return { label: c.revealed ? 'Clue over' : 'Buzzers closed', cls: '', off: true };
  return { label: 'BUZZ', cls: 'live', off: false };
}

function renderPlayer() {
  if (!me.joined) {
    return `<div class="player-join">
      <h1 class="logo big">2MixParty!</h1>
      <p class="muted" style="text-align:center">${live?.title ? `Now playing: <strong>${esc(live.title)}</strong>` : 'Join the game from this device.'}</p>
      <label for="join-name" class="label">Your name</label>
      <input id="join-name" maxlength="24" value="${esc(me.name)}" placeholder="e.g. Alex" autocomplete="off">
      <div class="err">${esc(me.err)}</div>
      <button class="primary big" data-act="p-join">Join as a player</button>
      <button class="ghost" data-act="p-watch">Just watch (TV screen)</button>
      ${!room ? `<p class="hint">Buzzers aren't available in this view. You can still watch the board.</p>` : ''}
      ${canEdit ? `<button class="ghost" data-act="to-host">← Back to host controls</button>` : ''}
    </div>`;
  }
  const L = live, you = L?.players?.find(p => p.id === me.pid);
  let main;
  if (!L || L.phase === 'idle' || !L.players) {
    main = `<div class="wait"><p class="round-name">Waiting for the host…</p><p class="muted">The board appears here as soon as the game starts.</p></div>`;
  } else if (L.phase === 'final') {
    main = playerFinal(L);
  } else if (L.clue) {
    const c = L.clue, name = id => esc(L.players.find(p => p.id === id)?.name || 'Someone');
    main = c.stage === 'dd'
      ? `<div class="clue-stage"><div class="dd-title">DAILY DOUBLE!</div><div class="clue-meta center">${esc(c.cat)}</div>
          <p class="label">${c.ddName ? `${esc(c.ddName)} is making a wager…` : 'Who found it?'}</p></div>`
      : `<div class="clue-stage">
          <div class="clue-meta"><span>${esc(c.cat)}</span><span>${c.dd ? `Daily Double · ${esc(c.ddName)} · ${fmt(c.wager)}` : fmt(c.value)}</span></div>
          <div class="clue-text">${esc(c.q)}</div>
          ${c.revealed ? `<div class="answer">${esc(c.a || '')}</div>` : ''}
          <div class="queue-line">${!c.dd && c.queue.length ? `<b>${name(c.queue[0])}</b> buzzed in first${c.queue.length > 1 ? ` · then ${c.queue.slice(1).map(name).join(', ')}` : ''}` : ''}</div>
        </div>`;
  } else {
    main = `<div class="board" style="--cols:${Math.max(L.round.cats.length, 1)}">${boardCells(L.round, false)}</div>`;
  }
  const b = buzzState();
  return `<div class="pview">
    <header class="top">
      <span class="logo sm">2MixParty!</span>
      ${L?.round && L.phase === 'board' ? `<span class="muted hide-sm">${esc(L.round.name)}</span>` : ''}
      <span class="spacer"></span>
      <span class="you-chip">${me.watch ? 'Watching' : `${esc(me.name)}${you ? ` · ${fmt(you.score)}` : ''}`}</span>
      <button class="ghost" data-act="p-leave">${me.watch ? 'Join' : 'Rename'}</button>
      ${canEdit ? `<button class="ghost" data-act="to-host">Host view</button>` : ''}
      ${soundButton()}
      <button class="ghost" data-act="fullscreen" title="Fullscreen">⛶</button>
    </header>
    <main class="pmain">${main}</main>
    ${L?.players?.length ? scoresBar(L.players, { you: me.watch ? null : me.pid }) : '<div></div>'}
    ${me.watch ? '' : `<div class="buzz-wrap"><button class="buzzer ${b.cls}" data-act="buzz" ${b.off ? 'disabled' : ''}>${esc(b.label)}</button></div>`}
  </div>`;
}

function playerFinal(L) {
  const F = L.final;
  let inner;
  if (F.stage === 'results') inner = podium(L.players);
  else if (F.stage === 'category' || F.stage === 'wager') inner = `<div class="dd-title" style="font-size:clamp(36px,8vw,90px)">Final 2MixParty!</div>
      <p class="label">The category is</p><div class="final-cat">${esc(F.category)}</div>
      ${F.stage === 'wager' ? playerWager(L, F) : ''}`;
  else inner = `<div class="clue-meta center">${esc(F.category)}</div><div class="clue-text">${esc(F.q)}</div>
      ${F.stage === 'clue' ? timerBar(F.timerEnd) : `<div class="answer">${esc(F.a || '')}</div>`}`;
  return `<div class="clue-stage">${inner}</div>`;
}

function playerWager(L, F) {
  const you = L.players.find(p => p.id === me.pid);
  if (me.watch || !you) return `<p class="label">Players are locking in their wagers…</p>`;
  if (you.score <= 0) return `<p class="label">You need a positive score to wager in Final 2MixParty. Sit tight and enjoy the clue.</p>`;
  if (!F.pub || !room) return `<p class="label">Tell the host your wager privately. You can bet up to ${fmt(you.score)}.</p>`;
  const locked = F.locked.includes(me.pid) && me.fwSent?.token === F.token;
  return `<div class="wager-form">
      <label class="label" for="fw-input">Your wager ($0 to ${fmt(you.score)})</label>
      <input id="fw-input" type="number" inputmode="numeric" class="wager" min="0" max="${you.score}" value="${esc(me.fwDraft)}" placeholder="0">
      <div class="err">${esc(me.fwErr)}</div>
      <button class="primary big" data-act="p-wager" ${me.fwBusy ? 'disabled' : ''}>${locked ? 'Change wager' : 'Lock in wager'}</button>
      <p class="label">${locked ? `Locked in: <strong>${fmt(me.fwSent.w)}</strong>. You can change it until the host shows the clue.`
        : me.fwSent?.token === F.token ? 'Sending…' : 'Only the host sees your wager.'}</p>
    </div>`;
}

// ---------- Actions ----------
function goFinal() {
  const f = playGame().final;
  play.clue = null;
  play.final = f.enabled && f.q.trim() ? { stage: 'category', wagers: {}, results: {}, applied: false, timerEnd: null } : { stage: 'results', applied: true };
  savePlay();
  view = { name: 'final' };
  render();
}
function markUsed() {
  const { r, c, i } = play.clue;
  play.used[`${r}-${c}-${i}`] = true;
  play.clue = null;
  savePlay();
  render();
}
function clueWorth() {
  const vc = play.clue;
  return vc.ddPlayer ? vc.wager : playGame().rounds[vc.r].values[vc.i];
}
async function exportGame(g) {
  const { id, ...data } = g;
  const name = `${(g.title || 'game').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'game'}.json`;
  const text = JSON.stringify(data, null, 2);
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data: text }); }
    catch (e) { if (e?.code !== 'declined') toast("Couldn't export that game here."); }
    return;
  }
  if (shared) { toast('Exporting isn’t available in this view.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function remotePlayers() { return peersList.map(p => ({ id: p.pid, name: p.name, score: 0 })); }

function joinPresence() {
  if (!room) return;
  room.presence({ role: me.watch ? 'watch' : 'player', pid: me.pid, name: me.watch ? null : me.name, buzz: null }).catch(() => {});
}

const actions = {
  home() { view = { name: 'home' }; render(); },
  fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => toast('Fullscreen isn’t available here.'));
  },
  new() { const g = blankGame(); games.push(g); touch(g); view = { name: 'edit', gameId: g.id }; render(); },
  edit(d) { view = { name: 'edit', gameId: d.id }; render(); },
  dup(d) {
    const g = clone(gameById(d.id));
    g.id = uid(); g.title += ' (copy)'; g.created = Date.now();
    games.push(g); touch(g); render();
  },
  async del(d) {
    const g = gameById(d.id);
    if (!await ask(`Delete "${g.title}"? This can't be undone.`, { ok: 'Delete', danger: true })) return;
    if (play?.gameId === d.id) { play = null; savePlay(); }
    await removeGame(d.id); render();
  },
  export(d) { exportGame(gameById(d.id)); },
  import() { $('#file').value = ''; $('#file').click(); },
  resume() { view = { name: play.final ? 'final' : 'board' }; render(); },
  async abandon() {
    if (!await ask('End the game in progress? Scores will be cleared.', { ok: 'End game', danger: true })) return;
    play = null; savePlay(); render();
  },
  'to-player'() {
    role = 'player';
    startPlayer();
    render();
  },
  'to-host'() {
    role = 'host'; me.joined = false;
    room?.presence({ role: 'host', pid: null, name: null, buzz: null }).catch(() => {});
    render();
  },

  // Editor
  'add-cat'(d) { const g = editGame(), R = g.rounds[+d.r]; R.categories.push(newCat(R.values.length)); touch(g); render(); },
  async 'del-cat'(d) {
    const g = editGame(), R = g.rounds[+d.r], C = R.categories[+d.c];
    if ((C.name || C.clues.some(filled)) && !await ask(`Remove category "${C.name || 'untitled'}" and its clues?`, { ok: 'Remove', danger: true })) return;
    R.categories.splice(+d.c, 1); touch(g); render();
  },
  'add-row'(d) {
    const g = editGame(), R = g.rounds[+d.r], v = R.values;
    v.push(v.length ? v[v.length - 1] + (v.length > 1 ? v[v.length - 1] - v[v.length - 2] : v[0]) : 200);
    R.categories.forEach(C => C.clues.push(blankClue()));
    touch(g); render();
  },
  async 'del-row'(d) {
    const g = editGame(), R = g.rounds[+d.r], i = +d.i;
    if (R.categories.some(C => filled(C.clues[i])) && !await ask(`Remove the ${fmt(R.values[i])} row and its clues?`, { ok: 'Remove', danger: true })) return;
    R.values.splice(i, 1); R.categories.forEach(C => C.clues.splice(i, 1));
    touch(g); render();
  },
  'add-round'() {
    const g = editGame(), n = g.rounds.length + 1;
    g.rounds.push(newRound(n === 2 ? 'Double 2MixParty!' : `Round ${n}`, n));
    touch(g); render();
  },
  async 'del-round'(d) {
    const g = editGame();
    if (!await ask(`Delete round "${g.rounds[+d.r].name}" and all its clues?`, { ok: 'Delete', danger: true })) return;
    g.rounds.splice(+d.r, 1); touch(g); render();
  },

  // Setup
  setup(d) {
    const remoteIds = new Set(peersList.map(p => p.pid));
    const prev = play && play.gameId === d.id ? play.players.filter(p => !remoteIds.has(p.id) && !p.remote).map(p => p.name) : null;
    view = { name: 'setup', gameId: d.id, players: prev || (shared && room ? [] : ['Player 1', 'Player 2', 'Player 3']) };
    render();
  },
  'add-player'() { view.players.push(`Player ${view.players.length + 1}`); render(); },
  'del-player'(d) { view.players.splice(+d.i, 1); render(); },
  async start() {
    const local = view.players.map(s => s.trim()).filter(Boolean).map(name => ({ id: uid(), name, score: 0 }));
    const players = [...remotePlayers().map(p => ({ ...p, remote: true })), ...local];
    if (!players.length) { await ask(shared && room ? 'Add at least one player, or wait for someone to join on their device.' : 'Add at least one player.', { cancel: null }); return; }
    if (!gameById(view.gameId).rounds.some(R => R.categories.some(C => C.clues.some(filled)))) {
      if (!await ask('This game has no clues yet. Start anyway?', { ok: 'Start' })) return;
    }
    play = newPlay(view.gameId, players);
    savePlay(); view = { name: 'board' }; render();
  },

  // Board
  open(d) {
    const clue = playGame().rounds[play.round].categories[+d.c].clues[+d.i];
    play.clue = { token: uid(), r: play.round, c: +d.c, i: +d.i, stage: clue.dd ? 'dd' : 'clue', revealed: false, wrong: [], queue: [], open: !clue.dd };
    savePlay(); render();
  },
  'dd-pick'(d) { play.clue.ddPlayer = d.p; play.clue.err = ''; savePlay(); render(); },
  'dd-go'() {
    const vc = play.clue;
    if (!vc.ddPlayer) { vc.err = 'Pick who selected the Daily Double.'; return renderOverlay(); }
    const R = playGame().rounds[vc.r], max = Math.max(player(vc.ddPlayer).score, Math.max(...R.values));
    const w = parseInt(vc.wager);
    if (isNaN(w) || w < 0 || w > max) { vc.err = `Enter a wager between $0 and ${fmt(max)}.`; return renderOverlay(); }
    vc.wager = w; vc.stage = 'clue'; vc.err = ''; vc.open = false;
    savePlay(); render();
  },
  reveal() { play.clue.revealed = true; play.clue.open = false; savePlay(); render(); },
  right(d) { adjust(d.p, clueWorth()); markUsed(); },
  wrong(d) {
    const vc = play.clue;
    adjust(d.p, -clueWorth());
    if (vc.ddPlayer) return markUsed();
    vc.wrong.push(d.p);
    vc.queue = vc.queue.filter(x => x !== d.p);
    if (vc.wrong.length === play.players.length) { vc.revealed = true; vc.open = false; }
    savePlay(); render();
  },
  'toggle-buzz'() { play.clue.open = !play.clue.open; savePlay(); render(); },
  'reset-buzz'() { play.clue.queue = []; play.clue.token = uid(); play.clue.open = true; savePlay(); render(); },
  'clue-done'() { markUsed(); },
  'clue-cancel'() { play.clue = null; savePlay(); render(); },
  undo() {
    const e = play.log.pop();
    if (e) { const p = player(e.pid); if (p) p.score -= e.delta; savePlay(); }
    render();
  },
  async 'edit-score'(d) {
    const p = player(d.p);
    const v = await ask(`Set the score for ${p.name}:`, { input: String(p.score), ok: 'Save' });
    if (v === null) return;
    const n = parseInt(String(v).replace(/[$,\s]/g, ''));
    if (isNaN(n)) return;
    adjust(p.id, n - p.score); render();
  },
  'next-round'() {
    play.clue = null;
    if (play.round < playGame().rounds.length - 1) { play.round++; savePlay(); render(); }
    else goFinal();
  },
  'prev-round'() { if (play.round > 0) { play.clue = null; play.round--; savePlay(); render(); } },

  // Final
  'back-board'() { clearTimeout(beepTimer); play.final = null; savePlay(); view = { name: 'board' }; render(); },
  async 'f-wagers'() {
    const F = play.final;
    F.stage = 'wager'; F.submitted = {};
    if (shared && room && window.crypto?.subtle) {
      try {
        const k = await makeWagerKeys();
        F.token = uid(); F.pub = k.pub; F.priv = k.priv;
        wagerKey = { token: F.token, key: k.key };
      } catch { F.pub = null; }
    }
    savePlay(); render(); processWagers();
  },
  'f-clue'() {
    const F = play.final;
    for (const p of play.players.filter(p => p.score > 0)) {
      const w = parseInt(F.wagers[p.id]);
      if (isNaN(w) || w < 0 || w > p.score) { F.err = `${p.name}'s wager must be between $0 and ${fmt(p.score)}.`; return render(); }
      F.wagers[p.id] = w;
    }
    F.err = ''; F.stage = 'clue';
    delete F.priv; F.pub = null; wagerKey = null; wagerSeen.clear();
    savePlay(); render();
  },
  'f-timer'() {
    clearTimeout(beepTimer);
    play.final.timerEnd = Date.now() + 30000;
    beepTimer = setTimeout(() => beep(), 30000);
    savePlay(); render();
  },
  'f-reveal'() { clearTimeout(beepTimer); play.final.stage = 'reveal'; savePlay(); render(); },
  'f-judge'(d) { play.final.results[d.p] = d.v === '1'; savePlay(); render(); },
  'f-apply'() {
    const F = play.final;
    if (F.applied) return;
    for (const p of play.players.filter(p => p.id in F.results)) adjust(p.id, (F.results[p.id] ? 1 : -1) * (F.wagers[p.id] || 0));
    F.applied = true; F.stage = 'results'; savePlay(); render();
  },
  rematch() {
    play = newPlay(play.gameId, play.players.map(p => ({ id: p.id, name: p.name, score: 0, remote: p.remote })));
    savePlay(); view = { name: 'board' }; render();
  },

  // Player
  'p-join'() {
    const name = ($('#join-name')?.value ?? me.name).trim().slice(0, 24);
    if (!name) { me.err = 'Enter a name so the host knows who buzzed.'; return render(); }
    me.name = name; me.watch = false; me.joined = true; me.err = '';
    lsSet('jeoparty.name', name); lsSet('jeoparty.watch', false);
    joinPresence(); render();
  },
  'p-watch'() {
    me.watch = true; me.joined = true; me.err = '';
    lsSet('jeoparty.watch', true);
    joinPresence(); render();
  },
  'p-leave'() {
    me.joined = false;
    room?.presence({ role: null, buzz: null }).catch(() => {});
    render();
  },
  'toggle-sound'() {
    muted = !muted; lsSet('jeoparty.muted', muted);
    if (!muted) beep(880, .2);
    render();
  },
  async 'p-wager'() {
    const F = live?.final, you = live?.players?.find(p => p.id === me.pid);
    if (!F || F.stage !== 'wager' || !F.pub || !you || !room) return;
    const w = parseInt($('#fw-input')?.value ?? me.fwDraft);
    if (isNaN(w) || w < 0 || w > you.score) { me.fwErr = `Enter a wager between $0 and ${fmt(you.score)}.`; return render(); }
    me.fwBusy = true; me.fwErr = ''; me.fwDraft = String(w); render();
    try {
      const key = await crypto.subtle.importKey('spki', unb64(F.pub), ALG, false, ['encrypt']);
      const ct = await crypto.subtle.encrypt(ALG, key, new TextEncoder().encode(JSON.stringify({ t: F.token, w })));
      await room.presence({ fw: b64(ct), fwt: F.token });
      me.fwSent = { token: F.token, w };
    } catch {
      me.fwErr = "Your wager didn't go through. Try again, or tell the host.";
    }
    me.fwBusy = false;
    render();
  },
  buzz() {
    const c = live?.clue;
    if (!c || buzzState().off) return;
    me.buzzToken = c.token;
    buzzSound(!c.queue.length);
    room.presence({ buzz: c.token }).catch(() => toast('Your buzz didn’t go through. Try again.'));
    try { navigator.vibrate?.(40); } catch {}
    render();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!muted) audio(); // unlock sound inside the viewer's gesture
  if (!el || el.disabled || !$('#dialog').hidden) return;
  actions[el.dataset.act]?.(el.dataset, el);
});

function onField(e) {
  const el = e.target, d = el.dataset;
  if (role === 'player' && el.id === 'fw-input') { me.fwDraft = el.value; return; }
  if (role !== 'host') return;
  if (d.path && view.name === 'edit') {
    const g = editGame();
    const val = el.type === 'checkbox' ? el.checked : d.type === 'num' ? (parseInt(el.value) || 0) : el.value;
    setPath(g, d.path, val);
    if (d.path.endsWith('.dd')) el.closest('.cell-ed')?.classList.toggle('dd', el.checked);
    touch(g);
  } else if ('pname' in d && view.name === 'setup') {
    view.players[+d.pname] = el.value;
  } else if ('ddwager' in d && play?.clue) {
    play.clue.wager = el.value;
  } else if (d.fwager && play?.final) {
    play.final.wagers[d.fwager] = el.value;
    if (e.type === 'change') savePlay();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('keydown', e => {
  if (!$('#dialog').hidden) return;
  const typing = !!e.target.matches?.('input, textarea');
  if (role === 'player') {
    if (e.key === 'Enter' && e.target.id === 'join-name') { e.preventDefault(); actions['p-join'](); }
    else if (e.key === 'Enter' && e.target.id === 'fw-input') { e.preventDefault(); actions['p-wager'](); }
    else if (!typing && (e.key === ' ' || e.key === 'Enter') && me.joined && !me.watch) { e.preventDefault(); actions.buzz(); }
    return;
  }
  if (view.name === 'board' && play?.clue) {
    const vc = play.clue;
    if (e.key === 'Enter' && typing && 'ddwager' in e.target.dataset) { e.preventDefault(); actions['dd-go'](); return; }
    if (typing) return;
    if (e.key === ' ' && vc.stage === 'clue' && !vc.revealed) { e.preventDefault(); actions.reveal(); }
    else if (e.key === 'Escape' && !vc.ddPlayer) actions['clue-cancel']();
  } else if (view.name === 'final' && !typing && e.key === ' ' && play?.final?.stage === 'clue') {
    e.preventDefault(); actions['f-reveal']();
  }
});

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = (Array.isArray(data) ? data : [data]).map(g => normalize(g));
    list.forEach((g, n) => { g.created = Date.now() + n; games.push(g); touch(g); });
    render();
    toast(`Imported ${list.length} game${list.length > 1 ? 's' : ''}.`);
  } catch (err) {
    ask(`That file couldn't be imported: ${err.message}`, { cancel: null });
  }
});

// ---------- Live wiring ----------
const typingInApp = () => { const a = document.activeElement; return !!(a && a.matches?.('input, textarea') && $('#app').contains(a)); };

function onHostPeers({ peers }) {
  const seen = new Map(); let watch = 0;
  for (const p of peers) {
    if (p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (pr.role === 'watch') { watch++; continue; }
    if (pr.role !== 'player') continue;
    const pid = typeof pr.pid === 'string' ? pr.pid.slice(0, 40) : '';
    const name = typeof pr.name === 'string' ? pr.name.trim().slice(0, 24) : '';
    if (pid && name && !seen.has(pid)) seen.set(pid, { pid, name, buzz: typeof pr.buzz === 'string' ? pr.buzz : null });
  }
  const before = JSON.stringify([peersList.map(x => [x.pid, x.name]), watchers]);
  peersList = [...seen.values()]; watchers = watch;
  let changed = false;
  if (play && playGame()) {
    for (const x of peersList) {
      const p = player(x.pid);
      if (!p) { play.players.push({ id: x.pid, name: x.name, score: 0, remote: true }); changed = true; }
      else if (p.name !== x.name) { p.name = x.name; changed = true; }
    }
    const cl = play.clue;
    if (cl && cl.stage === 'clue' && cl.open && !cl.ddPlayer) {
      const n = cl.queue.length;
      for (const x of peersList) {
        if (x.buzz === cl.token && !cl.queue.includes(x.pid) && !cl.wrong.includes(x.pid) && player(x.pid)) cl.queue.push(x.pid);
      }
      if (cl.queue.length > n) { changed = true; buzzSound(n === 0); }
    }
  }
  if (changed) savePlay();
  const after = JSON.stringify([peersList.map(x => [x.pid, x.name]), watchers]);
  if (changed || before !== after) {
    if (view.name === 'edit' || typingInApp()) { publishLive(); if (view.name !== 'edit') needsRender = true; }
    else render();
  }
  processWagers();
}
// Catch up on a render skipped while the viewer was typing, once they leave the field.
document.addEventListener('focusout', () => setTimeout(() => {
  if (needsRender && !typingInApp() && $('#dialog').hidden) { needsRender = false; render(); }
}, 0));

let playerStarted = false;
function startPlayer() {
  if (playerStarted) return;
  playerStarted = true;
  if (db) {
    let lastToken = null, lastQueueLen = 0;
    db.doc('live/state').onSnapshot(s => {
      live = s.exists ? s.data() : null;
      const tok = live?.clue?.token || null, qLen = live?.clue?.queue?.length || 0;
      // TV screens ring for every buzz; players only hear their own (played when they press).
      if (me.joined && me.watch && tok && tok === lastToken && qLen > lastQueueLen) buzzSound(lastQueueLen === 0);
      lastToken = tok; lastQueueLen = qLen;
      if (live?.clue?.token !== me.buzzToken && me.buzzToken && live?.clue?.token) me.buzzToken = null;
      if (role !== 'player') return;
      if (typingInApp() && !(document.activeElement?.id === 'fw-input' && live?.final?.stage !== 'wager')) needsRender = true;
      else render();
    }, () => { if (role === 'player') render(); });
  }
  if (me.name || me.watch) { me.joined = true; joinPresence(); }
}

async function boot() {
  render();
  const [d, r, u, dl] = await Promise.all([use('db'), use('room'), use('user'), use('downloads')]);
  db = d; room = r; downloadsCap = dl;
  canEdit = u ? !!(await u.canEdit().catch(() => false)) : false;

  if (!db) {
    // Opened outside claude.ai: a single-screen game saved in this browser.
    role = 'host'; shared = false;
    games = (lsGet('jeoparty.games', []) || []).map(g => normalize(g, g.id));
    sortGames();
    play = lsGet('jeoparty.play', null);
    if (play && !gameById(play.gameId)) play = null;
    gamesReady = true;
    render();
    return;
  }
  if (!canEdit) {
    role = 'player';
    startPlayer();
    render();
    return;
  }
  role = 'host'; shared = true;
  room?.presence({ role: 'host' }).catch(() => {});
  room?.onPeers(onHostPeers, () => {});
  try {
    const s = await db.doc('host/play').get();
    play = s.exists ? clone(s.data()) : null;
  } catch { play = null; }
  db.collection('games').onSnapshot(snap => {
    const old = games;
    games = snap.docs.map(doc => {
      if (pendingGames.has(doc.id)) return old.find(g => g.id === doc.id) || normalize(clone(doc.data()), doc.id);
      return normalize(clone(doc.data()), doc.id);
    });
    for (const g of old) if (pendingGames.has(g.id) && !games.some(x => x.id === g.id)) games.push(g);
    sortGames();
    if (play && !gameById(play.gameId) && !snap.metadata.fromCache) { play = null; savePlay(); }
    const first = !gamesReady;
    gamesReady = true;
    if (first || (view.name !== 'edit' && !typingInApp())) render();
  }, () => { gamesReady = true; toast("Couldn't load your saved games."); render(); });
}
boot();
</script>
